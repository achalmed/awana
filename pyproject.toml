# pyproject.toml — el paquete de Python de Awana (el editor de piezas): dependencias y extras
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awana"
version = "0.1.0"
description = "Awana: el editor de piezas de la plataforma Qillqa (publicaciones con las plantillas de la marca, tipo Canva) y el registro de las piezas de prensa, que funciona dentro de Qillqa o solo con el anfitrión mínimo de Tiqsi."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = ["tiqsi", "ruray", "fastapi>=0.110", "pydantic-settings>=2", "PyJWT>=2.8", "Pillow>=10", "PyYAML>=6",
                "sqlalchemy[asyncio]>=2", "asyncpg>=0.29"]

[project.optional-dependencies]
sola = ["uvicorn[standard]>=0.30"]
pruebas = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["awana"]
