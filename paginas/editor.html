      if(rf)rf.onclick=()=>E.Banco.cargar().then(ok=>{ if(ok){toast("Banco actualizado ✓");paint();} });

      lp.querySelector("#img-selmodo").onclick=()=>{ bancoModoSel=!bancoModoSel; if(!bancoModoSel)bancoSel.clear(); paint(); };
      lp.querySelectorAll("#bancotags [data-tag]").forEach(t=>t.onclick=()=>{ bancoFiltro=t.dataset.tag; paint(); });
      const bq=lp.querySelector("#bancoq");
      if(bq)bq.oninput=()=>{ bancoQ=bq.value; paint(); const n=lp.querySelector("#bancoq"); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } };
      const bg2=lp.querySelector("#bancogrid");
      if(bg2&&banco.length){
        const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
        const q=bancoQ.toLowerCase().trim();
        const vis=(bancoFiltro?banco.filter(f=>(f.carpeta||"General")===bancoFiltro):banco)
          .filter(f=>!q||((f.name||"")+" "+(f.credito||"")+" "+(f.carpeta||"")).toLowerCase().includes(q));
        /* subgrupo = ruta de subcarpetas dentro de la etiqueta (sin el archivo) */
        const subgrupoDe=f=>{ let r=(f.name||"").split(" / ").slice(0,-1);
          if(bancoFiltro && r[0]===bancoFiltro) r=r.slice(1);
          return r.join("  ›  ") || (bancoFiltro?"· directas en la etiqueta ·":"General"); };
        /* agrupar manteniendo el orden de aparición */
        const grupos=new Map();
        vis.forEach((f,i)=>{ const g=subgrupoDe(f); if(!grupos.has(g))grupos.set(g,[]); grupos.get(g).push({f,i}); });
        const celda=(f,i)=>{ const sel=bancoSel.has(f.src);
          return `<button class="icon-cell${sel?" sel":""}" data-b="${i}" draggable="${!bancoModoSel}" title="${esc(f.name)}${f.credito?" — "+esc(f.credito):""}" style="position:relative;aspect-ratio:4/3;padding:0;overflow:hidden"><img src="${f.src}" loading="lazy" style="width:100%;height:100%;object-fit:cover;border-radius:7px">${bancoModoSel?`<span class="selmark">${sel?"✓":""}</span>`:""}</button>`; };
        let html="";
        for(const [g,items] of grupos){
          const todosSel=items.every(x=>bancoSel.has(x.f.src));
          html+=`<div class="banco-sep" style="grid-column:1/-1"><span class="sep-linea"></span>`
            +`<span class="sep-nom">${esc(g)}</span>`
            +(bancoModoSel
               ?`<button class="sep-sel${todosSel?" on":""}" data-selgrupo="${esc(g)}">${todosSel?"✓ grupo":"+ grupo"}</button>`
               :`<span class="sep-cnt">${items.length}</span>`)
            +`<span class="sep-linea"></span></div>`;
          html+=items.map(({f,i})=>celda(f,i)).join("");
        }
        bg2.innerHTML=html || `<p class="note" style="grid-column:1/-1">Sin fotos en «${esc(bancoFiltro)}».</p>`;
        bg2.querySelectorAll("[data-b]").forEach(b=>{
          const f=vis[+b.dataset.b];
          b.onclick=()=>{
            if(bancoModoSel){ if(bancoSel.has(f.src))bancoSel.delete(f.src); else bancoSel.add(f.src);
              paintLoteBar(); paintGruposSel(); b.classList.toggle("sel"); b.querySelector(".selmark").textContent=bancoSel.has(f.src)?"✓":""; return; }
            insertar(f.src, f.credito?f.name+" · "+f.credito:f.name, f.credito||""); };
          b.ondragstart=e=>{ if(bancoModoSel){e.preventDefault();return;}
            e.dataTransfer.setData("application/x-identidad-banco",JSON.stringify({src:f.src,name:f.name,credito:f.credito||""}));
            e.dataTransfer.effectAllowed="copy"; };
        });
        /* seleccionar / quitar TODO un subgrupo con un clic en su separador */
        function paintGruposSel(){ bg2.querySelectorAll("[data-selgrupo]").forEach(btn=>{
          const items=grupos.get(btn.dataset.selgrupo)||[]; const todos=items.length&&items.every(x=>bancoSel.has(x.f.src));
          btn.classList.toggle("on",todos); btn.textContent=todos?"✓ grupo":"+ grupo"; }); }
        bg2.querySelectorAll("[data-selgrupo]").forEach(btn=>btn.onclick=()=>{
          const items=grupos.get(btn.dataset.selgrupo)||[];
          const todos=items.every(x=>bancoSel.has(x.f.src));
          items.forEach(x=>{ if(todos)bancoSel.delete(x.f.src); else bancoSel.add(x.f.src); });
          paint();   // repinta con las marcas del grupo
        });
        /* barra de acciones del lote (solo en modo selección) */
        function paintLoteBar(){
          let bar=lp.querySelector("#lotebar");
          if(!bancoModoSel){ if(bar)bar.remove(); return; }
          if(!bar){ bar=document.createElement("div"); bar.id="lotebar";
            bar.style.cssText="position:sticky;bottom:0;background:var(--est-sup-3);border:1px solid var(--est-borde-control);border-radius:var(--est-radio);box-shadow:var(--est-sombra-menu);padding:8px;margin-top:8px;display:flex;gap:6px;flex-wrap:wrap";
            bg2.after(bar); }
          bar.innerHTML=`<button class="p-btn" id="lote-all" style="flex:1">Todas${bancoFiltro?" («"+bancoFiltro+"»)":""}</button>
            <button class="p-btn" id="lote-none" style="flex:1">Ninguna</button>
            <button class="p-btn" id="lote-go" style="flex:1 0 100%;background:var(--ui-acc);color:#fff;border-color:transparent;font-weight:700"${bancoSel.size?"":" disabled"}>🖼 Crear lote (${bancoSel.size})</button>`;
          bar.querySelector("#lote-all").onclick=()=>{ vis.forEach(x=>bancoSel.add(x.src)); paint(); };
          bar.querySelector("#lote-none").onclick=()=>{ bancoSel.clear(); paint(); };
          bar.querySelector("#lote-go").onclick=()=>{
            const fotos=banco.filter(x=>bancoSel.has(x.src)).map(x=>({src:x.src,name:x.name,credito:x.credito||""}));

    if(cur==="bg"){
      const bg=E.State.st.doc.bg;
      lp.innerHTML=`<div class="p-title">Fondo del lienzo</div>
        <div class="note" style="margin-bottom:6px">Modos de pieza (F6 §4.b)</div>
        <div class="chips" id="modos">${Object.entries(MODOS).map(([n,c])=>`<div class="chip" title="${n}" data-c="${c}" style="background:${c}"></div>`).join("")}</div>
        <div class="f-row" style="margin-top:12px"><label>Color</label><span id="bgsw"></span></div>
        <div class="f-row"><label>Tipo</label><select id="bgtype">
          <option value="solid" ${bg.type==="solid"?"selected":""}>Sólido</option>
          <option value="gradient" ${bg.type==="gradient"?"selected":""}>Degradado</option>
          <option value="none" ${bg.type==="none"?"selected":""}>Transparente</option></select></div>
        <p class="note">⛔ Recuerda: degradar rojo→amarillo directo está prohibido (el centro es naranja). Degrada dentro de una familia o hacia neutro.</p>`;
      lp.querySelector("#modos").addEventListener("click",e=>{const ch=e.target.closest(".chip");if(!ch)return;
        E.State.st.doc.bg={type:"solid",c1:ch.dataset.c,c2:T("fondos.blanco"),angle:180}; E.Render.all(); E.History.snap("Fondo"); paint();});
      lp.querySelector("#bgsw").appendChild(E.Color.swatchBtn(deep(bg),true,v=>{
        E.State.st.doc.bg=typeof v==="string"?{...bg,type:"solid",c1:v}:{...v,type:v.type||"solid"}; E.Render.all();}));
      lp.querySelector("#bgtype").onchange=e=>{E.State.st.doc.bg.type=e.target.value;E.Render.all();E.History.snap("Fondo");};
    }
  }
  function syncDocSel(){ const {w,h}=E.State.st.doc, v=`${w}x${h}`;
    $("#docsize").value=[...$("#docsize").options].some(o=>o.value===v)?v:"custom"; }
  /* el primer paint() se llama en ARRANQUE (E.Tpl debe existir antes) */

})();

/* ===================== ARRASTRAR Y SOLTAR ======================
   Al estilo Canva: arrastra una imagen (desde el explorador de archivos o
   desde el Banco del panel Imagen) hacia el lienzo y elige la zona:
   ▸ "Soltar como IMAGEN" → elemento independiente, centrado en la pieza.
   ▸ "Soltar como FONDO"  → objeto imagen que cubre todo el lienzo, en la
     capa inferior (mismo patrón que la plantilla "con foto": se puede velar,
     filtrar o reemplazar). Si ya hay una foto de fondo, se reemplaza su imagen.
   Los archivos soltados también se guardan en la carpeta del banco cuando el
   editor está abierto con el servidor local (abrir-editor.sh). */
E.Drop=(()=>{
  const vp=$("#viewport");
  const wrap=document.createElement("div"); wrap.id="dropzones";
  wrap.innerHTML=`
    <div class="dz-zona" data-zona="imagen"><div><span class="dz-ico">▣</span>Soltar como <b>imagen</b><small>elemento independiente en la pieza</small></div></div>
    <div class="dz-zona" data-zona="fondo"><div><span class="dz-ico">🌄</span>Soltar como <b>fondo</b><small>cubre todo el lienzo (capa inferior; puedes velarla)</small></div></div>`;
  vp.appendChild(wrap);
  /* Resaltado de REEMPLAZO (estilo Canva): al arrastrar una imagen sobre una
     foto ya usada, se resalta y ofrece «Reemplazar» — mantiene tamaño, posición
     y encuadre del elemento anterior; solo cambia la imagen. */
  const rz=document.createElement("div"); rz.id="dz-reemplazo";
  rz.innerHTML=`<span class="rz-lbl">🔄 Soltar para <b>Reemplazar</b></span>`;
  document.body.appendChild(rz);
  let objetivo=null;
  function imagenBajoCursor(cx,cy){
    const abEl=$("#artboard"); if(!abEl) return null;
    const ab=abEl.getBoundingClientRect(), st=E.State.st, sc=ab.width/st.doc.w;
    if(cx<ab.left||cx>ab.right||cy<ab.top||cy>ab.bottom||sc<=0) return null;
    const lx=(cx-ab.left)/sc, ly=(cy-ab.top)/sc;
    for(let i=st.objects.length-1;i>=0;i--){ const o=st.objects[i];
      if(o.type==="image"&&!o.hidden&&lx>=o.x&&lx<=o.x+o.w&&ly>=o.y&&ly<=o.y+o.h) return o; }
    return null;
  }
  function actualizarObjetivo(cx,cy){
    const o=imagenBajoCursor(cx,cy); objetivo=o;
    if(o){ const ab=$("#artboard").getBoundingClientRect(), sc=ab.width/E.State.st.doc.w;
      rz.style.left=(ab.left+o.x*sc)+"px"; rz.style.top=(ab.top+o.y*sc)+"px";
      rz.style.width=(o.w*sc)+"px"; rz.style.height=(o.h*sc)+"px";
      rz.classList.add("on"); wrap.classList.remove("on"); }
    else rz.classList.remove("on");
  }

  const TIPO_BANCO="application/x-identidad-banco";
  const esImagen=e=>{const t=[...((e.dataTransfer||{}).types||[])];return t.includes("Files")||t.includes(TIPO_BANCO);};
  let depth=0;
  const mostrar=()=>wrap.classList.add("on");
  const ocultar=()=>{depth=0;wrap.classList.remove("on");rz.classList.remove("on");objetivo=null;wrap.querySelectorAll(".dz-zona").forEach(z=>z.classList.remove("on"));};

  window.addEventListener("dragenter",e=>{ if(!esImagen(e))return; e.preventDefault(); depth++; mostrar(); });
  window.addEventListener("dragover",e=>{ if(!esImagen(e))return; e.preventDefault();
    actualizarObjetivo(e.clientX,e.clientY); if(!objetivo) mostrar(); });   // habilita el drop
  window.addEventListener("dragleave",e=>{ if(!esImagen(e))return; if(--depth<=0)ocultar(); });
  window.addEventListener("drop",e=>{ if(esImagen(e))e.preventDefault(); ocultar(); }); // fuera de zona = cancelar
  window.addEventListener("dragend",ocultar);

  wrap.querySelectorAll(".dz-zona").forEach(z=>{
    z.addEventListener("dragover",e=>{e.preventDefault();z.classList.add("on");});
    z.addEventListener("dragleave",()=>z.classList.remove("on"));
    z.addEventListener("drop",e=>{e.preventDefault();e.stopPropagation();const zona=z.dataset.zona;ocultar();manejar(e,zona);});
  });
  rz.addEventListener("dragover",e=>{e.preventDefault();});
  rz.addEventListener("drop",e=>{e.preventDefault();e.stopPropagation();const o=objetivo;ocultar();if(o)manejar(e,"reemplazar",o);});

  function reemplazar(o,dataURL,name,credito){
    o.src=dataURL; if(name)o.name=name;   // conserva x,y,w,h,mask,radius,filters,scale,ox,oy,rot,opacidad
    o.mejora=null;                         // foto nueva: se re-analiza desde cero
    E.Render.one(o.id); E.Layers.refresh(); E.State.setSel([o.id]); E.History.snap("Reemplazar imagen");
    toast("Imagen reemplazada ✓ (mismo espacio y encuadre)"+(credito?" — "+credito:""));
    E.Mejora.auto(o);
  }

  function insertarImagen(dataURL,name,credito,des){
    const im=new Image();
    im.onload=()=>{const c=E.State.st.doc, r=(im.width&&im.height)?im.height/im.width:0.75;
      const w=Math.round(Math.min(c.w*.6,im.width||c.w*.6)), h=Math.round(w*r);
      const o=NEW.image({src:dataURL,w,h,name:name||"Imagen"});
      o.x=Math.round((c.w-w)/2)+(des||0); o.y=Math.round((c.h-h)/2)+(des||0);
      E.State.addObj(o); E.History.snap("Añadir imagen");
      if(credito)toast("Crédito: "+credito);
      E.Mejora.auto(o);};   // realce automático si la foto viene pixelada/comprimida
    im.onerror=()=>toast("No se pudo leer la imagen");
    im.src=dataURL;
  }
  function ponerFondo(dataURL,name,credito){
    const st=E.State.st, c=st.doc, b=st.objects[0];
    const esFondo=o=>o&&o.type==="image"&&o.x<=8&&o.y<=8&&o.w>=c.w*.9&&o.h>=c.h*.9;
    let fondo;
    if(esFondo(b)){ b.src=dataURL; b.name="Fondo · "+(name||"foto"); b.mejora=null; fondo=b; }   // reemplazar la foto de fondo existente
    else{
      fondo=NEW.image({src:dataURL,name:"Fondo · "+(name||"foto"),x:0,y:0,w:c.w,h:c.h});
      E.State.addObj(fondo,false);
      st.objects.splice(st.objects.indexOf(fondo),1); st.objects.unshift(fondo);  // al fondo de la pila
    }
    E.Render.all(); E.Layers.refresh(); E.History.snap("Fondo (foto)");
    toast(credito?"Fondo aplicado — crédito: "+credito:"Fondo aplicado ✓");
    E.Mejora.auto(fondo);
  }
  async function manejar(e,zona,target){
    const dt=e.dataTransfer; if(!dt)return;
    const raw=dt.getData(TIPO_BANCO);
    if(raw){                                     // arrastrado desde el Banco del panel
      try{const f=JSON.parse(raw), dataURL=await E.Banco.fuenteADataURL(f.src);
        if(zona==="reemplazar"&&target) reemplazar(target,dataURL,f.name,f.credito);
        else zona==="fondo"?ponerFondo(dataURL,f.name,f.credito):insertarImagen(dataURL,f.name,f.credito);
      }catch(_){toast("No se pudo cargar la imagen del banco");}
      return;
    }
    const files=[...(dt.files||[])].filter(f=>f.type.startsWith("image/"));
    if(!files.length){toast("Suelta archivos de imagen (JPG, PNG, WebP…)");return;}
    if(zona==="reemplazar"&&target){ const f=files[0], rd=new FileReader();
      rd.onload=()=>{ reemplazar(target,rd.result,f.name,"");
        if(E.Banco.activo())E.Banco.subir(f.name,rd.result).then(()=>E.Banco.cargar()).catch(()=>{}); };
      rd.readAsDataURL(f); return; }
    (zona==="fondo"?files.slice(0,1):files).forEach((f,i)=>{
      const rd=new FileReader();
      rd.onload=()=>{
        zona==="fondo"?ponerFondo(rd.result,f.name,""):insertarImagen(rd.result,f.name,"",i*36);
        if(E.Banco.activo())E.Banco.subir(f.name,rd.result)   // además queda en la carpeta del despacho
          .then(()=>E.Banco.cargar().then(()=>{toast("Guardada en el banco ✓");if(E.Panels.panelActual()==="img")E.Panels.paint();}))
          .catch(()=>toast("⚠ No se pudo guardar en el banco (la imagen sí quedó en la pieza)"));
      };
      rd.readAsDataURL(f);
    });
  }
  return {insertarImagen,ponerFondo,manejar};
})();

/* ============================ MEJORA DE CALIDAD ============================
   Realce NO destructivo de fotos de baja calidad/comprimidas (típico WhatsApp)
   con el MISMO motor del servidor que usa media.html. Al insertar una foto se
   analiza y, si lo necesita, se realza sola para que la publicación no salga
   pixelada en redes. La original se guarda en o.mejora.original y se restaura
   cuando se quiera. Sin servidor no hace nada (la foto se usa tal cual). */
E.Mejora=(()=>{
  const activo=()=>E.Banco.activo();                 // ¿hay servidor?
  async function _post(ruta,cuerpo){
    const r=await fetch(ruta,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(cuerpo)});
    return await r.json();
  }
  const _cuerpo=src=>src.startsWith("data:")?{dataURL:src}:{origen:src};
  /* Aplica una mejora concreta a un objeto imagen (o.src -> versión realzada). */
  async function aplicar(o,nivel,params,avisar){
    if(!o||o.type!=="image"||!o.src||!activo())return;
    const orig=(o.mejora&&o.mejora.original)||o.src;
    let res; try{ res=await _post("api/mejorar-foto",{..._cuerpo(orig),nivel,...(params||{})}); }
    catch(_){ res=null; }
    if(!res||!res.ok){ if(avisar)toast("No se pudo mejorar: "+((res&&res.error)||"servidor")); return; }
    o.mejora={original:orig,nivel,params:params||{},info:res.analisis||{},activa:true};
    o.src=res.url;
    E.Render.all(); E.History.snap("Mejora de foto");
    if(avisar)toast("Mejora aplicada ✓"); if(E.Props&&E.Props.refresh)E.Props.refresh();
  }
  /* Automático al insertar: analiza y SOLO realza si hace falta (no toca las buenas). */
  async function auto(o){
    if(!o||o.type!=="image"||!o.src||!activo()||o._mej)return;
    if(o.mejora&&o.mejora.activa)return;
    o._mej=true;
    let res; try{ res=await _post("api/mejorar-foto",{..._cuerpo(o.src),nivel:"auto"}); }
    catch(_){ res=null; }
    o._mej=false;
    if(!res||!res.ok)return;
    const info=res.analisis||{};
    if(!info.necesita)return;                          // buena calidad: no se toca
    o.mejora={original:o.src,nivel:"auto",params:{},info,activa:true};
    o.src=res.url;
    E.Render.all(); E.History.snap("Mejora de foto");
    toast("⚠️ "+(info.etiqueta||"Calidad baja")+" — mejora aplicada ✓");
    if(E.Props&&E.Props.refresh)E.Props.refresh();
  }
  function restaurar(o){
    if(!o||!o.mejora||!o.mejora.original)return;
    o.src=o.mejora.original; o.mejora.activa=false;
    E.Render.all(); E.History.snap("Restaurar foto original"); toast("Original restaurado ↩");
    if(E.Props&&E.Props.refresh)E.Props.refresh();
  }
  return {auto,aplicar,restaurar,activo};
})();

/* ============================ PROPS ============================ */
E.Props=(()=>{
  const body=$("#rbody");
  function row(label,inner){return `<div class="f-row"><label>${label}</label>${inner}</div>`;}
  function num(id,v,w=64){return `<input type="number" id="${id}" value="${Math.round(v)}" style="width:${w}px">`;}
  function refresh(){
    if($("#rbody").dataset.tab&&$("#rbody").dataset.tab!=="props")return;
    body.dataset.tab="props";
    const sel=E.State.selObjs();
    if(!sel.length){ body.innerHTML=`<div class="p-title">Documento</div>
      <p class="note">Nada seleccionado. Clic en un objeto, o arrastra para selección múltiple.<br><br>
      <b>Atajos:</b> <kbd>Ctrl+D</kbd> duplicar · <kbd>Ctrl+G</kbd> agrupar · <kbd>Ctrl+Z</kbd> deshacer ·
      <kbd>Espacio</kbd>+arrastrar = mover lienzo · <kbd>Ctrl</kbd>+rueda = zoom · doble clic = editar texto.</p>`;
      if(E.Avz)E.Avz.propsExtra(body,sel);   // documento: cambiar tamaño, fondo…
      return; }
    if(sel.length>1){
      const bx=Math.min(...sel.map(o=>o.x)), by=Math.min(...sel.map(o=>o.y));
      const bw=Math.max(...sel.map(o=>o.x+o.w))-bx, bh=Math.max(...sel.map(o=>o.y+o.h))-by;
      const enGrupo=sel[0].groupId&&sel.every(o=>o.groupId===sel[0].groupId);
      body.innerHTML=`<div class="p-title">${sel.length} objetos${enGrupo?" · grupo 🔗":""}</div>
        <div class="f-mini">
          <button class="mini-btn" data-a="up" title="Traer adelante">▲</button>
          <button class="mini-btn" data-a="down" title="Enviar atrás">▼</button>
          <button class="mini-btn" data-a="dup" title="Duplicar (Ctrl+D)">⧉</button>
          <button class="mini-btn" data-a="del" title="Eliminar">🗑</button></div>
        <div class="f-mini">
          <button class="mini-btn ${enGrupo?"on":""}" data-a="group" title="Agrupar (Ctrl+G)">🔗 Agrupar</button>

          <button class="mini-btn ${o.underline?"on":""}" data-t="underline"><u>S</u></button>
          <button class="mini-btn ${o.upper?"on":""}" data-t="upper">AA</button>

        <div class="f-mini">
          <button class="mini-btn ${o.align==="left"?"on":""}" data-a2="left">⟸</button>

        row("Color","<span id='t-color'></span>"+`<label style="width:auto" title="Degradado">Grad.</label><input type="checkbox" id="t-grad" ${o.colorG.on?"checked":""}>`)+

        row("Sombra",`<input type="checkbox" id="s-shadow" ${o.shadow.on?"checked":""}>`);
    }
    if(o.type==="icon"){

          <option value="circle" ${o.mask==="circle"?"selected":""}>Círculo</option>
          ${o.maskD?`<option value="path" ${o.mask==="path"?"selected":""}>Forma del marco</option>`:""}</select></div>`+
        (o.mask==="round"?row("Radio",num("m-radius",o.radius)):"")+
        row("Zoom",`<input type="range" id="m-scale" min="100" max="300" value="${o.scale*100}" style="flex:1">`)+
        row("Posición",num("m-ox",o.ox,52)+num("m-oy",o.oy,52))+
        `<div class="p-title" style="margin-top:10px">Ajustes</div>`+

        row("Contraste",`<input type="range" id="m-ct" min="40" max="180" value="${o.filters.ct}" style="flex:1">`)+
        row("Saturación",`<input type="range" id="m-sat" min="0" max="200" value="${o.filters.sat}" style="flex:1">`)+
        row("Desenfoque",`<input type="range" id="m-blur" min="0" max="14" value="${o.filters.blur}" style="flex:1">`)+
        `<div class="f-mini"><button class="mini-btn" data-fl="bn">B/N</button><button class="mini-btn" data-fl="calido">Cálido</button><button class="mini-btn" data-fl="doc">Documental</button><button class="mini-btn" data-fl="reset">Reset</button></div>`+
        (()=>{ const mej=o.mejora, srv=E.Mejora.activo();
          let s=`<div class="p-title" style="margin-top:10px">Mejora de calidad</div>`;
          if(mej&&mej.activa){
            const et=(mej.info&&mej.info.etiqueta)||"Calidad baja";
            s+=`<div class="note" style="color:var(--est-exito)">✓ ${et} — foto mejorada</div>`
              +`<div class="f-mini"><button class="mini-btn${mej.nivel==="suave"?" on":""}" data-mej="suave">Suave</button>`
              +`<button class="mini-btn${mej.nivel==="auto"?" on":""}" data-mej="auto">Auto</button>`
              +`<button class="mini-btn${mej.nivel==="intensiva"?" on":""}" data-mej="intensiva">Intensiva</button>`
              +`<button class="mini-btn" data-mejrest style="grid-column:span 3">↩ Restaurar original</button></div>`;
          } else if(srv){
            s+=`<div class="f-mini"><button class="mini-btn" data-mej="auto" style="grid-column:span 3">✨ Mejorar calidad de la foto</button></div>`;
          } else {
            s+=`<p class="note">Enciende el servidor para realzar fotos de baja calidad.</p>`;

    }
    body.innerHTML=html;
    hookCommon(sel); hookType(o);
    if(E.Avz)E.Avz.propsExtra(body,sel);   // estilo, efectos, marco, recorte, datos de un compuesto
    if(o&&o.type==="image"){
      body.querySelectorAll("[data-mej]").forEach(b=>b.onclick=()=>E.Mejora.aplicar(o,b.dataset.mej,null,true));
      const br=body.querySelector("[data-mejrest]"); if(br)br.onclick=()=>E.Mejora.restaurar(o);
    }
  }
  function hookCommon(sel){
    const upd=(fn,label)=>{sel.forEach(fn);E.Render.all();E.History.snap(label||"Editar");refresh();};
    body.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{
      const a=b.dataset.a, st=E.State.st;
      if(a==="dup")E.Keys.duplicate();
      if(a==="del")E.State.remove(st.sel),E.History.snap("Eliminar");
      if(a==="group"){const g=uid();upd(o=>o.groupId=g,"Agrupar");}
      if(a==="ungroup")upd(o=>delete o.groupId,"Desagrupar");
      if(a==="lock")upd(o=>o.locked=!o.locked,"Bloquear");
      if(a==="up"){st.sel.forEach(id=>{const i=st.objects.findIndex(o=>o.id===id);
        if(i<st.objects.length-1)[st.objects[i],st.objects[i+1]]=[st.objects[i+1],st.objects[i]];});
        E.Render.all();E.History.snap("Orden");E.Layers.refresh();}
      if(a==="down"){st.sel.forEach(id=>{const i=st.objects.findIndex(o=>o.id===id);
        if(i>0)[st.objects[i],st.objects[i-1]]=[st.objects[i-1],st.objects[i]];});
        E.Render.all();E.History.snap("Orden");E.Layers.refresh();}
      if(a==="imgrep")E.Panels.pickImage(src=>{sel[0].src=src;E.Render.all();E.History.snap("Imagen");});
    });
    body.querySelectorAll("[data-al]").forEach(b=>b.onclick=()=>{
      const d=E.State.st.doc;
      upd(o=>{const k=b.dataset.al;
        if(k==="l")o.x=0; if(k==="c")o.x=Math.round((d.w-o.w)/2);
        if(k==="r")o.x=d.w-o.w; if(k==="m")o.y=Math.round((d.h-o.h)/2);},"Alinear");});
    const bind=(id,fn)=>{const el=body.querySelector("#"+id);if(el)el.onchange=()=>{fn(el);E.Render.all();E.History.snap("Editar");};};
    ["x","y","w","h","rot"].forEach(k=>bind("p-"+k,el=>sel.forEach(o=>o[k==="rot"?"rot":k]=+el.value)));
    const op=body.querySelector("#p-op"); if(op)op.oninput=()=>{sel.forEach(o=>o.opacity=op.value/100);sel.forEach(o=>E.Render.one(o.id));};
    if(op)op.onchange=()=>E.History.snap("Opacidad");
  }
  /* Manipulación CONJUNTA de varios objetos: alinear entre sí, distribuir,
     y mover/escalar el grupo por X/Y/W/H (además de los botones comunes). */
  function hookMulti(sel){
    hookCommon(sel);   // data-a: agrupar/desagrupar/duplicar/eliminar/orden
    const bbox=()=>{ const s=E.State.selObjs(); if(!s.length)return null;
      const x=Math.min(...s.map(o=>o.x)), y=Math.min(...s.map(o=>o.y));
      return {x,y,w:Math.max(...s.map(o=>o.x+o.w))-x, h:Math.max(...s.map(o=>o.y+o.h))-y, objs:s}; };
    body.querySelectorAll("[data-alg]").forEach(b=>b.onclick=()=>{ const k=b.dataset.alg, B=bbox(); if(!B)return;
      B.objs.forEach(o=>{
        if(k==="l")o.x=B.x; else if(k==="cx")o.x=Math.round(B.x+(B.w-o.w)/2); else if(k==="r")o.x=B.x+B.w-o.w;
        else if(k==="t")o.y=B.y; else if(k==="cy")o.y=Math.round(B.y+(B.h-o.h)/2); else if(k==="b")o.y=B.y+B.h-o.h; });
      E.Render.all(); E.History.snap("Alinear"); refresh(); });
    body.querySelectorAll("[data-dist]").forEach(b=>b.onclick=()=>{ const eje=b.dataset.dist;
      const s=E.State.selObjs().slice().sort((a,c)=>eje==="h"?(a.x-c.x):(a.y-c.y));
      if(s.length<3){ toast("Distribuir necesita 3 o más objetos"); return; }
      const B=bbox();
      if(eje==="h"){ const gap=(B.w-s.reduce((t,o)=>t+o.w,0))/(s.length-1); let x=B.x;
        s.forEach(o=>{o.x=Math.round(x); x+=o.w+gap;}); }
      else { const gap=(B.h-s.reduce((t,o)=>t+o.h,0))/(s.length-1); let y=B.y;
        s.forEach(o=>{o.y=Math.round(y); y+=o.h+gap;}); }
      E.Render.all(); E.History.snap("Distribuir"); refresh(); });
    const gb=(id,fn)=>{ const el=body.querySelector("#"+id); if(el)el.onchange=()=>{ fn(+el.value); E.Render.all(); E.History.snap("Editar"); refresh(); }; };
    gb("g-x",v=>{ const B=bbox(),d=v-B.x; B.objs.forEach(o=>o.x+=d); });
    gb("g-y",v=>{ const B=bbox(),d=v-B.y; B.objs.forEach(o=>o.y+=d); });
    gb("g-w",v=>{ const B=bbox(),f=Math.max(.05,v/Math.max(1,B.w));
      B.objs.forEach(o=>{ o.x=Math.round(B.x+(o.x-B.x)*f); o.w=Math.max(4,Math.round(o.w*f)); if(o.type==="text")o.size=Math.max(6,Math.round(o.size*f)); }); });
    gb("g-h",v=>{ const B=bbox(),f=Math.max(.05,v/Math.max(1,B.h));
      B.objs.forEach(o=>{ o.y=Math.round(B.y+(o.y-B.y)*f); o.h=Math.max(4,Math.round(o.h*f)); }); });
  }
  function hookType(o){
    const B=id=>body.querySelector("#"+id);
    const commit=l=>{E.Render.all();E.History.snap(l||"Editar");};
    if(o.type==="text"){
      B("t-font").onchange=e=>{o.font=e.target.value;commit("Fuente");};
      B("t-size").onchange=e=>{o.size=+e.target.value;commit();};
      B("t-weight").onchange=e=>{o.weight=+e.target.value;commit();};
      body.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{o[b.dataset.t]=!o[b.dataset.t];commit();refresh();});
      body.querySelectorAll("[data-a2]").forEach(b=>b.onclick=()=>{o.align=b.dataset.a2;commit();refresh();});
      B("t-color").appendChild(E.Color.swatchBtn(o.colorG.on?{type:"gradient",c1:o.color,c2:o.colorG.c2,angle:o.colorG.angle}:o.color,true,v=>{
        if(typeof v==="string"){o.color=v;o.colorG.on=false;} else {o.color=v.c1;o.colorG={on:v.type==="gradient",c2:v.c2,angle:v.angle};}
        E.Render.all();}));
      B("t-grad").onchange=e=>{o.colorG.on=e.target.checked;commit();};
      B("t-lh").onchange=e=>{o.lh=+e.target.value;commit();};
      B("t-ls").onchange=e=>{o.ls=+e.target.value;commit();};
      B("t-shadow").onchange=e=>{o.shadow.on=e.target.checked;commit();};
      B("t-outline").onchange=e=>{o.outline.w=+e.target.value;commit();};
    }
    if(o.type==="shape"){
      B("s-fill").appendChild(E.Color.swatchBtn(o.fill.type==="gradient"?deep(o.fill):o.fill.c1,true,v=>{
        if(typeof v==="string")Object.assign(o.fill,{type:"solid",c1:v}); else o.fill=v; E.Render.all();}));
      B("s-ftype").onchange=e=>{o.fill.type=e.target.value;commit();};
      B("s-stroke").appendChild(E.Color.swatchBtn(o.stroke.c,false,v=>{o.stroke.c=v;E.Render.all();}));
      B("s-sw").onchange=e=>{o.stroke.w=+e.target.value;commit();};
      if(B("s-radius"))B("s-radius").onchange=e=>{o.radius=+e.target.value;commit();};
      if(B("s-points"))B("s-points").onchange=e=>{o.points=clamp(+e.target.value,3,20);commit();};
      if(B("s-inner"))B("s-inner").oninput=e=>{o.inner=e.target.value/100;E.Render.one(o.id);};
      B("s-shadow").onchange=e=>{o.shadow.on=e.target.checked;commit();};
    }
    if(o.type==="icon"){
      B("i-color").appendChild(E.Color.swatchBtn(o.color,false,v=>{o.color=v;E.Render.all();}));
      B("i-sw").oninput=e=>{o.sw=+e.target.value;B("i-swv").textContent=o.sw;E.Render.one(o.id);};
      B("i-sw").onchange=()=>E.History.snap("Ícono");
    }
    if(o.type==="image"){
      B("m-mask").onchange=e=>{o.mask=e.target.value;commit();refresh();};
      if(B("m-radius"))B("m-radius").onchange=e=>{o.radius=+e.target.value;commit();};
      const live=(id,fn)=>{const el=B(id);if(!el)return;el.oninput=()=>{fn(el);E.Render.one(o.id);};el.onchange=()=>E.History.snap("Imagen");};
      live("m-scale",el=>o.scale=el.value/100); live("m-ox",el=>o.ox=+el.value); live("m-oy",el=>o.oy=+el.value);
      live("m-br",el=>o.filters.br=+el.value); live("m-ct",el=>o.filters.ct=+el.value);
      live("m-sat",el=>o.filters.sat=+el.value); live("m-blur",el=>o.filters.blur=+el.value);
      body.querySelectorAll("[data-fl]").forEach(b=>b.onclick=()=>{
        const k=b.dataset.fl;
        if(k==="bn")o.filters={br:104,ct:108,sat:0,blur:0};
        if(k==="calido")o.filters={br:104,ct:104,sat:112,blur:0};
        if(k==="doc")o.filters={br:100,ct:112,sat:92,blur:0};
        if(k==="reset")o.filters={br:100,ct:100,sat:100,blur:0};
        commit("Filtro");refresh();});
    }
  }
  function softRefresh(){ const o=E.State.selObjs()[0]; if(!o)return;
    ["x","y","w","h"].forEach(k=>{const el=$("#p-"+k);if(el)el.value=Math.round(o[k]);});
    const r=$("#p-rot");if(r)r.value=Math.round(o.rot||0); }
  return {refresh,softRefresh};
})();

/* ============================ LAYERS + HIST ==================== */
E.Layers=(()=>{
  const body=$("#rbody");
  let q="";
  $$(".rtab").forEach(t=>t.onclick=()=>{
    $$(".rtab").forEach(x=>x.classList.toggle("on",x===t));
    body.dataset.tab=t.dataset.rt;
    if(t.dataset.rt==="props")E.Props.refresh();
    if(t.dataset.rt==="layers")refresh(true);
    if(t.dataset.rt==="hist")renderHist();
  });
  const TI={text:"T",shape:"▲",icon:"◈",image:"▣"};
  function refresh(force){
    if(body.dataset.tab!=="layers")return;
    const st=E.State.st;
    body.innerHTML=`<div class="p-title">Capas (${st.objects.length})</div>
      <input type="text" id="lq" placeholder="Buscar capa…" value="${q}" style="width:100%;margin-bottom:8px">
      <div id="llist">`+
      [...st.objects].reverse().filter(o=>!q||o.name.toLowerCase().includes(q.toLowerCase()))
      .map(o=>`<div class="layer ${st.sel.includes(o.id)?"sel":""}" data-id="${o.id}" draggable="true" title="Arrastra para cambiar el orden">
        <span class="ltype">${TI[o.type]||"?"}</span>
        <span class="lname" title="Doble clic para renombrar">${o.name}</span>
        <button class="lbtn${o.hidden?" on":""}" data-l="hide" title="${o.hidden?"Mostrar":"Ocultar"}" aria-label="${o.hidden?"Mostrar":"Ocultar"}">${icono(o.hidden?"ojo-cerrado":"ojo","ico--sm")}</button>
        <button class="lbtn${o.locked?" on":""}" data-l="lock" title="${o.locked?"Desbloquear":"Bloquear"}" aria-label="${o.locked?"Desbloquear":"Bloquear"}">${icono(o.locked?"candado":"candado-abierto","ico--sm")}</button>
        <button class="lbtn" data-l="up" title="Subir" aria-label="Subir">${icono("flecha-arriba","ico--sm")}</button><button class="lbtn" data-l="down" title="Bajar" aria-label="Bajar">${icono("flecha-abajo","ico--sm")}</button>
      </div>`).join("")+`</div>`;
    body.querySelector("#lq").oninput=e=>{q=e.target.value;refresh(true);};
    /* Arrastrar una capa para reordenar (la lista va de arriba a abajo = de delante hacia atrás). */
    let arrastrada=null;
    body.querySelectorAll(".layer").forEach(el=>{
      el.ondragstart=e=>{ arrastrada=el.dataset.id; e.dataTransfer.effectAllowed="move"; e.dataTransfer.setData("text/plain",arrastrada); el.classList.add("arrastrando"); };
      el.ondragend=()=>{ arrastrada=null; body.querySelectorAll(".layer").forEach(x=>x.classList.remove("arrastrando","antes","despues")); };
      el.ondragover=e=>{ if(!arrastrada||arrastrada===el.dataset.id)return; e.preventDefault();
        const r=el.getBoundingClientRect(), antes=e.clientY<r.top+r.height/2;
        el.classList.toggle("antes",antes); el.classList.toggle("despues",!antes); };
      el.ondragleave=()=>el.classList.remove("antes","despues");
      el.ondrop=e=>{ e.preventDefault(); if(!arrastrada||arrastrada===el.dataset.id)return;
        const st=E.State.st, r=el.getBoundingClientRect(), antes=e.clientY<r.top+r.height/2;
        const mov=st.objects.find(o=>o.id===arrastrada); if(!mov)return;
        st.objects=st.objects.filter(o=>o!==mov);
        const j=st.objects.findIndex(o=>o.id===el.dataset.id);
        st.objects.splice(antes?j+1:j,0,mov);   // «antes» en la lista = más adelante en la pila
        E.Render.all(); refresh(true); E.History.snap("Orden de capas"); };
    });

  }
  function renderHist(){
    if(body.dataset.tab!=="hist")return;
    body.innerHTML=`<div class="p-title">Historial</div>`+
      E.History.stack.map((s,i)=>`<div class="hist-item ${i===E.History.idx?"cur":""}" data-i="${i}">${i+1}. ${s.label}</div>`).join("");
    body.querySelectorAll(".hist-item").forEach(el=>el.onclick=()=>E.History.restore(+el.dataset.i));
  }
  return {refresh,renderHist};

     t({name:"Kicker derecho",text:"GESTIÓN 2026 — CARGO O CIRCUNSCRIPCIÓN",font:"Archivo",weight:700,size:13,x:530,y:50,w:700,color:P.bg,upper:true,ls:2});
     const ph=(window.BANCO||[]).find(b=>/busto/i.test(b.name||""))||(window.BANCO||[]).find(b=>/retrato/i.test(b.name||""));
     o.push(NEW.image({name:"Foto del titular (doble clic: cambiar)",x:850,y:200,w:430,h:520,src:ph?ph.src:null,mask:"none"}));
     return {pal:"Vino",doc:{w:1280,h:720,bg:{type:"gradient",c1:P.bg,c2:P.deep,angle:180}},objects:o};}},
  ];
  /* ---- persistencia ---- */
  const mine=()=>{try{return JSON.parse(E.Store.get(LSK)||"[]");}catch(_){return [];}};
  const saveMine=l=>E.Store.set(LSK,JSON.stringify(l));
  const dla=(href,name)=>{const a=document.createElement("a");a.href=href;a.download=name;a.click();};
  function setPiece(t,label){
    E.State.st.doc=deep(t.doc); E.State.st.objects=deep(t.objects).map(o=>({...o,id:uid(),...(o.type==="text"?{text:rellenarMarcadores(o.text)}:{})}));
    E.State.st.pal=t.pal||E.State.st.pal; E.State.st.palVar=0; E.State.st.palRoles=null;
    E.State.setSel([]); E.View.applyDocSize(); E.Render.all(); E.View.fit();
    E.Panels.syncDocSel(); E.History.snap(label);
  }
  function loadBrand(i){ const d=brand[i]; if(!d)return;
    setPiece(d.make(),"Plantilla: "+d.name); toast("Plantilla: "+d.name); }
  /* restaura también la variación de color guardada con la plantilla */
  function loadMine(i){ const t=mine()[i]; if(!t)return; setPiece(t,"Plantilla: "+t.name);
    E.State.st.palVar=t.palVar||0; E.State.st.palRoles=t.palRoles||null; }
  const _get=k=>{try{return JSON.parse(E.Store.get(k));}catch(_){return null;}};
  /* instantánea completa de la pieza actual (incluye la variación de color) */
  const _snap=name=>({name,pal:E.State.st.pal,palVar:E.State.st.palVar,palRoles:E.State.st.palRoles,
    doc:deep(E.State.st.doc),objects:deep(E.State.st.objects)});
  /* (1) GUARDAR COMO NUEVA — crea una variante en «Mis plantillas», sin tocar originales */
  function saveAsNew(){
    const n=prompt("Nombre de la nueva plantilla:", "Mi plantilla "+(mine().length+1));
    if(!n)return;
    const l=mine(), ix=l.findIndex(t=>t.name===n), t=_snap(n);
    if(ix>=0){ if(!confirm(`Ya existe "${n}". ¿Sobrescribirla?`))return; l[ix]=t; }
    else l.push(t);
    try{saveMine(l); toast(`Guardada en «Mis plantillas»: ${n} ✓`);}
    catch(_){toast("⚠ Sin espacio local: usa Respaldar TODO y limpia plantillas viejas");}
    E.Panels.paint();
  }
  /* (2) GUARDAR COMO PREDETERMINADA — se abrirá sola la próxima vez */
  function saveDefault(){
    E.Store.set(DEFK,JSON.stringify(_snap("(predeterminada)")));
    toast("Predeterminada guardada ⭐ — arriba en «Mis plantillas» y se abre sola al empezar de cero"); E.Panels.paint();
  }
  const getDefault=()=>_get(DEFK);
  function clearDefault(){ E.Store.remove(DEFK);
    toast("Predeterminada quitada — al abrir volverá la 1.ª plantilla"); E.Panels.paint(); }
  function loadDefault(){ const t=getDefault(); if(!t||!t.objects)return false;
    setPiece(t,"Predeterminada"); E.State.st.palVar=t.palVar||0; E.State.st.palRoles=t.palRoles||null; return true; }
  const saveCurrent=saveAsNew;  /* Ctrl+S mantiene el gesto clásico = guardar como nueva */
  function remove(i){ const l=mine(); l.splice(i,1); saveMine(l); }
  function duplicate(i){ const l=mine(); const c=deep(l[i]); c.name+=" (copia)"; l.push(c); saveMine(l); }
  function exportJson(i){ const t=mine()[i];
    dla("data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(t)),
      t.name.replace(/\s+/g,"-").toLowerCase()+".pieza.json"); }
  function importJson(cb){ const inp=document.createElement("input"); inp.type="file"; inp.accept=".json";
    inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();
      r.onload=()=>{try{const t=JSON.parse(r.result);
        if(t.tipo==="identidad-respaldo"){const l=mine();(t.plantillas||[]).forEach(p=>l.push(p));saveMine(l);toast("Respaldo importado: "+(t.plantillas||[]).length+" plantillas");}
        else if(t.doc&&t.objects){const l=mine(); l.push(t); saveMine(l); toast("Plantilla importada ✓");}
        else throw 0; cb&&cb();}
        catch(_){toast("Archivo no válido");}};
      r.readAsText(f);};

  function backupAll(){

  return {brand,mine,loadBrand,loadMine,saveCurrent,saveAsNew,saveDefault,getDefault,clearDefault,loadDefault,remove,duplicate,exportJson,importJson,backupAll,restoreBackup};
})();

/* ===================== MIS EDICIONES (trabajos + páginas, tipo Canva) =========
   Una EDICIÓN es un trabajo concreto con una o varias PÁGINAS. Se autoguarda y se
   reutiliza. Las plantillas (E.Tpl) NUNCA se tocan: al partir de una, se crea una
   edición independiente. Cada página conserva doc+objetos+paleta (todo editable). */
E.Ediciones=(()=>{
  const LSK="identidad_editor_ediciones_v1", CURK="identidad_editor_edicion_actual_v1";
  const _esc=s=>String(s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const lista=()=>{ try{return JSON.parse(E.Store.get(LSK))||[]}catch(_){return[]} };
  function guardarLista(a){ return E.Store.set(LSK,JSON.stringify(a)); }
  let actual=null, _t=0;
  const snapPag=()=>({doc:deep(E.State.st.doc),objects:deep(E.State.st.objects),
    pal:E.State.st.pal,palVar:E.State.st.palVar,palRoles:E.State.st.palRoles});
  function cargarPag(p){
    E.State.st.doc=deep(p.doc); E.State.st.objects=deep(p.objects||[]).map(o=>({...o,id:uid()}));
    E.State.st.pal=p.pal||E.State.st.pal; E.State.st.palVar=p.palVar||0; E.State.st.palRoles=p.palRoles||null;
    E.State.setSel([]); E.View.applyDocSize(); E.Render.all(); E.View.fit();
    if(E.Panels.syncDocSel)E.Panels.syncDocSel();
  }
  function sincronizar(){ if(actual&&actual.paginas[actual.pag]) actual.paginas[actual.pag]=snapPag(); }
  function persistir(){ if(!actual)return; sincronizar(); actual.fecha=Date.now();
    const a=lista(), i=a.findIndex(e=>e.id===actual.id);
    if(i>=0)a[i]=actual; else a.unshift(actual);
    guardarLista(a); E.Store.set(CURK,actual.id);
    pintarPaginas(); }
  function autosave(){ if(!actual)return; clearTimeout(_t); _t=setTimeout(persistir,700); }
  function nueva(nombre,pagina){
    actual={id:"e"+Date.now()+"-"+Math.floor(Math.random()*1e4),
      nombre:nombre||("Edición · "+new Date().toLocaleDateString("es-PE")),
      fecha:Date.now(),favorito:false,archivado:false,paginas:[pagina||snapPag()],pag:0};
    persistir(); return actual;
  }
  function abrir(id){ const e=lista().find(x=>x.id===id); if(!e)return false;
    actual=deep(e); actual.pag=Math.min(actual.pag||0,(actual.paginas.length||1)-1);
    cargarPag(actual.paginas[actual.pag]); E.History.snap("Edición: "+actual.nombre);
    E.Store.set(CURK,id); pintarPaginas();
    toast("Edición abierta: "+actual.nombre); return true; }
  function duplicar(id){ const e=lista().find(x=>x.id===id)||actual; if(!e)return null;
    const c=deep(e); c.id="e"+Date.now()+"-"+Math.floor(Math.random()*1e4);
    c.nombre=e.nombre.replace(/ \(copia.*\)$/,"")+" (copia)"; c.fecha=Date.now(); c.favorito=false; c.archivado=false;
    const a=lista(); a.unshift(c); guardarLista(a); toast("Edición duplicada: "+c.nombre); return c; }
  function renombrar(id,nombre){ nombre=(nombre||"").trim(); if(!nombre)return;
    if(actual&&actual.id===id)actual.nombre=nombre;
    const a=lista(),i=a.findIndex(x=>x.id===id); if(i>=0){a[i].nombre=nombre;guardarLista(a);} pintarPaginas(); }
  function favorito(id){ const a=lista(),i=a.findIndex(x=>x.id===id);
    if(i>=0){a[i].favorito=!a[i].favorito; if(actual&&actual.id===id)actual.favorito=a[i].favorito; guardarLista(a);} }
  function archivar(id){ const a=lista(),i=a.findIndex(x=>x.id===id);
    if(i>=0){a[i].archivado=!a[i].archivado; if(actual&&actual.id===id)actual.archivado=a[i].archivado; guardarLista(a);} }
  function borrar(id){ guardarLista(lista().filter(x=>x.id!==id));
    if(actual&&actual.id===id){actual=null; E.Store.remove(CURK); pintarPaginas();} }
  /* ---- PÁGINAS / variantes ---- */
  function nuevaPagina(copia){ if(!actual)nueva(); sincronizar();
    const p= copia ? deep(actual.paginas[actual.pag])
      : {doc:deep(E.State.st.doc),objects:[],pal:E.State.st.pal,palVar:E.State.st.palVar,palRoles:E.State.st.palRoles};
    actual.paginas.splice(actual.pag+1,0,p); actual.pag++;
    cargarPag(actual.paginas[actual.pag]); E.History.snap(copia?"Página duplicada (variante)":"Nueva página"); persistir();
    toast(copia?"Variante creada (página "+(actual.pag+1)+")":"Nueva página "+(actual.pag+1)); }
  function irPagina(i){ if(!actual||i<0||i>=actual.paginas.length||i===actual.pag)return;
    sincronizar(); actual.pag=i; cargarPag(actual.paginas[i]); E.History.snap("Página "+(i+1)); persistir(); }
  function borrarPagina(){ if(!actual||actual.paginas.length<=1)return;
    actual.paginas.splice(actual.pag,1); actual.pag=Math.max(0,actual.pag-1);
    cargarPag(actual.paginas[actual.pag]); E.History.snap("Página eliminada"); persistir(); }
  /* mover la página «de» a la posición «a» (tira de páginas: reordenar un carrusel) */
  function moverPagina(de,a){ if(!actual||de===a||a<0||a>=actual.paginas.length)return; sincronizar();
    const [p]=actual.paginas.splice(de,1); actual.paginas.splice(a,0,p);
    if(actual.pag===de)actual.pag=a; else if(de<actual.pag&&a>=actual.pag)actual.pag--; else if(de>actual.pag&&a<=actual.pag)actual.pag++;
    E.History.snap("Orden de páginas"); persistir(); }
  /* ---- barra de PÁGINAS (flotante, estilo Canva) ---- */
  function pintarPaginas(){
    let bar=document.getElementById("pagesbar");
    if(!bar){ bar=document.createElement("div"); bar.id="pagesbar"; document.body.appendChild(bar); }
    if(!actual){ bar.style.display="none"; return; }
    /* tira con miniaturas (editor-avanzado.js); la barra numérica de abajo queda de reserva */
    if(E.Avz&&E.Avz.tiraPaginas){ bar.style.display="flex"; E.Avz.tiraPaginas(bar,actual); return; }
    bar.style.display="flex";
    bar.innerHTML=`<span class="pg-nom" id="pg-nom" title="Clic para renombrar la edición">📝 ${_esc(actual.nombre)}</span>`
      +`<span class="pg-sep"></span>`
      +actual.paginas.map((p,i)=>`<button class="pg-btn${i===actual.pag?" on":""}" data-pg="${i}" title="Página ${i+1}">${i+1}</button>`).join("")
      +`<button class="pg-ic" id="pg-add" title="Nueva página en blanco">＋</button>`
      +`<button class="pg-ic" id="pg-dup" title="Duplicar esta página (variante)">⧉</button>`
      +(actual.paginas.length>1?`<button class="pg-ic" id="pg-del" title="Eliminar esta página">🗑</button>`:"");
    bar.querySelector("#pg-nom").onclick=()=>{ const n=prompt("Nombre de la edición:",actual.nombre); if(n)renombrar(actual.id,n); };
    bar.querySelectorAll("[data-pg]").forEach(b=>b.onclick=()=>irPagina(+b.dataset.pg));
    const add=bar.querySelector("#pg-add"); if(add)add.onclick=()=>nuevaPagina(false);
    const dup=bar.querySelector("#pg-dup"); if(dup)dup.onclick=()=>nuevaPagina(true);
    const del=bar.querySelector("#pg-del"); if(del)del.onclick=()=>borrarPagina();
  }
  return {lista,nueva,abrir,duplicar,renombrar,favorito,archivar,borrar,
    nuevaPagina,irPagina,borrarPagina,moverPagina,persistir,autosave,pintarPaginas,sincronizar,
    get actual(){return actual;}, set actual(v){actual=v;}, snapPag};
})();

/* Partir de una PLANTILLA crea una EDICIÓN nueva e independiente (la plantilla
   original nunca se modifica). Así cada trabajo es su propia copia editable. */
(function(){
  const _lb=E.Tpl.loadBrand, _lm=E.Tpl.loadMine;

    E.Ediciones.nueva(((d&&d.name)||"Edición")+" · "+hoy()); };
  E.Tpl.loadMine=function(i){ _lm(i); const d=E.Tpl.mine()[i];
    E.Ediciones.nueva(((d&&d.name)||"Edición")+" · "+hoy()); };
})();

/* ============================ EXPORT =========================== */
E.Export=(()=>{
  async function ensureFonts(){
    const l=[]; E.State.st.objects.forEach(o=>{ if(o.type==="text")
      l.push(document.fonts.load(`${o.italic?"italic ":""}${o.weight} 16px '${o.font}'`)); });
    try{ await Promise.all(l); await document.fonts.ready; }catch(_){}
  }
  function loadImgs(){
    const ps=[]; const map={};
    E.State.st.objects.forEach(o=>{ if(o.type==="image"&&o.src){
      ps.push(new Promise(res=>{const im=new Image(); im.onload=()=>{map[o.id]=im;res();};
        im.onerror=()=>res(); im.src=o.src;}));}});
    return Promise.all(ps).then(()=>map);
  }
  function wrap(ctx,text,maxW){
    const out=[]; text.split("\n").forEach(par=>{
      const words=par.split(" "); let line="";
      words.forEach(w=>{ const t=line?line+" "+w:w;
        if(ctx.measureText(t).width<=maxW||!line)line=t; else {out.push(line);line=w;} });
      out.push(line);});
    return out;
  }
  function drawObj(ctx,o,s,imgs){
    ctx.save();
    ctx.globalAlpha=o.opacity??1;
    ctx.translate((o.x+o.w/2)*s,(o.y+o.h/2)*s);
    ctx.rotate((o.rot||0)*Math.PI/180);
    ctx.translate(-o.w/2*s,-o.h/2*s);
    if(o.type==="text"&&Arco.activo(o)){ Arco.pintar(ctx,o,s); ctx.restore(); return; }
    if(o.type==="text"){
      const size=o.size*s;
      ctx.font=`${o.italic?"italic ":""}${o.weight} ${size}px '${o.font}', sans-serif`;
      try{ctx.letterSpacing=(o.ls*s)+"px";}catch(_){}
      const txt=o.upper?o.text.toUpperCase():o.text;
      const lines=wrap(ctx,txt,o.w*s);
      let fill=o.color;
      if(o.colorG&&o.colorG.on){ const g=ctx.createLinearGradient(0,0,o.w*s,o.h*s);
        g.addColorStop(0,o.color); g.addColorStop(1,o.colorG.c2); fill=g; }
      if(o.shadow&&o.shadow.on){ ctx.shadowColor=o.shadow.color; ctx.shadowBlur=o.shadow.blur*s;
        ctx.shadowOffsetX=o.shadow.x*s; ctx.shadowOffsetY=o.shadow.y*s; }
      ctx.textBaseline="alphabetic";
      lines.forEach((ln,i)=>{
        const lw=ctx.measureText(ln).width;
        let x=0; if(o.align==="center")x=(o.w*s-lw)/2; if(o.align==="right")x=o.w*s-lw;
        const y=size*0.8+i*size*o.lh;
        if(o.outline&&o.outline.w>0){ctx.lineWidth=o.outline.w*2*s;ctx.strokeStyle=o.outline.color;
          ctx.lineJoin="round";ctx.strokeText(ln,x,y);}
        ctx.fillStyle=fill; ctx.fillText(ln,x,y);
        if(o.underline){ctx.fillRect(x,y+size*0.08,lw,Math.max(1,size*0.05));}
      });
    }
    if(o.type==="shape"){
      const w=o.w*s,h=o.h*s,sw=o.stroke.w*s;
      if(o.shape==="path"){
        ctx.save(); ctx.scale(w/100,h/100);
        const p2=new Path2D(o.d);
        if(o.fill.type!=="none"){
          let fp=o.fill.c1;
          if(o.fill.type==="gradient"){const a=(o.fill.angle-90)*Math.PI/180,r=70.7;
            const g=ctx.createLinearGradient(50-Math.cos(a)*r,50-Math.sin(a)*r,50+Math.cos(a)*r,50+Math.sin(a)*r);
            g.addColorStop(0,o.fill.c1);g.addColorStop(1,o.fill.c2);fp=g;}
          if(o.shadow&&o.shadow.on){ctx.shadowColor=o.shadow.color;ctx.shadowBlur=o.shadow.blur*s*100/Math.max(w,h);
            ctx.shadowOffsetX=o.shadow.x*s*100/Math.max(w,h);ctx.shadowOffsetY=o.shadow.y*s*100/Math.max(w,h);}
          ctx.fillStyle=fp; ctx.fill(p2);
        }
        if(sw>0){ctx.strokeStyle=o.stroke.c;ctx.lineWidth=sw*100/Math.max(w,h);ctx.lineJoin="round";ctx.stroke(p2);}
        ctx.restore(); ctx.restore(); return;
      }
      let fill=null;
      if(o.fill.type==="solid")fill=o.fill.c1;
      if(o.fill.type==="gradient"){const a=(o.fill.angle-90)*Math.PI/180,
        cx=w/2,cy=h/2,r=Math.max(w,h)/2;
        const g=ctx.createLinearGradient(cx-Math.cos(a)*r,cy-Math.sin(a)*r,cx+Math.cos(a)*r,cy+Math.sin(a)*r);
        g.addColorStop(0,o.fill.c1);g.addColorStop(1,o.fill.c2);fill=g;}
      if(o.shadow&&o.shadow.on){ctx.shadowColor=o.shadow.color;ctx.shadowBlur=o.shadow.blur*s;
        ctx.shadowOffsetX=o.shadow.x*s;ctx.shadowOffsetY=o.shadow.y*s;}
      ctx.beginPath();
      if(o.shape==="rect"){const r=Math.min(o.radius*s,w/2,h/2); ctx.roundRect(sw/2,sw/2,w-sw,h-sw,r);}
      else if(o.shape==="ellipse")ctx.ellipse(w/2,h/2,(w-sw)/2,(h-sw)/2,0,0,7);
      else if(o.shape==="triangle"){ctx.moveTo(w/2,sw/2);ctx.lineTo(w-sw/2,h-sw/2);ctx.lineTo(sw/2,h-sw/2);ctx.closePath();}
      else if(o.shape==="line"){ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);}
      else if(o.shape==="arrow"){const s2=Math.max(sw,2*s),ah=Math.min(h/2,s2*4);
        ctx.moveTo(0,h/2);ctx.lineTo(w-ah*1.2,h/2);
        ctx.strokeStyle=o.stroke.c;ctx.lineWidth=s2;ctx.lineCap="round";ctx.stroke();
        ctx.beginPath();ctx.moveTo(w,h/2);ctx.lineTo(w-ah*1.6,h/2-ah);ctx.lineTo(w-ah*1.6,h/2+ah);ctx.closePath();
        ctx.fillStyle=o.stroke.c;ctx.fill();ctx.restore();return;}
      else if(o.shape==="star"){const cx=w/2,cy=h/2,R=Math.min(w,h)/2-sw,r=R*(o.inner||.45),n=o.points||5;
        for(let i=0;i<n*2;i++){const a=Math.PI/n*i-Math.PI/2,rr=i%2?r:R;
          const px=cx+rr*Math.cos(a)*(w/Math.min(w,h)),py=cy+rr*Math.sin(a)*(h/Math.min(w,h));
          i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.closePath();}
      if(fill&&o.shape!=="line"){ctx.fillStyle=fill;ctx.fill();}
      if(sw>0||o.shape==="line"){ctx.strokeStyle=o.stroke.c;ctx.lineWidth=Math.max(sw,o.shape==="line"?2*s:sw);
        ctx.lineCap="round";ctx.lineJoin="round";ctx.stroke();}
    }
    if(o.type==="icon"){
      const k=Math.min(o.w,o.h)/24*s;
      ctx.scale(k,k);
      ctx.strokeStyle=o.color;ctx.lineWidth=o.sw;ctx.lineCap="round";ctx.lineJoin="round";
      (ICONS[o.icon]||{d:[]}).d.forEach(d=>ctx.stroke(new Path2D(d)));
    }
    if(o.type==="image"){
      const w=o.w*s,h=o.h*s;
      if(o.mask==="path"&&o.maskD){ const p=new Path2D(); p.addPath(new Path2D(o.maskD),new DOMMatrix([w/100,0,0,h/100,0,0])); ctx.clip(p); }
      else{ ctx.beginPath();
        if(o.mask==="circle")ctx.ellipse(w/2,h/2,w/2,h/2,0,0,7);
        else{const r=o.mask==="round"?Math.min(o.radius*s,w/2,h/2):0; ctx.roundRect(0,0,w,h,r);}
        ctx.clip(); }
      const im=imgs[o.id];
      if(im){
        try{ctx.filter=`brightness(${o.filters.br}%) contrast(${o.filters.ct}%) saturate(${o.filters.sat}%) blur(${o.filters.blur*s}px)`;}catch(_){}
        const cover=Math.max(w/im.width,h/im.height)*o.scale;
        const dw=im.width*cover,dh=im.height*cover;

  async function renderArt(scale,transparent,imgs){

    const cv=document.createElement("canvas"); cv.width=W; cv.height=H;
    const ctx=cv.getContext("2d");
    if(!transparent&&st.doc.bg.type!=="none"){
      let fill=st.doc.bg.c1;
      if(st.doc.bg.type==="gradient"){const a=(st.doc.bg.angle-90)*Math.PI/180,r=Math.max(W,H)/2;
        const g=ctx.createLinearGradient(W/2-Math.cos(a)*r,H/2-Math.sin(a)*r,W/2+Math.cos(a)*r,H/2+Math.sin(a)*r);

     El sangrado se genera por OVERSCAN — estira los bordes del arte hacia afuera,
     así los elementos que tocan el filo (banda, cintillo, foto) se derraman
     limpiamente sin rediseñar. marks>0 dibuja marcas de corte en las 4 esquinas. */
  async function renderCanvas({scale=1,transparent=false,bleed=0,marks=0}={}){
    await ensureFonts(); const imgs=await loadImgs();
    const art=await renderArt(scale,transparent,imgs);
    const bl=Math.max(0,bleed), ml=Math.max(0,marks);
    if(bl===0&&ml===0) return art;
    const padD=bl+ml, P=Math.round(padD*scale), b=Math.round(bl*scale);
    const aw=art.width, ah=art.height;
    const cv=document.createElement("canvas");
    cv.width=aw+2*P; cv.height=ah+2*P;
    const ctx=cv.getContext("2d");
    if(b>0){ /* sangrado por overscan (bordes + esquinas del arte) */
      ctx.imageSmoothingEnabled=false;
      ctx.drawImage(art,0,0,aw,1, P,P-b, aw,b);            // banda superior
      ctx.drawImage(art,0,ah-1,aw,1, P,P+ah, aw,b);        // banda inferior
      ctx.drawImage(art,0,0,1,ah, P-b,P, b,ah);            // banda izquierda
      ctx.drawImage(art,aw-1,0,1,ah, P+aw,P, b,ah);        // banda derecha
      ctx.drawImage(art,0,0,1,1, P-b,P-b, b,b);            // esquina sup-izq
      ctx.drawImage(art,aw-1,0,1,1, P+aw,P-b, b,b);        // esquina sup-der
      ctx.drawImage(art,0,ah-1,1,1, P-b,P+ah, b,b);        // esquina inf-izq
      ctx.drawImage(art,aw-1,ah-1,1,1, P+aw,P+ah, b,b);    // esquina inf-der
      ctx.imageSmoothingEnabled=true;
    }
    ctx.drawImage(art,P,P);                                 // arte al tamaño de corte

        seg(x, y+sy*b, x, y+sy*(b+mk));                     // marca vertical

   cada objeto del editor pasa a un elemento SVG nativo que Inkscape edita —texto
   con ajuste automático (SVG 2 inline-size), rectángulos, elipses, trazados, grupos
   de íconos, imágenes recortadas— con capas, muestras de Inkscape para los colores
   que son tokens e identificadores estables. La pieza original viaja en <metadata>
   para poder importarla después. Especificación: docs/puente-web-inkscape.md. */
E.SvgEditable=(()=>{

     Si un HEX tiene dos nombres, gana la escala. */
  const TOKENS=(()=>{ const m={};
    ["puka","qillu","neutral","fondos","excepcionales"].forEach(g=>
      Object.entries(TOKENS_COLOR[g]||{}).forEach(([k,v])=>{ const H=v.toUpperCase(); if(!m[H])m[H]=g+"."+k; }));
    return m; })();
  const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

    if(!c||c==="none"||c==="transparent")return {hex:null,a:0};
    let m=c.match(/^#([0-9a-f]{3})$/i);
    if(m)return {hex:("#"+m[1].split("").map(x=>x+x).join("")).toUpperCase(),a:1};
    m=c.match(/^#([0-9a-f]{6})([0-9a-f]{2})?$/i);
    if(m)return {hex:("#"+m[1]).toUpperCase(),a:m[2]?parseInt(m[2],16)/255:1};
    m=c.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)\s*(?:,\s*([\d.]+)\s*)?\)$/i);

  function gradForma(ctx,id,f){

  /* Sombra (CSS drop-shadow / text-shadow) como filtro SVG que Inkscape edita. */
  function sombra(ctx,id,s){
    const {hex,a}=parseColor(s.color);
    ctx.defs.push(`<filter id="${id}" x="-50%" y="-50%" width="200%" height="200%" style="color-interpolation-filters:sRGB" inkscape:label="Sombra">`+
      `<feGaussianBlur in="SourceAlpha" stdDeviation="${n((s.blur||0)/2)}"/><feOffset dx="${n(s.x)}" dy="${n(s.y)}" result="desplazada"/>`+
      `<feFlood flood-color="${hex||T("excepcionales.negro")}" flood-opacity="${n(a)}"/><feComposite in2="desplazada" operator="in"/>`+
      `<feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>`);
    return `url(#${id})`;
  }
  /* Atributos comunes: id estable, etiqueta, giro alrededor del centro de la caja,
     opacidad, oculto y bloqueado. */
  function comunes(o,extraTransform){
    const cx=o.x+o.w/2, cy=o.y+o.h/2, tr=[];
    if(o.rot)tr.push(`rotate(${n(o.rot)} ${n(cx)} ${n(cy)})`);
    if(extraTransform)tr.push(extraTransform);
    return `id="obj-${esc(o.id)}" identidad:obj="${esc(o.id)}" identidad:tipo="${o.type}" inkscape:label="${esc(o.name||o.type)}"`+
      (tr.length?` transform="${tr.join(" ")}"`:"")+
      ((o.opacity??1)<1?` opacity="${n(o.opacity)}"`:"")+
      (o.locked?` sodipodi:insensitive="true"`:"")+
      (o.hidden?` style="display:none"`:"");
  }
  /* Une estilo propio con el display:none de lo oculto (un solo atributo style). */
  function conEstilo(attrs,estilo){
    if(/ style="display:none"/.test(attrs))return attrs.replace(/ style="display:none"/,` style="${estilo};display:none"`);
    return attrs+` style="${estilo}"`;
  }

  /* ---- TEXTO: líneas medidas sobre el mismo motor que pinta el lienzo ---- */
  function lineasTexto(o){
    const d=document.createElement("div");
    d.style.cssText=E.Render.textStyle(o)+`position:absolute;left:-100000px;top:0;visibility:hidden;`+
      `width:${o.w}px;white-space:pre-wrap;word-wrap:break-word;margin:0;padding:0;`;
    const tn=document.createTextNode(o.text); d.appendChild(tn); document.body.appendChild(d);
    const top0=d.getBoundingClientRect().top, left0=d.getBoundingClientRect().left;
    const lineas=[]; let cur=null;
    const r=document.createRange();
    for(let i=0;i<o.text.length;i++){
      const ch=o.text[i];
      if(ch==="\n"){ if(!cur)cur={ini:i,top:null,izq:null,der:null}; cur.fin=i+1; lineas.push(cur); cur=null; continue; }
      r.setStart(tn,i); r.setEnd(tn,i+1);
      const rc=[...r.getClientRects()].filter(q=>q.width>0||q.height>0);
      const q=rc[0];
      if(!q){ if(!cur)cur={ini:i,top:null,izq:null,der:null}; cur.fin=i+1; continue; }
      const t=q.top-top0;
      if(cur&&cur.top!=null&&t>cur.top+o.size*0.5){ lineas.push(cur); cur=null; }
      if(!cur)cur={ini:i,top:null,izq:null,der:null};
      if(cur.top==null)cur.top=t;
      if(ch!==" "){ cur.izq=Math.min(cur.izq??Infinity,q.left-left0); cur.der=Math.max(cur.der??-Infinity,q.right-left0); }
      cur.fin=i+1;
    }
    if(cur)lineas.push(cur);
    if(!lineas.length)lineas.push({ini:0,fin:0,top:0});
    d.remove();
    /* Línea base = parte superior del área de contenido + ascendente de la fuente
       (las mismas métricas que usa el navegador para el área de contenido). */
    const cv=document.createElement("canvas").getContext("2d");
    cv.font=`${o.italic?"italic ":""}${o.weight} ${o.size}px '${o.font}', sans-serif`;
    const asc=cv.measureText("Hg").fontBoundingBoxAscent||o.size*0.8;
    const paso=o.size*o.lh;
    let prev=null;
    lineas.forEach((L,k)=>{
      if(L.top==null)L.top=prev==null?(paso-o.size)/2:prev+paso;  // línea vacía: a un paso de la anterior
      prev=L.top; L.base=L.top+asc; L.k=k;
    });
    return lineas;
  }
  /* Texto en arco: <textPath> sobre la circunferencia (Inkscape lo edita como texto en trayecto). */
  function textoArco(ctx,o){
    const g=Arco.geo(o), id="arco-"+o.id;
    ctx.defs.push(`<path id="${esc(id)}" d="${g.d}" transform="translate(${n(o.x)} ${n(o.y)})" inkscape:label="Arco del texto"/>`);
    let relleno;
    if(o.colorG&&o.colorG.on) relleno=`fill:${gradCss(ctx,"grad-"+o.id,o.colorG.angle,o.color,o.colorG.c2,o.x,o.y,o.w,o.h)}`;
    else relleno=pintura(ctx,o.color,"fill");
    const est=[`font-family:'${o.font}'`,`font-weight:${o.weight}`,`font-size:${n(o.size)}px`,`font-style:${o.italic?"italic":"normal"}`,
      `letter-spacing:${n(o.ls)}px`,"text-anchor:middle",relleno];
    if(o.underline)est.push("text-decoration:underline");
    if(o.outline&&o.outline.w>0)est.push(pintura(ctx,o.outline.color,"stroke"),`stroke-width:${n(o.outline.w)}`,"stroke-linejoin:round","paint-order:stroke");
    let attrs=comunes(o)+` identidad:arco="${n(o.arco.radio)} ${n(o.arco.angulo||0)}"`;
    if(o.shadow&&o.shadow.on)attrs+=` filter="${sombra(ctx,"fx-"+o.id,o.shadow)}"`;
    ctx.huellas[o.id]={x:n(o.x),y:n(o.y),w:n(o.w),h:n(o.h),rot:n(o.rot||0),opacity:n(o.opacity??1),texto:o.text,lineas:1,color:o.color};
    return `<text xml:space="preserve" ${conEstilo(attrs,est.join(";"))}><textPath xlink:href="#${esc(id)}" startOffset="${g.offset}%">${esc(g.txt)}</textPath></text>`;
  }
  function texto(ctx,o){
    if(Arco.activo(o))return textoArco(ctx,o);
    const alin={left:["start","start",o.x],center:["middle","center",o.x+o.w/2],right:["end","end",o.x+o.w]}[o.align]||["start","start",o.x];
    const t=o.upper?o.text.toUpperCase():o.text;
    const lineas=lineasTexto(o);
    let relleno;
    if(o.colorG&&o.colorG.on) relleno=`fill:${gradCss(ctx,"grad-"+o.id,o.colorG.angle,o.color,o.colorG.c2,o.x,o.y,o.w,o.h)}`;
    else relleno=pintura(ctx,o.color,"fill");
    const est=[`font-family:'${o.font}'`,`font-weight:${o.weight}`,`font-size:${n(o.size)}px`,
      `font-style:${o.italic?"italic":"normal"}`,`line-height:${n(o.lh)}`,`letter-spacing:${n(o.ls)}px`,
      `text-anchor:${alin[0]}`,`text-align:${alin[1]}`,`inline-size:${n(o.w)}px`,`white-space:pre-wrap`,relleno];
    if(o.underline)est.push("text-decoration:underline");
    if(o.outline&&o.outline.w>0)est.push(pintura(ctx,o.outline.color,"stroke"),`stroke-width:${n(o.outline.w)}`,"stroke-linejoin:round");
    let attrs=comunes(o);
    if(o.shadow&&o.shadow.on)attrs+=` filter="${sombra(ctx,"fx-"+o.id,o.shadow)}"`;
    if(o.upper)attrs+=` identidad:mayusculas="true"`;
    /* Líneas de respaldo (como las escribe Inkscape): las leen los visores sin
       SVG 2; Inkscape vuelve a partir el texto con inline-size al editarlo. */
    const tsp=lineas.map(L=>{
      return `<tspan sodipodi:role="line" x="${n(alin[2])}" y="${n(o.y+L.base)}">${esc(t.slice(L.ini,L.fin))}</tspan>`;
    }).join("");
    ctx.huellas[o.id]={x:n(o.x),y:n(o.y),w:n(o.w),h:n(o.h),rot:n(o.rot||0),opacity:n(o.opacity??1),
      texto:o.text,lineas:lineas.length,color:o.color};
    return `<text xml:space="preserve" ${conEstilo(attrs,est.join(";"))} x="${n(alin[2])}" y="${n(o.y+lineas[0].base)}">${tsp}</text>`;
  }

  /* ---- FORMAS: la misma geometría que shapeSvg() del lienzo ---- */
  function forma(ctx,o){
    const sw=o.stroke.w, half=sw/2, x=o.x, y=o.y, w=o.w, h=o.h;
    const relleno=o.fill.type==="none"?"fill:none":o.fill.type==="gradient"?`fill:${gradForma(ctx,"grad-"+o.id,o.fill)}`:pintura(ctx,o.fill.c1,"fill");
    const contorno=sw>0?`${pintura(ctx,o.stroke.c,"stroke")};stroke-width:${n(sw)}`:"stroke:none";
    const fx=o.shadow&&o.shadow.on?` filter="${sombra(ctx,"fx-"+o.id,o.shadow)}"`:"";
    ctx.huellas[o.id]={x:n(x),y:n(y),w:n(w),h:n(h),rot:n(o.rot||0),opacity:n(o.opacity??1),
      relleno:o.fill.type==="solid"?o.fill.c1:o.fill.type,contorno:sw>0?o.stroke.c:null};
    const at=comunes(o)+fx+` identidad:forma="${o.shape}"`;
    const est=`${relleno};${contorno}`;
    if(o.shape==="rect")
      return `<rect ${conEstilo(at,est)} x="${n(x+half)}" y="${n(y+half)}" width="${n(Math.max(0,w-sw))}" height="${n(Math.max(0,h-sw))}"`+
        (o.radius?` rx="${n(o.radius)}" ry="${n(o.radius)}"`:"")+`/>`;
    if(o.shape==="ellipse")
      return `<ellipse ${conEstilo(at,est)} cx="${n(x+w/2)}" cy="${n(y+h/2)}" rx="${n(Math.max(0,(w-sw)/2))}" ry="${n(Math.max(0,(h-sw)/2))}"/>`;
    if(o.shape==="triangle")
      return `<polygon ${conEstilo(at,est+";stroke-linejoin:round")} points="${n(x+w/2)},${n(y+half)} ${n(x+w-half)},${n(y+h-half)} ${n(x+half)},${n(y+h-half)}"/>`;
    if(o.shape==="star"){
      const cx=w/2,cy=h/2,R=Math.min(w,h)/2-sw,r=R*(o.inner||0.45),k=o.points||5,m=Math.min(w,h),pts=[];
      for(let i=0;i<k*2;i++){const a=Math.PI/k*i-Math.PI/2, rr=i%2?r:R;
        pts.push(n(x+cx+rr*Math.cos(a)*(w/m))+","+n(y+cy+rr*Math.sin(a)*(h/m)));}
      return `<polygon ${conEstilo(at,est+";stroke-linejoin:round")} points="${pts.join(" ")}"/>`;
    }
    if(o.shape==="line"){
      const s2=Math.max(sw,2);
      return `<line ${conEstilo(at,`fill:none;${pintura(ctx,o.stroke.c,"stroke")};stroke-width:${n(s2)};stroke-linecap:round`)} x1="${n(x)}" y1="${n(y+h/2)}" x2="${n(x+w)}" y2="${n(y+h/2)}"/>`;
    }
    if(o.shape==="arrow"){
      const s2=Math.max(sw,2), ah=Math.min(h/2,s2*4), cy=y+h/2;
      return `<g ${at}><line style="fill:none;${pintura(ctx,o.stroke.c,"stroke")};stroke-width:${n(s2)};stroke-linecap:round" x1="${n(x)}" y1="${n(cy)}" x2="${n(x+w-ah*1.2)}" y2="${n(cy)}"/>`+
        `<polygon style="${pintura(ctx,o.stroke.c,"fill")};stroke:none" points="${n(x+w)},${n(cy)} ${n(x+w-ah*1.6)},${n(cy-ah)} ${n(x+w-ah*1.6)},${n(cy+ah)}"/></g>`;
    }
    if(o.shape==="path"){
      /* Trazado de biblioteca en 0..100 estirado a la caja (preserveAspectRatio none). */
      const swP=sw>0?sw*100/Math.max(w,h):0;
      const estP=`${relleno};`+(sw>0?`${pintura(ctx,o.stroke.c,"stroke")};stroke-width:${n(swP)};stroke-linejoin:round`:"stroke:none");
      const tr=`translate(${n(x)} ${n(y)}) scale(${n(w/100)} ${n(h/100)})`;
      if(fx){ /* la sombra se mide en px del documento: filtro en el grupo, escala en el trazado */
        return `<g ${at}><path style="${estP}" transform="${tr}" d="${esc(o.d)}"/></g>`; }
      return `<path ${conEstilo(comunes(o,tr)+` identidad:forma="path"`,estP)} d="${esc(o.d)}"/>`;
    }
    return "";
  }

  /* ---- ÍCONOS: los trazados de ICONS, en contorno (viewBox 24, «meet» centrado) ---- */
  function icono(ctx,o){
    const ic=ICONS[o.icon]||ICONS["map-pin"], k=Math.min(o.w,o.h)/24;
    const tx=o.x+(o.w-24*k)/2, ty=o.y+(o.h-24*k)/2;
    ctx.huellas[o.id]={x:n(o.x),y:n(o.y),w:n(o.w),h:n(o.h),rot:n(o.rot||0),opacity:n(o.opacity??1),icono:o.icon,color:o.color};
    const at=comunes(o,`translate(${n(tx)} ${n(ty)}) scale(${n(k)})`)+` identidad:icono="${esc(o.icon)}"`;
    return `<g ${conEstilo(at,`fill:none;${pintura(ctx,o.color,"stroke")};stroke-width:${n(o.sw)};stroke-linecap:round;stroke-linejoin:round`)}>`+
      ic.d.map(d=>`<path d="${esc(d)}"/>`).join("")+`</g>`;
  }

  /* ---- IMÁGENES: encuadre «cover» + desplazamiento/escala del editor, recorte y filtros ---- */
  function imagen(ctx,o,img,href){
    const x=o.x,y=o.y,w=o.w,h=o.h;
    ctx.huellas[o.id]={x:n(x),y:n(y),w:n(w),h:n(h),rot:n(o.rot||0),opacity:n(o.opacity??1),
      imagen:o.src?(o.src.startsWith("data:")?"incrustada":o.src):null};
    const at=comunes(o);
    if(!o.src||!img){
      /* marcador: el lienzo pinta un gris con «Doble clic: subir imagen» */
      return `<g ${at} identidad:marcador="true"><rect style="${pintura(ctx,T("neutral.400"),"fill")}" x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}"`+
        (o.mask==="round"?` rx="${n(o.radius)}"`:"")+`/>`+
        `<text xml:space="preserve" style="font-family:'Inter';font-weight:600;font-size:13px;text-anchor:middle;${pintura(ctx,T("neutral.800"),"fill")}" x="${n(x+w/2)}" y="${n(y+h/2+4)}">Imagen</text></g>`;
    }
    const nw=img.naturalWidth||w, nh=img.naturalHeight||h, k=Math.max(w/nw,h/nh);
    const dw=nw*k, dh=nh*k, s=o.scale||1;
    const ix=x+w/2+((w-dw)/2-w/2)*s+(o.ox||0)*w/100, iy=y+h/2+((h-dh)/2-h/2)*s+(o.oy||0)*h/100;
    let clip;
    if(o.mask==="circle")clip=`<ellipse cx="${n(x+w/2)}" cy="${n(y+h/2)}" rx="${n(w/2)}" ry="${n(h/2)}"/>`;
    else if(o.mask==="path"&&o.maskD)clip=`<path transform="translate(${n(x)} ${n(y)}) scale(${n(w/100)} ${n(h/100)})" d="${esc(o.maskD)}"/>`;
    else { const r=o.mask==="round"?Math.min(o.radius||0,w/2,h/2):0;
      clip=`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}"`+(r?` rx="${n(r)}" ry="${n(r)}"`:"")+`/>`; }
    ctx.defs.push(`<clipPath id="clip-${esc(o.id)}" clipPathUnits="userSpaceOnUse">${clip}</clipPath>`);
    const f=o.filters||{br:100,ct:100,sat:100,blur:0};
    let fattr="";
    if(f.br!==100||f.ct!==100||f.sat!==100||f.blur>0){
      const b=f.br/100, c=f.ct/100, p=[];
      if(f.br!==100)p.push(`<feComponentTransfer><feFuncR type="linear" slope="${n(b)}"/><feFuncG type="linear" slope="${n(b)}"/><feFuncB type="linear" slope="${n(b)}"/></feComponentTransfer>`);
      if(f.ct!==100)p.push(`<feComponentTransfer><feFuncR type="linear" slope="${n(c)}" intercept="${n(-(0.5*c)+0.5)}"/><feFuncG type="linear" slope="${n(c)}" intercept="${n(-(0.5*c)+0.5)}"/><feFuncB type="linear" slope="${n(c)}" intercept="${n(-(0.5*c)+0.5)}"/></feComponentTransfer>`);
      if(f.sat!==100)p.push(`<feColorMatrix type="saturate" values="${n(f.sat/100)}"/>`);
      if(f.blur>0)p.push(`<feGaussianBlur stdDeviation="${n(f.blur)}"/>`);
      ctx.defs.push(`<filter id="fx-${esc(o.id)}" x="0" y="0" width="1" height="1" style="color-interpolation-filters:sRGB" inkscape:label="Ajustes de foto">${p.join("")}</filter>`);
      fattr=` filter="url(#fx-${esc(o.id)})"`;
    }
    return `<g ${at} clip-path="url(#clip-${esc(o.id)})"><image x="${n(ix)}" y="${n(iy)}" width="${n(dw*s)}" height="${n(dh*s)}" preserveAspectRatio="none"${fattr} xlink:href="${esc(href)}"/></g>`;
  }

  function objeto(ctx,o,imgs,hrefs){
    if(o.type==="text")return texto(ctx,o);
    if(o.type==="shape")return forma(ctx,o);
    if(o.type==="icon")return icono(ctx,o);
    if(o.type==="image")return imagen(ctx,o,imgs[o.id],hrefs[o.id]);
    return "";
  }

  /* Pieza → SVG editable (cadena). No toca el estado del editor.
     op.fecha=false: sin fecha en la metadata (salida determinista, para las plantillas de C). */
  async function generar(pieza,op){
    op=op||{};
    pieza=pieza||{doc:E.State.st.doc,objects:E.State.st.objects,pal:E.State.st.pal,
      palVar:E.State.st.palVar,palRoles:E.State.st.palRoles};
    const doc=pieza.doc, W=doc.w, H=doc.h;
    /* Identificadores deterministas para objetos sin id (plantillas sin abrir). */
    const objs=pieza.objects.map((o,i)=>o.id?o:{...o,id:"o"+i});
    const fl=[]; objs.forEach(o=>{ if(o.type==="text")fl.push(document.fonts.load(`${o.italic?"italic ":""}${o.weight} 16px '${o.font}'`)); });
    try{ await Promise.all(fl); await document.fonts.ready; }catch(_){}
    const imgs={}, hrefs={};
    await Promise.all(objs.filter(o=>o.type==="image"&&o.src).map(async o=>{
      let href=o.src;
      try{ href=await E.Banco.fuenteADataURL(o.src); }catch(_){}
      hrefs[o.id]=href;
      await new Promise(res=>{const im=new Image(); im.onload=()=>{imgs[o.id]=im;res();}; im.onerror=()=>res(); im.src=href;});
    }));
    const ctx=nuevoCtx();
    /* Fondo del documento (capa bloqueada) */
    let fondo="";
    if(doc.bg&&doc.bg.type!=="none"){
      const f=doc.bg.type==="gradient"?`fill:${gradCss(ctx,"grad-fondo",doc.bg.angle,doc.bg.c1,doc.bg.c2,0,0,W,H)}`:pintura(ctx,doc.bg.c1,"fill");
      fondo=`<rect id="fondo" inkscape:label="Fondo" style="${f};stroke:none" x="0" y="0" width="${n(W)}" height="${n(H)}"/>`;
    }
    /* Objetos en orden de apilamiento; los de un mismo grupo CONTIGUOS van en un <g>. */
    const cuerpo=[]; let i=0;
    while(i<objs.length){
      const o=objs[i];
      if(o.groupId){
        let j=i; const miembros=[];
        while(j<objs.length&&objs[j].groupId===o.groupId){ miembros.push(objs[j]); j++; }
        if(miembros.length>1){
          cuerpo.push(`<g id="grp-${esc(o.groupId)}" identidad:grupo="${esc(o.groupId)}" inkscape:label="Grupo">`+
            miembros.map(m=>objeto(ctx,m,imgs,hrefs)).join("")+`</g>`);
          i=j; continue;
        }
      }
      cuerpo.push(objeto(ctx,o,imgs,hrefs)); i++;
    }
    const muestras=Object.entries(ctx.muestras).map(([id,{tok,hex}])=>
      `<linearGradient id="${id}" inkscape:swatch="solid" inkscape:label="${tok}" identidad:token="${tok}"><stop offset="0" style="stop-color:${hex};stop-opacity:1"/></linearGradient>`);
    const meta={formato:"identidad-pieza-svg",version:VERSION,generador:"editor.html · E.SvgEditable",
      fecha:op.fecha===false?null:new Date().toISOString(),plantilla:pieza.plantilla||null,doc,pal:pieza.pal,palVar:pieza.palVar||0,palRoles:pieza.palRoles||null,
      objetos:objs.map(o=>{ const c=deep(o);
        if(c.type==="image"){ c.src_ref=!c.src?null:c.src.startsWith("data:")?"incrustada · "+c.src.length+" caracteres":c.src; delete c.src; }
        return c; }),
      huellas:ctx.huellas,colores_fuera_de_tokens:[...ctx.fuera].sort()};
    const json=JSON.stringify(meta).replace(/]]>/g,"]]]]><![CDATA[>");
    const svg=`<?xml version="1.0" encoding="UTF-8"?>\n`+
      `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" `+
      `xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" `+
      `xmlns:identidad="${NS_ID}" width="${n(W)}" height="${n(H)}" viewBox="0 0 ${n(W)} ${n(H)}" version="1.1">\n`+
      `<metadata id="identidad-pieza"><![CDATA[${json}]]></metadata>\n`+
      `<sodipodi:namedview id="vista" pagecolor="${T("fondos.blanco")}" inkscape:document-units="px" inkscape:pagecheckerboard="true"/>\n`+
      `<defs id="defs">${muestras.join("")}${ctx.defs.join("")}</defs>\n`+
      `<g id="capa-fondo" inkscape:groupmode="layer" inkscape:label="Fondo" sodipodi:insensitive="true">${fondo}</g>\n`+
      `<g id="capa-pieza" inkscape:groupmode="layer" inkscape:label="Pieza">\n${cuerpo.join("\n")}\n</g>\n</svg>\n`;
    return {svg,fuera:[...ctx.fuera].sort(),muestras:Object.keys(ctx.muestras).length};
  }

  async function descargar(nombre){
    const r=await generar();
    const url=URL.createObjectURL(new Blob([r.svg],{type:"image/svg+xml"}));
    const a=document.createElement("a"); a.href=url; a.download=nombre+"-inkscape.svg"; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    return r;
  }

  /* ---- MODO PRUEBA (sin interfaz): editor.html?prueba=svg-editable#pieza:<base64url JSON> | #tpl:<n> | #catalogo | #svg:<base64url SVG> (importar)

      }
      if(/catalogo/.test(location.hash)){
        /* CATÁLOGO: todas las plantillas de marca convertidas (lo usa generar.py generar para C) */
        const lista=[];

      }
      if(ntpl!=null){ const d=E.Tpl.brand[+ntpl]; if(!d)throw new Error("no hay plantilla "+ntpl);

      const st=E.State.st;
      st.doc=pieza.doc; st.objects=pieza.objects.map(o=>NEW[o.type]?NEW[o.type](o):o);   /* completa con las factorías */
      st.pal=pieza.pal||st.pal; st.palVar=pieza.palVar||0; st.palRoles=pieza.palRoles||null;
      E.State.setSel([]); E.View.applyDocSize(); E.Render.all();
      try{ await document.fonts.ready; }catch(_){}
      await Promise.all([...document.querySelectorAll("#objlayer img")].map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r;})));
      E.Render.all();   // re-mide las alturas de texto con las fuentes ya cargadas
      if(vista==="lienzo"){
        /* se MUEVE el lienzo (no se clona: un clon duplicaría los id de los degradados) */
        const ab=$("#artboard");
        [...document.body.children].forEach(c=>c.style.display="none");
        ab.style.cssText+=";position:fixed;left:0;top:0;box-shadow:none;transform:none;margin:0";
        document.documentElement.style.background="#fff"; document.body.style.cssText="margin:0;overflow:hidden;background:#fff";
        document.body.appendChild(ab);
        out.textContent=JSON.stringify({ok:true,alturas:Object.fromEntries(st.objects.filter(o=>o.type==="text").map(o=>[o.id,o.h]))});
        out.style.display="none";
      } else {
        const r=await generar();
        out.textContent=JSON.stringify({ok:true,svg:r.svg,nombre:pieza.nombre||null,plantillas:E.Tpl.brand.length});
      }
    }catch(e){ out.textContent=JSON.stringify({ok:false,error:String(e&&e.stack||e)}); }
    document.body.appendChild(out);

})();

/* ===================== IMPORTAR SVG (puente Inkscape → web) =====================
   Vuelta del SVG editable (E.SvgEditable): lee la pieza de su <metadata>, vuelve a generar el SVG

   cada cambio a su manera —reescribe x/y, añade rotate(), hornea la transformación en «d», pone una
   matriz en un grupo—; la comparación da la transformación que aplicó y se lleva a la caja del
   objeto (posición, tamaño, giro). Texto, colores, opacidad, oculto, bloqueado y nombre se leen del
   elemento. Lo borrado desaparece; lo nuevo simple (rectángulo, elipse, texto, imagen incrustada)

E.SvgImport=(()=>{
