          const s=g("width")/dw;
          const ox=(g("x")-o0.x-w/2-((w-dw)/2-w/2)*s)*100/w, oy=(g("y")-o0.y-h/2-((h-dh)/2-h/2)*s)*100/h;
          o.scale=r2(s*1000)/1000; o.ox=r2(ox); o.oy=r2(oy);
        }
      }
      if(o.src&&ref.getAttribute("clip-path")&&!cur.getAttribute("clip-path"))
        avisos.push(`«${o.name}»: se quitó el recorte en Inkscape; se conserva la máscara del editor`);
      return o;
    }
    if(o.type==="icon"){
      /* Inkscape reescribe el texto de «d» al guardar (mismo trazado, otra notación): se compara la
         geometría de cada trazado, no su cadena */
      const cajas=r=>[...r.querySelectorAll("path")].map(p=>medir(p,()=>p.getBBox()));
      const bC=cajas(cur), bR=cajas(ref);
      const igual=bC.length===bR.length&&bC.every((b,i)=>["x","y","width","height"].every(k=>casi(b[k],bR[i][k],0.02)));
      if(!igual)return null;                                     // trazado editado: va como imagen
      fijar(o,mapear(o,mul(Mc,inv(Mr)),avisos));
      const p=pintura(cur,"stroke",raiz); if(p.type==="solid"&&!mismoColor(o.color,p.c1))o.color=p.c1;
      const sw=num(getComputedStyle(cur).strokeWidth); if(sw&&!casi(o.sw,sw,0.01))o.sw=r2(sw);
      return o;
    }
    /* formas: la caja local del original llevada a la actual, por las dos matrices */
    /* etiquetas con las que Inkscape puede guardar la misma forma: una elipse de ejes iguales
       escalada pasa a <circle> (comprobado en la interfaz), y la herramienta de arcos usa <path sodipodi:type="arc"> */
    const tagOk={rect:["rect"],ellipse:["ellipse","circle","arc"],triangle:["polygon"],star:["polygon"],line:["line"],arrow:["g"],path:["path","g"]}[o.shape];
    const tagC=cur.tagName.toLowerCase(), tipoC=tagC==="path"&&cur.getAttributeNS(NS_SOD,"type")==="arc"?"arc":tagC;
    if(tagOk&&!tagOk.includes(tipoC))return null;
    const bR=medir(ref,()=>ref.getBBox()), bC=medir(cur,()=>cur.getBBox());
    fijar(o,mapear(o,mul(Mc,mul(cajaACaja(bR,bC),inv(Mr))),avisos));
    const pc=tagC==="g"?cur.querySelector("line,path,polygon")||cur:cur;
    if(o.shape==="line"||o.shape==="arrow"){
      const st=pintura(pc,"stroke",raiz); if(st.type==="solid"&&!mismoColor(o.stroke.c,st.c1))o.stroke={...o.stroke,c:st.c1};
    } else {
      aplicarRelleno(o,pintura(pc,"fill",raiz));
      const st=pintura(pc,"stroke",raiz), cs=getComputedStyle(pc);
      if(st.type==="none"){ if(o.stroke.w)o.stroke={...o.stroke,w:0}; }
      else { let sw=num(cs.strokeWidth); if(o.shape==="path")sw=sw*Math.max(o.w,o.h)/100;
        if(!casi(o.stroke.w,sw,0.05))o.stroke={...o.stroke,w:r2(sw)}; if(!mismoColor(o.stroke.c,st.c1))o.stroke={...o.stroke,c:st.c1}; }
      if(o.shape==="rect"){ const rx=num(cur.getAttribute("rx"))*Math.sqrt(Math.abs(Mc.a*Mc.d-Mc.b*Mc.c)/Math.max(1e-9,Math.abs(Mr.a*Mr.d-Mr.b*Mr.c)));
        if(!casi(o.radius||0,rx,0.05))o.radius=r2(rx); }
    }
    if(o.shadow&&o.shadow.on&&!(cur.getAttribute("filter")||cur.style.filter))o.shadow={...o.shadow,on:false};
    return o;
  }

  /* ---- un elemento nuevo, dibujado en Inkscape ---- */
  async function nuevo(el,org,raiz,defs,avisos){
    const tag=el.tagName.toLowerCase(), m=ctm(el,org), nom=el.getAttributeNS(NS_INK,"label")||"";
    const base={id:uid(),hidden:oculto(el,raiz),locked:el.getAttributeNS(NS_SOD,"insensitive")==="true",
      opacity:el.hasAttribute("opacity")?num(el.getAttribute("opacity")):1};
    const desdeCaja=(x,y,w,h,o)=>{ fijar(o,mapear({...o,x,y,w,h,rot:0},m,avisos)); return o; };
    if(tag==="rect"||tag==="ellipse"||tag==="circle"){
      const cs=getComputedStyle(el), st=pintura(el,"stroke",raiz), sw=st.type==="none"?0:num(cs.strokeWidth);
      let x,y,w,h; if(tag==="rect"){ x=num(el.getAttribute("x"));y=num(el.getAttribute("y"));w=num(el.getAttribute("width"));h=num(el.getAttribute("height")); }
      else { const rx=num(el.getAttribute(tag==="circle"?"r":"rx")), ry=num(el.getAttribute(tag==="circle"?"r":"ry"));
        x=num(el.getAttribute("cx"))-rx; y=num(el.getAttribute("cy"))-ry; w=2*rx; h=2*ry; }
      const o=NEW.shape({...base,name:nom||(tag==="rect"?"Rectángulo (Inkscape)":"Elipse (Inkscape)"),shape:tag==="rect"?"rect":"ellipse",
        radius:num(el.getAttribute("rx"))||0,stroke:{c:st.c1||T("neutral.900"),w:r2(sw)}});
      aplicarRelleno(o,pintura(el,"fill",raiz));
      return desdeCaja(x-sw/2,y-sw/2,w+sw,h+sw,o);
    }
    if(tag==="text"){
      const cs=getComputedStyle(el), size=num(cs.fontSize)||36, ic=num(el.style.inlineSize);
      const b=medir(el,()=>el.getBBox()), anc=cs.textAnchor;
      const w=ic||Math.ceil(b.width+size*0.3), x0=num(el.getAttribute("x")||b.x)-(anc==="middle"?w/2:anc==="end"?w:0);
      const p=pintura(el,"fill",raiz);
      const o=NEW.text({...base,name:nom||"Texto (Inkscape)",text:contenidoTexto(el),font:familia(cs)||"Source Sans 3",size:r2(size),
        weight:pesoN(cs.fontWeight),italic:cs.fontStyle==="italic",align:anc==="middle"?"center":anc==="end"?"right":"left",
        color:p.c1||T("neutral.900"),lh:num(el.style.lineHeight)||1.25,ls:num(cs.letterSpacing)||0});
      avisos.push(`«${o.name}»: texto nuevo; su caja se calcula aproximada (revise la posición vertical)`);
      return desdeCaja(x0,b.y,w,b.height,o);
    }
    if(tag==="image"){
      const href=el.getAttributeNS(NS_XL,"href")||el.getAttribute("href")||"";
      if(/^data:/.test(href)){ const o=NEW.image({...base,name:nom||"Imagen (Inkscape)",src:href,mask:"none"});
        return desdeCaja(num(el.getAttribute("x")),num(el.getAttribute("y")),num(el.getAttribute("width")),num(el.getAttribute("height")),o); }
    }
    return await rasterizar(el,org,defs);
  }

  /* ---- SVG → pieza ---- */
  async function importar(texto,nombreArchivo){
    const informe={actualizados:0,sin_cambios:0,nuevos:0,como_imagen:0,eliminados:[],avisos:[]};
    const cur=montar(texto);
    try{
      const metaEl=cur.svg.querySelector("metadata#identidad-pieza"), raiz=cur.svg;
      const defs=new XMLSerializer().serializeToString(raiz.querySelector("defs")||document.createElementNS("http://www.w3.org/2000/svg","defs"));
      if(!metaEl){   // SVG ajeno: entra entero como una imagen
        informe.avisos.push("El SVG no viene del editor (sin metadata de pieza): entra como una sola imagen.");
        const o=await rasterizar(raiz.querySelector("g")||raiz,cur,defs); o.x=0;o.y=0;o.w=cur.W;o.h=cur.H;
        informe.como_imagen=1;
        return {pieza:{doc:{w:cur.W,h:cur.H,bg:{type:"none",c1:T("neutral.100"),c2:T("fondos.blanco"),angle:180}},objects:[o],pal:E.State.st.pal,palVar:0,palRoles:null},
          informe,nombre:(nombreArchivo||"SVG").replace(/\.svg$/i,"")};
      }
      const meta=JSON.parse(metaEl.textContent);
      if(meta.formato!=="identidad-pieza-svg")throw new Error("metadata de otro formato: "+meta.formato);
      const objsMeta=meta.objetos.map(o=>deep(o));
      /* fotos: el original se regenera con la MISMA foto que trae el SVG (misma medida natural) */
      const curPor=porObj(raiz);
      objsMeta.forEach(o=>{ if(o.type==="image"){ const im=curPor[o.id]&&curPor[o.id].querySelector("image");
        o.src=im?(im.getAttributeNS(NS_XL,"href")||im.getAttribute("href")):null; delete o.src_ref; } });
      const refTxt=(await E.SvgEditable.generar({doc:meta.doc,objects:objsMeta,pal:meta.pal,palVar:meta.palVar,palRoles:meta.palRoles},{fecha:false})).svg;
      const ref=montar(refTxt);
      try{
        const refPor=porObj(ref.svg), porId_={}; objsMeta.forEach(o=>porId_[o.id]=o);
        const salida=[], vistos=new Set();
        /* recorrido en orden de documento: el apilamiento final es el de Inkscape */
        const capas=[...raiz.children].filter(g=>g.tagName==="g"&&g.id!=="capa-fondo");
        let grupoNuevo=0;
        const recorrer=async(nodo,gid)=>{
          for(const el of [...nodo.children]){
            const tag=el.tagName.toLowerCase();
            if(["defs","metadata","title","desc"].includes(tag)||el.namespaceURI!=="http://www.w3.org/2000/svg")continue;
            const id=idObj(el);
            if(id&&porId_[id]&&!vistos.has(id)){
              vistos.add(id);
              const antes=JSON.stringify(porId_[id]);
              let o=deep(porId_[id]); if(o.type==="image"&&!o.src)o.src=null;
              const res=await actualizar(o,el,refPor[id],cur,raiz,informe.avisos);
              if(!res){ const im=await rasterizar(el,cur,defs); im.name=porId_[id].name+" (editado en Inkscape, como imagen)"; im.id=id;
                informe.como_imagen++; informe.avisos.push(`«${porId_[id].name}»: su forma se editó en Inkscape; entra como imagen`); salida.push(gid?{...im,groupId:gid}:im); continue; }
              const g2=el.parentNode.getAttributeNS&&el.parentNode.getAttributeNS(NS_ID,"grupo");
              if(gid)res.groupId=gid; else if(!g2&&res.groupId)delete res.groupId;
              JSON.stringify(res)===antes?informe.sin_cambios++:informe.actualizados++;
              salida.push(res); continue;
            }
            if(tag==="g"&&!el.getAttribute("clip-path")&&!el.getAttribute("mask")&&!el.getAttribute("filter")){
              if(el.getAttributeNS(NS_INK,"groupmode")==="layer"){ await recorrer(el,gid); continue; }      // capa
              const gg=el.getAttributeNS(NS_ID,"grupo");
              if(gg){ await recorrer(el,gid||gg); continue; }                                              // grupo del editor
              await recorrer(el,el.children.length>1?(gid||"gi"+uid()):gid); continue;                      // grupo nuevo de Inkscape
            }
            const o=await nuevo(el,cur,raiz,defs,informe.avisos);
            if(o){ if(gid)o.groupId=gid; salida.push(o); /\(de Inkscape, como imagen\)$/.test(o.name)?informe.como_imagen++:informe.nuevos++; }
          }
        };
        for(const c of capas)await recorrer(c,null);
        objsMeta.forEach(o=>{ if(!vistos.has(o.id))informe.eliminados.push(o.name); });
        /* fondo y tamaño */
        const doc={...meta.doc,w:cur.W,h:cur.H};
        const fondo=raiz.querySelector("#capa-fondo rect");
        if(!fondo)doc.bg={...doc.bg,type:"none"};
        else { const p=pintura(fondo,"fill",raiz);
          if(p.type==="solid"){ if(!(doc.bg.type==="solid"&&mismoColor(doc.bg.c1,p.c1)))doc.bg={...doc.bg,type:"solid",c1:p.c1}; }
          else if(p.type==="gradient"){ if(!(doc.bg.type==="gradient"&&mismoColor(doc.bg.c1,p.c1)&&mismoColor(doc.bg.c2,p.c2)))doc.bg={type:"gradient",c1:p.c1,c2:p.c2,angle:r2(p.angle??180)}; }
          else doc.bg={...doc.bg,type:"none"}; }
        if(cur.W!==meta.doc.w||cur.H!==meta.doc.h)informe.avisos.push(`El tamaño de página cambió en Inkscape: ${meta.doc.w}×${meta.doc.h} → ${cur.W}×${cur.H}`);
        return {pieza:{doc,objects:salida,pal:meta.pal,palVar:meta.palVar||0,palRoles:meta.palRoles||null},informe,
          nombre:(meta.plantilla&&meta.plantilla.nombre)||(nombreArchivo||"Pieza").replace(/(-inkscape)?\.svg$/i,"")};
      } finally { ref.svg.remove(); }
    } finally { cur.svg.remove(); }
  }

  /* ---- en el editor: elegir el archivo y abrirlo como edición NUEVA ---- */
  function elegir(){
    const inp=document.createElement("input"); inp.type="file"; inp.accept=".svg,image/svg+xml";
    inp.onchange=async()=>{ const f=inp.files[0]; if(!f)return;
      try{ const r=await importar(await f.text(),f.name); abrirComoEdicion(r); }
      catch(e){ console.error(e); toast("No se pudo importar: "+e.message); } };
    inp.click();
  }
  function abrirComoEdicion(r){
    E.Ediciones.sincronizar();
    const st=E.State.st; st.doc=r.pieza.doc; st.objects=r.pieza.objects; st.pal=r.pieza.pal; st.palVar=r.pieza.palVar; st.palRoles=r.pieza.palRoles;
    E.State.setSel([]); E.View.applyDocSize(); E.Render.all(); E.View.fit();
    E.Ediciones.nueva(r.nombre+" (de Inkscape)"); E.History.snap("Importado de Inkscape"); E.Panels.paint();
    const i=r.informe;
    toast(`Importado: ${i.actualizados} cambiados · ${i.sin_cambios} sin cambios · ${i.nuevos} nuevos · ${i.como_imagen} como imagen · ${i.eliminados.length} eliminados`+
      (i.avisos.length?` · ${i.avisos.length} aviso(s) en la consola`:""));
    if(i.avisos.length)console.warn("Importación de Inkscape:\n"+i.avisos.join("\n"));
  }
  return {importar,elegir,abrirComoEdicion};
})();

/* ============================= KEYS ============================ */
E.Keys=(()=>{
  /* copias con grupos PROPIOS (la copia de un grupo no se une al original) y enlaces internos (resaltado) al día */
  function copiar(objs,d,sufijo){
    const grupos={}, ids={};
    const cs=objs.map(o=>{ const c={...deep(o),id:uid(),x:o.x+d,y:o.y+d,name:o.name+(sufijo||"")};
      if(o.groupId)c.groupId=grupos[o.groupId]||(grupos[o.groupId]=uid()); ids[o.id]=c.id; return c; });
    cs.forEach(c=>{ if(c.resalteDe&&ids[c.resalteDe])c.resalteDe=ids[c.resalteDe]; });
    return cs;
  }
  function duplicate(){
    const copies=copiar(E.State.selObjs(),24," copia");
    copies.forEach(c=>E.State.st.objects.push(c));
    E.Render.all(); E.State.setSel(copies.map(c=>c.id)); E.History.snap("Duplicar");
  }
  addEventListener("keydown",e=>{
    if(E.Input.editing())return;
    const mod=e.ctrlKey||e.metaKey, st=E.State.st;
    const k=e.key.toLowerCase();
    if(mod&&k==="z"&&!e.shiftKey){e.preventDefault();E.History.undo();}
    else if((mod&&k==="z"&&e.shiftKey)||(mod&&k==="y")){e.preventDefault();E.History.redo();}
    else if(mod&&k==="c"){e.preventDefault();st.clipboard=deep(E.State.selObjs());toast("Copiado");}
    else if(mod&&k==="v"){e.preventDefault(); if(!st.clipboard)return;
      const cs=copiar(st.clipboard,30,"");
      cs.forEach(c=>st.objects.push(c)); E.Render.all(); E.State.setSel(cs.map(c=>c.id)); E.History.snap("Pegar");}
    else if(mod&&k==="d"){e.preventDefault();duplicate();}
    else if(mod&&k==="g"&&!e.shiftKey){e.preventDefault(); const g=uid();
      E.State.selObjs().forEach(o=>o.groupId=g); E.History.snap("Agrupar"); toast("Agrupado");}
    else if(mod&&k==="g"&&e.shiftKey){e.preventDefault();
      E.State.selObjs().forEach(o=>delete o.groupId); E.History.snap("Desagrupar"); toast("Desagrupado");}
    else if(mod&&k==="a"){e.preventDefault();E.State.setSel(st.objects.filter(o=>!o.locked&&!o.hidden).map(o=>o.id));}
    else if(mod&&k==="s"){e.preventDefault();E.Tpl.saveCurrent();}
    else if(mod&&(k==="+"||k==="=")){e.preventDefault();E.View.zoomIn();}
    else if(mod&&k==="-"){e.preventDefault();E.View.zoomOut();}
    else if(mod&&k==="0"){e.preventDefault();E.View.fit();}
    else if(k==="delete"||k==="backspace"){ if(st.sel.length){E.State.remove(st.sel);E.History.snap("Eliminar");}}
    else if(k==="escape"){
      const menu=document.getElementById("savemenu")||document.getElementById("ctxrevelar");
      if(menu){ menu.remove(); }
      else if(st.sel.length){ E.State.setSel([]); }
      else if(st.objects.length){
        st.objects=[]; st.sel=[]; st.guides={v:[],h:[]};
        st.doc.bg={type:"solid",c1:T("neutral.100"),c2:T("fondos.blanco"),angle:180};
        E.View.drawGuides(); E.Render.all(); E.History.snap("Lienzo en blanco");
        if(E.Marcos&&E.Marcos.refrescarTarjetas)E.Marcos.refrescarTarjetas();
        toast("Lienzo en blanco — todo desde cero (Ctrl+Z recupera)");
      }
    }
    else if(k.startsWith("arrow")){ e.preventDefault(); const d=e.shiftKey?10:1;
      E.State.selObjs().forEach(o=>{ if(k==="arrowleft")o.x-=d; if(k==="arrowright")o.x+=d;
        if(k==="arrowup")o.y-=d; if(k==="arrowdown")o.y+=d; E.Render.one(o.id);});
      E.Render.overlay(); }
  });
  addEventListener("keyup",e=>{ if(e.key.startsWith("Arrow")&&E.State.st.sel.length&&!E.Input.editing())E.History.snap("Mover"); });
  return {duplicate};
})();

/* ================= MARCOS COMO OBJETOS (migrados del editor de medios) =========
   Cada marco se INSERTA como objetos sueltos del editor: banda, filetes, logo,
   chip, monograma y textos son capas independientes — mover, borrar, recolorear,
   agrandar, reemplazar… control total con la maquinaria normal del editor. */
E.Marcos=(()=>{
  const TK={puka:T("puka.600"),qillu:T("qillu.400"),vino:T("puka.800"),tinta:T("neutral.900"),
            papel:T("neutral.100"),blanco:T("fondos.blanco"),qillu900:T("qillu.900"),neutral300:T("neutral.300")};
  const F=c=>({type:"solid",c1:c,c2:c,angle:0});
  /* nombre y cargo del perfil (marca.textos), en mayúsculas como los pide el marco */
  const NOM=()=>rellenarMarcadores("{{titular}}").toUpperCase(), ROL=()=>rellenarMarcadores("{{cargo}}").toUpperCase();
  const FMTS=[["cuadrada_1080x1080",1080,1080],["vertical_1080x1350",1080,1350],
    ["horizontal_1440x1080",1440,1080],["horizontal_1920x1080",1920,1080],
    ["facebook_1200x630",1200,630],["estado_1080x1920",1080,1920]];
  const fmtCercano=(W,H)=>{const r=W/H;
    return FMTS.reduce((m,f)=>Math.abs(f[1]/f[2]-r)<Math.abs(m[1]/m[2]-r)?f:m)[0];};
  async function aData(url){ try{ return await E.Banco.fuenteADataURL(url); }catch(_){ return null; } }
  /* Roles de la COMBINACIÓN activa (pestaña Colores): el marco se construye con
     ellos, así el recoloreo por paletas lo alcanza igual que a las plantillas. */
  const rolesActivos=()=>{ const st=E.State.st;
    return st.palRoles || PALETAS[st.pal] || PALETAS["Rojo oficial"]; };
  /* Si el usuario aún no aplicó una combinación, el marco nace con su look
     CLÁSICO (superficie clara u oscura de marca), con contraste derivado. */
  const rolesParaMarco=(sup)=>{ const st=E.State.st;
    if(st.palRoles) return st.palRoles;
    return derivarRoles(sup==="clara" ? TK.blanco : TK.tinta, TK.puka); };
  /* Textos sobre veladuras/arte oscuro FIJO: tonos propios que no coinciden con
     ningún rol — el recoloreo nunca los vuelve ilegibles. */
  const PAPEL_FIJO=T("neutral.100"), ORO_FIJO=T("qillu.400");
  const _mctx = document.createElement("canvas").getContext("2d");
  function anchoTexto(t, px, peso, ls){
    _mctx.font = `${peso||800} ${px}px "Archivo"`;
    let w = 0; for(const ch of String(t)) w += _mctx.measureText(ch).width + (ls||0);
    return w;
  }
  const txt=(name,text,size,color,x,y,w,extra={})=>NEW.text({name,text,size,color,x,y,w,
    h:Math.round(size*1.25),font:"Archivo",weight:800,upper:true,ls:.5,lh:1.08,...extra});
  function firma(o,W,H,B,cNombre,cRol,cPunto){       // punto + NOMBRE / ROL sobre banda
    const m=Math.max(40,Math.round(W*.045)), rp=Math.max(6,Math.round(B*.075));
    const pxN=Math.round(B*.33), pxR=Math.round(B*.14);
    const y0=H-B+Math.round((B-(pxN+Math.round(B*.12)+pxR))/2);
    o.push(NEW.shape({name:"Marco · punto",shape:"ellipse",x:m,y:y0+Math.round(pxN*.2),w:rp*2,h:rp*2,fill:F(cPunto),palRole:"brandA"}));
    o.push(txt("Marco · nombre",NOM(),pxN,cNombre,m+rp*2+Math.round(B*.11),y0,Math.round(W*.7),{palRole:"text"}));
    o.push(txt("Marco · cargo",ROL(),pxR,cRol,m+rp*2+Math.round(B*.11),y0+pxN+Math.round(B*.12),
      Math.round(W*.7),{weight:600,ls:1.6,palRole:"brandA"}));
  }
  const bandaLinea=(o,W,H,B,cB,cL,tagB)=>{ o.push(NEW.shape({name:"Marco · banda",x:0,y:H-B,w:W,h:B,fill:F(cB),palRole:tagB||"deep"}));
    if(cL)o.push(NEW.shape({name:"Marco · línea",x:0,y:H-B,w:W,h:Math.max(4,Math.round(B*.05)),fill:F(cL),palRole:"brandA"})); };
  async function arteImg(o,estilo,W,H){
    const src=await aData("plantillas/arte/arte_"+estilo+"_"+fmtCercano(W,H)+".png");
    if(src)o.push(NEW.image({name:"Marco · arte "+estilo,src,x:0,y:0,w:W,h:H,radius:0,mask:"none",scale:1}));
    else toast("Sin servidor no se pudo traer el arte de «"+estilo+"» (los textos sí se insertaron)");
  }
  /* HALFTONE paramétrico: los abanicos de puntos se GENERAN en el navegador con
     los colores de la combinación activa, como capas independientes (mover,
     ROTAR con el tirador de rotación, borrar, combinar). Al cambiar de paleta
     se REGENERAN con el color nuevo (o.halftone guarda sus parámetros). */
  function genAbanico(alcance, rMax, hex, esquina){
    const cv=document.createElement("canvas"); cv.width=cv.height=alcance;
    const c=cv.getContext("2d"); c.fillStyle=hex;
    const paso=Math.max(6, Math.round(rMax*2.35));
    const ox=/d/.test(esquina)?alcance:0, oy=/s/.test(esquina)?0:alcance;
    for(let gy=0; gy<=alcance; gy+=paso)
      for(let gx=0; gx<=alcance; gx+=paso){
        const dd=Math.hypot(gx,gy); if(dd>alcance) continue;
        const r=Math.round(rMax*Math.pow(1-dd/alcance,1.25));
        if(r<2) continue;
        c.beginPath();
        c.arc(ox===0?gx:ox-gx, oy===0?gy:oy-gy, r, 0, Math.PI*2); c.fill();
      }
    return cv.toDataURL("image/png");
  }
  function capaAbanico(nombre, rol, esquina, alcance, rMax, x, y, R){
    const o=NEW.image({name:nombre, src:genAbanico(alcance,rMax,R[rol]||TK.qillu,esquina),
      x, y, w:alcance, h:alcance, radius:0, mask:"none", opacity:.9});
    o.halftone={rol, esquina, alcance, rMax};
    return o;
  }

  /* ---- ARTE PARAMÉTRICO por ROLES: veladura, ondas y chumpi se GENERAN con
     los colores de la combinación activa y se REGENERAN al cambiar de paleta,
     igual que los abanicos. Así ningún estilo conserva colores anteriores. ---- */
  const acentoSobre=(R,rolF)=>{ const f=R[rolF]||TK.tinta;
    return _contra(R.brandA,f)>=3 ? R.brandA : _sobre(f); };
  /* Zonas premium: SIEMPRE clara / SIEMPRE oscura (estructura tipo organismo
     internacional), derivadas de la paleta para que la coherencia se mantenga. */
  const claroDe=(R,rol)=>{ const c=R[rol]||TK.papel; return _lum(c)>0.62?c:_mix(c,T("fondos.blanco"),0.90); };
  const oscuroDe=(R,rol)=>{ const c=R[rol]||TK.tinta; return _lum(c)<0.32?c:_mix(c,T("excepcionales.tinta_profunda"),0.74); };
  function genVeladura(w,h,hex){
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
    const c=cv.getContext("2d"); const p=_rgb(hex);
    const g=c.createLinearGradient(0,0,0,h);
    g.addColorStop(0,`rgba(${p[0]},${p[1]},${p[2]},0)`);
    g.addColorStop(1,`rgba(${p[0]},${p[1]},${p[2]},.95)`);
    c.fillStyle=g; c.fillRect(0,0,w,h); return cv.toDataURL("image/png");
  }
  function genOndas(W,H,B,c1,c2,c3){
    const cv=document.createElement("canvas"); cv.width=W; cv.height=H;
    const c=cv.getContext("2d");
    const onda=(y0,amp,lam,fase,color)=>{ c.beginPath(); c.moveTo(0,H);
      c.lineTo(0,y0+amp*Math.sin(fase));
      for(let x=0;x<=W;x+=6) c.lineTo(x, y0+amp*Math.sin(2*Math.PI*x/lam+fase));
      c.lineTo(W,H); c.closePath(); c.fillStyle=color; c.fill(); };
    onda(H-B*1.72, B*0.30, W*0.95, 0.6, c1);
    onda(H-B*1.30, B*0.26, W*0.80, 2.6, c2);
    onda(H-B*0.86, B*0.20, W*1.10, 4.9, c3);
    return cv.toDataURL("image/png");
  }
  function genChumpi(W,H,B,cFondo,cRombo,cAlt,cCentro,cFilete){
    const cv=document.createElement("canvas"); cv.width=W; cv.height=H;
    const c=cv.getContext("2d");
    const P=Math.round(B*0.42), yTop=H-B-P;
    c.fillStyle=cFondo; c.fillRect(0,yTop,W,P);
    const fil=Math.max(2,Math.round(P*0.05));
    c.fillStyle=cFilete; c.fillRect(0,yTop,W,fil); c.fillRect(0,yTop+P-fil,W,fil);
    const pasos=4, u=Math.round(P*0.72)/(pasos*2-1), pasoX=u*(pasos*2-1)+u*4, cy=yTop+P/2;
    const rombo=(cx,cy,uu,ps,color)=>{ c.fillStyle=color; const filas=ps*2-1, y0=cy-filas*uu/2;
      for(let i=0;i<filas;i++){ const un=(i<ps?i+1:filas-i)*2-1, w=un*uu; c.fillRect(cx-w/2,y0+i*uu,w,uu); } };
    const n=Math.ceil(W/pasoX)+1;
    for(let i=0;i<n;i++){ const cx=Math.round(pasoX/2+i*pasoX), par=i%2===0;
      rombo(cx,cy,u,pasos, par?cRombo:cAlt); rombo(cx,cy,u,2,cFondo);
      c.beginPath(); c.arc(cx,cy,Math.max(2,Math.round(u*0.55)),0,Math.PI*2);
      c.fillStyle=cCentro; c.fill(); }
    return cv.toDataURL("image/png");
  }
  /* capa de arte que recuerda su receta (a) para regenerarse con la paleta */
  function capaArte(nombre, a, x, y, w, h, R, opacity){
    const o=NEW.image({name:nombre, src:arteSrc(a,R), x, y, w, h, radius:0, mask:"none",
      opacity: opacity==null?1:opacity});
    o.arte=a; return o;
  }
  function arteSrc(a,R){
    if(a.tipo==="veladura") return genVeladura(a.w, a.h, R[a.rol]||TK.tinta);
    if(a.tipo==="ondas")    return genOndas(a.W, a.H, a.B, R.brandA, R.bg, R.deep);
    if(a.tipo==="chumpi")   return genChumpi(a.W, a.H, a.B, R.deep, R.brandA, R.bg, R.brandA, R.soft);
    return null;
  }
  /* LEMA oficial «Lema del despacho» — reemplaza al monograma
     en TODO el sistema. Apaisado (2044×722): se ancla por su borde DERECHO
     (xDer) y elige la versión clara/oscura según el fondo donde cae. */
  const RATIO_LEMA = 2044/722;
  async function lema(o, xDer, y, h, fondoHex){
    const oscuro = _lum(fondoHex || TK.tinta) < 0.5;
    const src = await aData("banco/_recursos/ilustraciones/lema-solo-el-pueblo"
                            + (oscuro ? "-oscuro" : "") + ".png");
    if(!src){ toast("Sin servidor no se pudo traer el lema"); return; }
    const w = Math.round(h * RATIO_LEMA);
    o.push(NEW.image({name:"Marco · lema", src, x:xDer - w, y, w, h, radius:0, mask:"none"}));
  }
  /* ====== FAMILIA INSTITUCIONAL — base reutilizable (100% por ROLES) ======
     Banda de firma con logo del Congreso + nombre + cargo (+ lema opcional),
     legible sobre cualquier fondo y sincronizada con la paleta. opt afina cada
     variante (fondo, filetes, estilo del cargo, reserva a la derecha). */
  async function firmaInst(o,W,H,B,R,opt){
    opt=opt||{};
    const fondoRol=opt.fondo||"bg";
    const g=Math.max(5,Math.round(B*.05)), zona=B-g, m=Math.max(40,Math.round(W*.045));
    const oscura=_lum(R[fondoRol])<0.5;
    o.push(NEW.shape({name:"Marco · banda",x:0,y:H-B,w:W,h:B,fill:F(R[fondoRol]),palRole:fondoRol}));
    let yl=H-B;
    (opt.lineas||[["brandA",Math.max(4,Math.round(B*.05))]]).forEach((ln,i)=>{
      o.push(NEW.shape({name:"Marco · filete "+(i+1),x:0,y:yl,w:W,h:ln[1],fill:F(R[ln[0]]),palRole:ln[0]})); yl+=ln[1]; });
    // logo del Congreso (claro/oscuro según el fondo)
    let x=m;
    const src=await aData(oscura?"logo/isotipo/imagotipo-congreso-edificio-blanco.png"
                                :"logo/isotipo/imagotipo-congreso-edificio.png");
    if(src){ const lh=Math.round(zona*(opt.logoH||.56)), lw=Math.round(lh*1.745);
      o.push(NEW.image({name:"Marco · logo institucional",src,x,y:H-B+g+Math.round((zona-lh)/2),w:lw,h:lh,radius:0,mask:"none"}));
      x+=lw+Math.round(B*.22); }
    if(opt.divisor){ o.push(NEW.shape({name:"Marco · divisor",x,y:H-B+g+Math.round(zona*.22),
      w:Math.max(2,Math.round(B*.006)),h:Math.round(zona*.56),fill:F(R.soft),palRole:"soft"})); x+=Math.round(B*.22); }
    // reserva a la derecha: lema y/o decoración de la variante
    const conLema=opt.lema!==false;
    const hL=conLema?Math.round(zona*(opt.lemaH||.5)):0, wLema=conLema?Math.round(hL*RATIO_LEMA):0;
    const reservaDer=(wLema?wLema+Math.round(B*.14):0)+(opt.reservaDer||0);
    const cNombre=_sobre(R[fondoRol]), cAcento=acentoSobre(R,fondoRol);
    const maxW=Math.max(120,W-x-m-reservaDer);
    let pxN=Math.round(zona*(opt.nombreH||.32));
    while(pxN>12 && anchoTexto(NOM(),pxN,800,.5)>maxW) pxN--;
    const pxR=Math.round(zona*(opt.cargoH||.145));
    if(opt.cargo==="chip"){
      const gapNC=Math.round(zona*.13), altoChip=Math.round(pxR*1.7);
      const yN=H-B+g+Math.round((zona-(pxN+gapNC+altoChip))/2);
      o.push(txt("Marco · nombre",NOM(),pxN,cNombre,x,yN,maxW+12,{palRoleContraste:fondoRol}));
      const yChip=yN+pxN+gapNC, wChip=Math.round(pxR*.55*2+anchoTexto(ROL(),pxR,700,1.2))+6;
      o.push(NEW.shape({name:"Marco · chip",x,y:yChip,w:wChip,h:altoChip,fill:F(R.brandA),palRole:"brandA"}));
      o.push(txt("Marco · cargo",ROL(),pxR,R.ctaText,x+Math.round(pxR*.55),yChip+Math.round((altoChip-pxR)/2),Math.round(W*.4),{weight:700,ls:1.2,palRole:"ctaText"}));
    }else if(opt.cargo==="linea"){
      const gapNC=Math.round(zona*.14);
      const yN=H-B+g+Math.round((zona-(pxN+gapNC+pxR))/2);
      o.push(txt("Marco · nombre",NOM(),pxN,cNombre,x,yN,maxW+12,{palRoleContraste:fondoRol}));
      o.push(NEW.shape({name:"Marco · regla",x,y:yN+pxN+Math.round(gapNC*.32),w:Math.round(pxN*1.2),h:Math.max(3,Math.round(B*.028)),fill:F(cAcento),palRoleAcento:fondoRol}));
      o.push(txt("Marco · cargo",ROL(),pxR,cAcento,x,yN+pxN+gapNC,maxW,{weight:600,ls:1.7,palRoleAcento:fondoRol}));
    }else{
      const gapNC=Math.round(zona*.1);
      const yN=H-B+g+Math.round((zona-(pxN+gapNC+pxR))/2);
      o.push(txt("Marco · nombre",NOM(),pxN,cNombre,x,yN,maxW+12,{palRoleContraste:fondoRol}));
      o.push(txt("Marco · cargo",ROL(),pxR,cAcento,x,yN+pxN+gapNC,maxW,{weight:600,ls:1.6,palRoleAcento:fondoRol}));
    }
    if(conLema) await lema(o,W-m,H-B+g+Math.round((zona-hL)/2),hL,R[fondoRol]);
    return {x,m,g,zona,oscura};
  }

  /* ===== FIRMA INSTITUCIONAL PREMIUM (nivel organismo nacional/internacional) =====
     Banda de dos zonas con corte DIAGONAL: izquierda clara con el logo institucional
     + «{{institucion}} / {{entidad}}» del perfil; derecha oscura con
     el lema, el NOMBRE y el chip del cargo. Estructura clara/oscura constante
     (siempre elegante) y acentos por ROLES (siguen la paleta). Devuelve métricas. */
  async function firmaInstPro(o,W,H,B,R,opt){
    opt=opt||{};
    const m=Math.max(40,Math.round(W*.045)), g=opt.filete===false?0:Math.max(4,Math.round(B*.028)), zona=B-g, yB=H-B, yz=yB+g;
    const claro=claroDe(R,"bg"), oscuro=oscuroDe(R,"deep");
    const split=opt.split!=null?opt.split:0.54, off=opt.diag!=null?opt.diag:Math.round(B*0.30);
    const sT=((W*split+off)/W*100).toFixed(2), sB=((W*split-off)/W*100).toFixed(2);
    // filete(s) superior(es) de acento
    if(g>0){ o.push(NEW.shape({name:"Marco · filete",x:0,y:yB,w:W,h:g,fill:F(R.brandA),palRole:"brandA"}));
      if(opt.dobleFilete) o.push(NEW.shape({name:"Marco · filete 2",x:0,y:yB+g,w:W,h:Math.max(2,Math.round(B*.014)),fill:F(R.soft),palRole:"soft"})); }
    const yz2=yz+(opt.dobleFilete?Math.max(2,Math.round(B*.014)):0), zona2=B-(yz2-yB);
    // dos zonas con diagonal (path sobre la banda)
    o.push(NEW.shape({name:"Marco · zona izq",shape:"path",x:0,y:yz2,w:W,h:zona2,d:`M0 0 L${sT} 0 L${sB} 100 L0 100 Z`,fill:F(claro),palRoleClaro:"bg",stroke:{c:"#000",w:0}}));
    o.push(NEW.shape({name:"Marco · zona der",shape:"path",x:0,y:yz2,w:W,h:zona2,d:`M${sT} 0 L100 0 L100 100 L${sB} 100 Z`,fill:F(oscuro),palRoleOscuro:"deep",stroke:{c:"#000",w:0}}));
    // ----- IZQUIERDA: edificio + texto institucional -----
    let x=m; const cIzq=_sobre(claro);
    const ed=await aData("logo/isotipo/imagotipo-congreso-edificio.png");
    if(ed){ const eh=Math.round(zona2*.80), ew=Math.round(eh*1.744);
      o.push(NEW.image({name:"Marco · logo institucional",src:ed,x,y:yz2+Math.round((zona2-eh)/2),w:ew,h:eh,radius:0,mask:"none"})); x+=ew+Math.round(B*.14); }
    o.push(NEW.shape({name:"Marco · divisor",x,y:yz2+Math.round(zona2*.15),w:Math.max(2,Math.round(B*.008)),h:Math.round(zona2*.7),fill:F(R.brandA),palRole:"brandA"})); x+=Math.round(B*.16);
    // el texto institucional se AJUSTA para no cruzar la diagonal
    const anchoIzq=Math.max(80, Math.round(W*split)-off-x-Math.round(B*.05));
    // institución en dos líneas (la primera mitad de sus palabras arriba) y la entidad debajo, del perfil
    const pal=rellenarMarcadores("{{institucion}}").toUpperCase().split(/\s+/).filter(Boolean), corte=Math.ceil(pal.length/2);
    const instA=pal.slice(0,corte).join(" "), instB=pal.slice(corte).join(" "), entidad=rellenarMarcadores("{{entidad}}").toUpperCase();
    let px1=Math.round(zona2*.19);
    while(px1>10 && Math.max(anchoTexto(instA,px1,800,.4),anchoTexto(instB,px1,800,.4))>anchoIzq) px1--;
    let px2=Math.round(zona2*.11);
    while(px2>8 && anchoTexto(entidad,px2,600,1.2)>anchoIzq) px2--;
    const gp=Math.round(zona2*.045), reglaH=Math.max(2,Math.round(B*.013));
    const altoTxt=px1*2+Math.round(gp*.3)+Math.round(gp*.7)+reglaH+Math.round(gp*.8)+px2;
    const yT=yz2+Math.round((zona2-altoTxt)/2);
    o.push(txt("Marco · inst A",instA,px1,cIzq,x,yT,anchoIzq+40,{weight:800,ls:.4,upper:true,palRoleTxtClaro:"bg"}));
    o.push(txt("Marco · inst B",instB,px1,cIzq,x,yT+px1+Math.round(gp*.3),anchoIzq+40,{weight:800,ls:.4,upper:true,palRoleTxtClaro:"bg"}));
    const yR=yT+px1*2+Math.round(gp*.3)+Math.round(gp*.7);
    o.push(NEW.shape({name:"Marco · regla inst",x,y:yR,w:Math.min(anchoIzq,Math.round(px1*3.6)),h:reglaH,fill:F(R.brandA),palRole:"brandA"}));
    o.push(txt("Marco · inst C",entidad,px2,cIzq,x,yR+Math.round(gp*.8),anchoIzq+40,{weight:600,ls:1.2,upper:true,palRoleTxtClaro:"bg"}));
    // ----- DERECHA: chip anclado al fondo · nombre encima · lema arriba -----
    const xD=Math.round(W*split)+Math.round(off*.6)+Math.round(B*.11);
    const reservaBusto=opt.reservaDer||0;
    const anchoD=Math.max(120, W-xD-m-reservaBusto);
    const cDer=_sobre(oscuro);
    // chip del cargo en UNA línea; si no cabe en la zona, se reduce el cuerpo
    let pxC=Math.round(zona2*.13), padC=Math.round(pxC*.55), wCh=Math.round(anchoTexto(ROL(),pxC,800,1.2))+padC*2+Math.round(pxC*.3);
    while(pxC>9 && wCh>anchoD){ pxC--; padC=Math.round(pxC*.55); wCh=Math.round(anchoTexto(ROL(),pxC,800,1.2))+padC*2+Math.round(pxC*.3); }
    const chipH=pxC+padC*2;
    const yC=yz2+zona2-Math.round(zona2*.07)-chipH;   // el chip nunca se sale
    o.push(NEW.shape({name:"Marco · chip",x:xD,y:yC,w:wCh,h:chipH,fill:F(R.brandA),palRole:"brandA"}));
    o.push(txt("Marco · cargo",ROL(),pxC,R.ctaText,xD+padC+Math.round(pxC*.15),yC+padC,wCh,{weight:800,ls:1.2,upper:true,palRole:"ctaText"}));
    let pxN=Math.round(zona2*(opt.nombreH||.28));
    while(pxN>12 && anchoTexto(NOM(),pxN,900,.3)>anchoD) pxN--;
    const yN=yC-Math.round(zona2*.05)-pxN;
    o.push(txt("Marco · nombre",NOM(),pxN,cDer,xD,yN,anchoD+8,{weight:900,ls:.3,palRoleTxtOscuro:"deep"}));
    if(opt.lema!==false){ const hL=Math.max(24, Math.min(Math.round(zona2*.30), yN-yz2-Math.round(zona2*.05)));
      await lema(o, W-m-reservaBusto, yz2+Math.round(zona2*.05), hL, oscuro); }
    return {m,g,zona:zona2,yz:yz2,xD,anchoD,split,off,claro,oscuro};
  }

  const ESTILOS={

  async function insertar(clave){
    const st=E.State.st, {w:W,h:H}=st.doc, B=Math.round(Math.min(W,H)*.167);
    const esMarco=o=>/^Marco ·/.test(o.name||"");
    const hayMarco=st.objects.some(esMarco);
    // SEGUNDO CLIC sobre el estilo activo = QUITAR el marco (toggle)
    if(hayMarco && ultimoEstilo===clave){
      st.objects=st.objects.filter(o=>!esMarco(o));
      ultimoEstilo=null; E.Render.all(); E.History.snap("Marco quitado");
      marcarTarjetas(); toast("Marco quitado ✓ (clic de nuevo para aplicarlo)");
      return;
    }
    // Con OTRO estilo activo: solo se cambian las capas del marco (el resto queda)
    if(hayMarco){
      st.objects=st.objects.filter(o=>!esMarco(o));
      ultimoEstilo=clave;
      await insertarSobre(clave);
      E.History.snap("Marco → "+clave); marcarTarjetas();
      toast("Marco cambiado a «"+ESTILOS[clave].n+"»");
      return;
    }
    // Sin marco activo, CON contenido (una plantilla/pieza): el marco se aplica
    // ENCIMA (complementario), quitando la firma simple para no superponerla.
    // Así puedes escoger el marco institucional más adecuado y cambiarlo/quitarlo.
    const soloVentana=st.objects.length===1 && st.objects[0].type==="image" && !st.objects[0].src;
    if(st.objects.length>0 && !soloVentana){
      st.objects=st.objects.filter(o=>!/^Firma /.test(o.name||""));   // fuera la firma simple de plantilla
      ultimoEstilo=clave;
      await insertarSobre(clave);
      E.History.snap("Marco "+clave); marcarTarjetas();
      toast("Marco «"+ESTILOS[clave].n+"» aplicado sobre la pieza · 2.º clic lo quita · otro estilo lo cambia");
      return;
    }
    // Lienzo vacío: el marco abre una pieza NUEVA (ventana de foto/video + marco).
    const o=[];
    o.push(NEW.image({name:"Foto o video (doble clic: subir)",x:0,y:0,w:W,h:H,
                      radius:0,mask:"none",src:null}));
    try{ await ESTILOS[clave].make(o,W,H,B,rolesParaMarco(ESTILOS[clave].sup)); }
    catch(e){ console.error(e); toast("No se pudo armar el marco"); return; }
    ultimoEstilo = clave;
    st.objects = [];
    o.forEach(x=>E.State.addObj(x,false));
    E.State.setSel([o[0].id]);
    E.History.snap("Marco "+clave); marcarTarjetas();
    toast("Marco «"+ESTILOS[clave].n+"» listo: doble clic en la ventana para tu foto (2.º clic en la tarjeta lo quita)");
  }
  async function insertarMosca(){

      st.objects=st.objects.filter(o=>o.name!=="Mosca · lema");
      E.Render.all(); E.History.snap("Mosca quitada"); marcarTarjetas();

  /* Los marcos SOBREVIVEN al cambio de plantilla: se re-colocan encima de la
     plantilla nueva, y la FOTO del usuario rellena su primer hueco de foto. */
  let ultimoEstilo = null;
  async function insertarSobre(clave){
    const {w:W,h:H}=E.State.st.doc, B=Math.round(Math.min(W,H)*.167), o=[];
    try{ await ESTILOS[clave].make(o,W,H,B,rolesParaMarco(ESTILOS[clave].sup)); }catch(e){ return; }
    o.forEach(x=>E.State.addObj(x,false)); E.Render.all();
  }
  function conservar(fn){
    return function(){
      const st=E.State.st;
      const foto=st.objects.find(o=>o.type==="image"&&o.src&&!/^(Marco ·|Mosca ·|Puño ·|Logo |Lema |Marca de agua)/.test(o.name||""));
      const r=fn.apply(this,arguments);
      try{
        /* Los MARCOS son INDEPENDIENTES de las plantillas: al cargar una
           plantilla NO se conservan (se aplican expresamente con su tarjeta).
           La FOTO del usuario sí pasa al primer hueco de la plantilla nueva. */
        if(foto){
          const hueco=st.objects.find(o=>o.type==="image"&&!o.src);
          if(hueco){ hueco.src=foto.src; hueco.scale=1; hueco.ox=0; hueco.oy=0;
            E.History.snap("Plantilla (foto conservada)");
            toast("Tu foto pasó a la plantilla nueva ✓"); }
        }
        E.Render.all(); marcarTarjetas();
      }catch(e){ console.error(e); }
      return r;
    };
  }
  E.Tpl.loadBrand=conservar(E.Tpl.loadBrand);
  E.Tpl.loadMine=conservar(E.Tpl.loadMine);

  /* Recoloreo EXACTO de los marcos: tras el remapeo por coincidencia de HEX
     (que confunde roles cuando dos comparten color), las capas etiquetadas con
     palRole reciben SU rol de la combinación nueva. Cero colisiones: las letras
     nunca quedan del color del fondo, y un marco «dañado» se repara al
     siguiente clic. Los colores personalizados por el usuario se respetan. */
  const _palApply=E.Pal.apply;
  E.Pal.apply=function(){
    const stt=E.State.st;
    const cur=stt.palRoles||PALETAS[stt.pal]||null;
    const r=_palApply.apply(this,arguments);
    const tgt=stt.palRoles;
    if(tgt){
      const prot=new Set([...(cur?Object.values(cur):[]),...Object.values(TK),
        ...Object.values(derivarRoles(TK.blanco,TK.puka)),
        ...Object.values(derivarRoles(TK.tinta,TK.puka)),
        T("fondos.blanco")].map(x=>String(x).toUpperCase()));
      let n=0;
      stt.objects.forEach(o=>{
        if(o.arte){ const src=arteSrc(o.arte,tgt); if(src){o.src=src; n++;} return; }
        if(o.halftone && tgt[o.halftone.rol]){
          o.src=genAbanico(o.halftone.alcance, o.halftone.rMax,
                           tgt[o.halftone.rol], o.halftone.esquina);
          n++; return;
        }
        if(o.palRoleContraste && tgt[o.palRoleContraste]){
          o.color=_sobre(tgt[o.palRoleContraste]); n++; return;
        }
        if(o.palRoleClaro && tgt[o.palRoleClaro]){ const nu=claroDe(tgt,o.palRoleClaro);
          if(o.fill){o.fill.c1=nu;o.fill.c2=nu;} n++; return; }
        if(o.palRoleOscuro && tgt[o.palRoleOscuro]){ const nu=oscuroDe(tgt,o.palRoleOscuro);
          if(o.fill){o.fill.c1=nu;o.fill.c2=nu;} n++; return; }
        if(o.palRoleTxtClaro && tgt[o.palRoleTxtClaro]){ o.color=_sobre(claroDe(tgt,o.palRoleTxtClaro)); n++; return; }
        if(o.palRoleTxtOscuro && tgt[o.palRoleTxtOscuro]){ o.color=_sobre(oscuroDe(tgt,o.palRoleTxtOscuro)); n++; return; }
        if(o.palRoleAcento && tgt[o.palRoleAcento]){
          const nu=acentoSobre(tgt,o.palRoleAcento);
          if(o.palRoleEn==="stroke"){ if(o.stroke)o.stroke.c=nu; }
          else if(o.type==="text"||o.type==="icon")o.color=nu;
          else if(o.fill){ o.fill.c1=nu; o.fill.c2=nu; }
          n++; return;
        }
        const rol=o.palRole; if(!rol||!tgt[rol])return;
        const actual=o.palRoleEn==="stroke" ? (o.stroke&&o.stroke.c)
          : (o.type==="text"||o.type==="icon" ? o.color : o.fill&&o.fill.c1);
        if(actual&&!prot.has(String(actual).toUpperCase()))return;  // personalizado
        const nuevo=tgt[rol];
        if(o.palRoleEn==="stroke"){ if(o.stroke)o.stroke.c=nuevo; }
        else if(o.type==="text"||o.type==="icon")o.color=nuevo;
        else if(o.fill){ o.fill.c1=nuevo; o.fill.c2=nuevo; }
        n++;
      });
      if(n)E.Render.all();
    }
    return r;
  };

  /* Estado visual de las tarjetas: la aplicada queda resaltada */
  function marcarTarjetas(){
    const lp=document.getElementById("leftpanel"); if(!lp) return;
    const st=E.State.st;
    const hayMarco=st.objects.some(o=>/^Marco ·/.test(o.name||""));
    lp.querySelectorAll("[data-marco]").forEach(c=>{
      const on=hayMarco && c.dataset.marco===ultimoEstilo;
      c.style.borderColor=on?"var(--est-acento-linea)":"";
      c.title=on?"Aplicado · segundo clic lo quita":"Clic para aplicar";
    });
    const mm=lp.querySelector('[data-marco-extra="mosca"]');
    if(mm) mm.style.borderColor=st.objects.some(o=>o.name==="Mosca · lema")?"var(--est-acento-linea)":"";
    const cc=lp.querySelector('[data-marco-extra="cintillo"]');
    if(cc) cc.style.borderColor=st.objects.some(o=>/^Cintillo ·/.test(o.name||""))?"var(--est-acento-linea)":"";
  }
  const _paint=E.Panels.paint;
  E.Panels.paint=function(){ _paint.apply(this,arguments); try{ inyectarUI(); }catch(_){}
  };
  /* El panel se repinta también por rutas internas (cambio de pestaña, búsquedas):
     un observador re-inyecta la sección SIEMPRE que falte — ya no desaparece. */
  try{
    new MutationObserver(()=>{ try{ inyectarUI(); }catch(_){ } })
      .observe(document.getElementById("leftpanel"), {childList:true});
  }catch(_){ }
  /* Cambiar el TAMAÑO DEL LIENZO adapta el contenido automáticamente:
     la ventana de foto/video se estira al lienzo nuevo, los demás objetos se
     reescalan en proporción (los textos con el factor menor, sin deformarse)
     y el marco se REARMA a la medida nueva en vez de quedar del tamaño viejo. */
  const _selDoc = document.getElementById("docsize");
  if(_selDoc){
    const _antes = _selDoc.onchange;
    _selDoc.onchange = async (e)=>{
      const st = E.State.st, w0 = st.doc.w, h0 = st.doc.h;
      if(_antes) _antes(e);
      const W = st.doc.w, H = st.doc.h;
      if(W === w0 && H === h0) return;         // canceló o puso el mismo tamaño
      const fx = W/w0, fy = H/h0, fmin = Math.min(fx, fy);
      const esMarco = o => /^Marco ·/.test(o.name||"");
      const habiaMarco = st.objects.some(esMarco);
      const puedeRearmar = habiaMarco && !!ultimoEstilo;
      if(puedeRearmar) st.objects = st.objects.filter(o=>!esMarco(o));
      st.objects.forEach(o=>{
        const esVentana = o.type==="image" && Math.abs(o.x)<4 && Math.abs(o.y)<4
          && o.w >= w0*0.95 && o.h >= h0*0.95;
        if(esVentana){ o.x=0; o.y=0; o.w=W; o.h=H; return; }
        o.x = Math.round(o.x*fx); o.y = Math.round(o.y*fy);
        o.w = Math.max(8, Math.round(o.w*fx)); o.h = Math.max(8, Math.round(o.h*fy));
        if(o.type==="text") o.size = Math.max(8, Math.round(o.size*fmin));
      });
      if(puedeRearmar) await insertarSobre(ultimoEstilo);
      E.Render.all(); E.View.fit();
      E.History.snap("Lienzo adaptado");
      toast(habiaMarco ? "Lienzo, contenido y marco adaptados al tamaño nuevo ✓"
                       : "Contenido adaptado al tamaño nuevo ✓");
    };
  }

  /* Construye los objetos de UNA pieza (ventana con foto + marco) para el modo
     lote, sin tocar el estado del editor. Devuelve objetos con id asignado. */
  async function construirPieza(clave, W, H, R, fotoSrc, ajustes){
    const o=[];
    const ventana=NEW.image({name:"Foto",x:0,y:0,w:W,h:H,radius:0,mask:"none",src:fotoSrc||null});
    ventana.filters={br:(ajustes&&ajustes.br)||100, ct:(ajustes&&ajustes.ct)||100,
                     sat:(ajustes&&ajustes.sat)||100, blur:0};
    o.push(ventana);
    if(clave && ESTILOS[clave]){
      const B=Math.round(Math.min(W,H)*.167);
      try{ await ESTILOS[clave].make(o,W,H,B,R||rolesParaMarco(ESTILOS[clave].sup)); }catch(e){ console.error(e); }
    }
    o.forEach(x=>x.id=x.id||uid());
    return o;
  }
  const listaEstilos=()=>Object.entries(ESTILOS).map(([k,v])=>({k,n:v.n}));
  return {insertar,insertarMosca,insertarCintillo,refrescarTarjetas:marcarTarjetas,
          construirPieza,listaEstilos};
})();

/* ================= MODO LOTE (varias fotos, edición tipo Instagram) =========
   Seleccionas varias fotos del banco → eliges UN marco + formato + paleta y se
   generan todas las piezas. Vista de tira de miniaturas: ajustas color/marco al
   GRUPO o a una foto INDIVIDUAL, y exportas todas juntas. */
E.Lote=(()=>{
  const FORMATOS=[["Cuadrado 1:1",1080,1080],["Vertical 4:5",1080,1350],
    ["Historia 9:16",1080,1920],["Panorámica 16:9",1920,1080],
    ["Foto 4:3",1440,1080],["Facebook 1200×630",1200,630]];
  let piezas=[], activa=-1, ov=null;
  const G={fmt:0, marco:"institucional", pal:null, ajustes:{br:100,ct:100,sat:100}};
  const rolesPal=()=> G.pal ? rolesDe(G.pal,0) : (E.State.st.palRoles||PALETAS[E.State.st.pal]||PALETAS["Rojo oficial"]);

  async function reconstruir(i){
    const p=piezas[i], [,,]=[], f=FORMATOS[G.fmt];
    p.doc={w:f[1], h:f[2], bg:{type:"solid",c1:T("neutral.100"),c2:T("fondos.blanco"),angle:180}};
    p.objects=await E.Marcos.construirPieza(p.marco, f[1], f[2], rolesPal(), p.foto.src, p.ajustes);
    pintarMini(i);
  }
  async function reconstruirTodas(){ for(let i=0;i<piezas.length;i++) await reconstruir(i); }

  async function pintarMini(i){
    const cel=ov&&ov.querySelector(`[data-mini="${i}"] .lote-thumb`); if(!cel) return;
    const p=piezas[i];
    const cv=await E.Export.renderEstado(p.doc, p.objects, Math.min(1, 320/p.doc.w));
    cel.style.backgroundImage=`url(${cv.toDataURL("image/jpeg",.82)})`;
    cel.style.aspectRatio=p.doc.w+"/"+p.doc.h;
  }

  function ctrlGrupoLabel(){ return activa>=0 ? `Editando la foto ${activa+1}` : "Editando TODO el grupo"; }
  function aplicaA(){ return activa>=0 ? [activa] : piezas.map((_,i)=>i); }

  async function setMarco(clave){ aplicaA().forEach(i=>piezas[i].marco=clave);
    for(const i of aplicaA()) await reconstruir(i); repintarCtrls(); }
  async function setAjuste(k,v){ aplicaA().forEach(i=>piezas[i].ajustes[k]=v);
    for(const i of aplicaA()) await reconstruir(i); }

  function repintarCtrls(){
    if(!ov) return;
    ov.querySelector("#lote-modo").textContent=ctrlGrupoLabel();
    const ref = activa>=0 ? piezas[activa] : piezas[0];
    ov.querySelector("#lote-marco").value=ref? ref.marco : G.marco;
    ["br","ct","sat"].forEach(k=>{ const el=ov.querySelector("#lote-"+k);
      if(el&&ref) el.value=ref.ajustes[k]; });
    ov.querySelectorAll("[data-mini]").forEach(m=>m.classList.toggle("on",+m.dataset.mini===activa));
    ov.querySelector("#lote-desel").style.display=activa>=0?"inline-block":"none";
  }

  function pintar(){
    const estilos=E.Marcos.listaEstilos();
    ov.querySelector("#lote-cuerpo").innerHTML=piezas.map((p,i)=>`
      <div class="lote-cel" data-mini="${i}">
        <div class="lote-thumb"></div>
        <div class="lote-cap">${i+1}. ${escapeHtml((p.foto.name||"").split("/").pop().slice(0,20))}</div>
      </div>`).join("");
    ov.querySelector("#lote-marco").innerHTML=estilos.map(e=>`<option value="${e.k}">${e.n}</option>`).join("");
    ov.querySelector("#lote-fmt").innerHTML=FORMATOS.map((f,i)=>`<option value="${i}">${f[0]}</option>`).join("");
    ov.querySelector("#lote-pal").innerHTML=`<option value="">Paleta actual</option>`+
      Object.keys(FAMILIAS).map(n=>`<option value="${n}">${n}</option>`).join("");
    ov.querySelectorAll("[data-mini]").forEach(m=>m.onclick=()=>{
      const i=+m.dataset.mini; activa=(activa===i?-1:i); repintarCtrls(); });
    piezas.forEach((_,i)=>pintarMini(i));
    repintarCtrls();
  }

  async function exportar(){
    const btn=ov.querySelector("#lote-exportar"); btn.disabled=true; const t0=btn.textContent;
    const ts=tsEditor();   // mismo sello para todo el lote + _NN por foto → únicos
    for(let i=0;i<piezas.length;i++){
      btn.textContent=`Exportando ${i+1}/${piezas.length}…`;
      const p=piezas[i];
      const cv=await E.Export.renderEstado(p.doc, p.objects, 1);
      await new Promise(res=>cv.toBlob(b=>{
        const a=document.createElement("a"); a.href=URL.createObjectURL(b);
        a.download=`${ts}_${String(i+1).padStart(2,"0")}.png`; a.click();
        setTimeout(()=>{URL.revokeObjectURL(a.href);res();},350);
      },"image/png"));
    }
    btn.disabled=false; btn.textContent=t0; toast(`${piezas.length} piezas exportadas ✓`);
  }

  function cerrar(){ if(ov){ov.remove(); ov=null;} piezas=[]; activa=-1; }

  async function abrir(fotos){
    if(!fotos||!fotos.length) return;
    piezas=fotos.slice(0,40).map(f=>({foto:f, marco:G.marco, ajustes:{...G.ajustes}, doc:null, objects:[]}));
    activa=-1;
    ov=document.createElement("div"); ov.id="lote-overlay";
    ov.innerHTML=`<div id="lote-panel">
      <div id="lote-top">
        <b style="font:800 15px Inter">Lote · ${piezas.length} fotos</b>
        <span id="lote-modo" class="lote-badge">Editando TODO el grupo</span>
        <button id="lote-desel" class="lb" style="display:none">✕ Grupo</button>
        <span style="flex:1"></span>
        <button id="lote-exportar" class="lb prim">⬇ Exportar todas</button>
        <button id="lote-cerrar" class="lb">Cerrar</button>
      </div>
      <div id="lote-ctrls">
        <label>Formato <select id="lote-fmt"></select></label>
        <label>Marco <select id="lote-marco"></select></label>
        <label>Color <select id="lote-pal"></select></label>
        <label>Brillo <input type="range" id="lote-br" min="40" max="180" value="100"></label>
        <label>Contraste <input type="range" id="lote-ct" min="40" max="180" value="100"></label>
        <label>Saturación <input type="range" id="lote-sat" min="0" max="200" value="100"></label>
      </div>
      <div id="lote-cuerpo"></div>
      <p class="note" style="margin:8px 14px">Clic en una foto para ajustarla <b>sola</b>; sin selección, los cambios afectan a <b>todo el grupo</b>. Se exporta un PNG por foto.</p>
    </div>`;
    document.body.appendChild(ov);
    pintar();
    ov.querySelector("#lote-cerrar").onclick=cerrar;
    ov.querySelector("#lote-desel").onclick=()=>{ activa=-1; repintarCtrls(); };
    ov.querySelector("#lote-exportar").onclick=exportar;
    ov.querySelector("#lote-fmt").onchange=async e=>{ G.fmt=+e.target.value; await reconstruirTodas(); };
    ov.querySelector("#lote-marco").onchange=e=>setMarco(e.target.value);
    ov.querySelector("#lote-pal").onchange=async e=>{ G.pal=e.target.value||null; await reconstruirTodas(); };
    ["br","ct","sat"].forEach(k=>{ const el=ov.querySelector("#lote-"+k);
      el.oninput=e=>setAjuste(k,+e.target.value); });
    await reconstruirTodas();
  }
  const escapeHtml=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
  return {abrir};
})();

/* ---- clic derecho sobre una FOTO → revelarla en el editor de medios ---- */
document.addEventListener("contextmenu",ev=>{
  const sel=E.State.selObjs?E.State.selObjs():[];
  if(sel.length!==1||sel[0].type!=="image"||!sel[0].src)return;
  ev.preventDefault();
  const prev=document.getElementById("ctxrevelar"); if(prev)prev.remove();
  const m=document.createElement("div"); m.id="ctxrevelar";
  m.style.cssText=`position:fixed;left:${ev.clientX}px;top:${ev.clientY}px;z-index:200;
    background:var(--est-sup-3);border:1px solid var(--est-borde-control);border-radius:var(--est-radio);padding:4px;
    box-shadow:var(--est-sombra-menu)`;
  m.innerHTML=`<button style="display:block;background:none;border:0;color:var(--est-texto);
    padding:8px 10px;border-radius:var(--est-radio-sm);cursor:pointer;font:500 13px var(--est-fuente)">
    🎬 Revelar esta foto en Medios (brillo, color, recorte…)</button>`;
  document.body.appendChild(m);
  m.querySelector("button").onclick=async()=>{
    m.remove();
    const o=sel[0];
    try{
      if(!E.Banco.activo())throw new Error("Necesita el servidor (./abrir-editor.sh)");
      let url=o.src;
      if(url.startsWith("data:")){
        const r=await E.Banco.subir((o.name||"foto").replace(/[^\wáéíóúñ.-]+/gi,"_")+".png",url);
        url=r.url||r.archivo; if(!url)throw new Error("El banco no devolvió la ruta");
      }
      window.open("media.html?imagen="+encodeURIComponent(url),"_blank");
    }catch(e){ toast("No se pudo abrir en Medios: "+e.message); }
  };
  const close=e2=>{ if(!m.contains(e2.target)){ m.remove(); document.removeEventListener("mousedown",close); } };
  setTimeout(()=>document.addEventListener("mousedown",close),0);
});

/* ============================ ARRANQUE ========================= */
E.Panels.paint();
/* Banco vinculado: detecta el servidor local y carga la carpeta del proyecto.
   Es asíncrono (no bloquea el arranque). Al volver el foco al editor se relee
   la carpeta, para que las fotos agregadas a mano aparezcan solas. */
function _refrescarBanco(){ if(E.Panels.panelActual()==="img")E.Panels.paint(); }
E.Banco.detectar().then(ok=>ok?E.Banco.cargar():false).then(ok=>{ if(ok)_refrescarBanco(); });
window.addEventListener("focus",()=>{ if(E.Banco.activo())E.Banco.cargar().then(ok=>{ if(ok)_refrescarBanco(); }); });
(async function(){
  /* PRIMERO: cargar el estado DURABLE (servidor → espejo local) ANTES de decidir
     qué abrir. Así, al refrescar o reabrir desde cero, siempre entra la ÚLTIMA
     versión guardada y nunca una temporal o antigua. */
  /* Modo prueba sin interfaz (adaptadores/generar.py comprobar): no carga estado. */
  if(new URLSearchParams(location.search).get("prueba")==="svg-editable"){ await E.SvgEditable.prueba(); return; }
  await cargarTextosPerfil();   // {{titular}}, {{region}}… de las plantillas, del perfil (antes de abrir ninguna)
  await E.Store.boot();
  /* Vaciar lo pendiente al SALIR (cerrar pestaña, refrescar o cambiar de app):
     captura el estado vivo del lienzo y lo envía de una vez. Sin esto, el
     autoguardado con debounce podía perder el último cambio si salías rápido. */
  const _flush=()=>{ try{ E.Ediciones&&E.Ediciones.persistir&&E.Ediciones.persistir(); }catch(_){}
    E.Store.flush(); };
  window.addEventListener("pagehide",_flush);
  window.addEventListener("beforeunload",_flush);
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden")_flush(); });

  /* deep-link: #tpl=N (&pal=Nombre) — útil para pruebas y accesos directos */
  const h=location.hash||"", m=h.match(/tpl=(\d+)/), pm=h.match(/pal=([^&]+)/);
  if(m){
    E.Tpl.loadBrand(clamp(+m[1],0,E.Tpl.brand.length-1));
    if(pm&&PALETAS[decodeURIComponent(pm[1])])E.Pal.apply(decodeURIComponent(pm[1]),true);
  } else {
    /* La sesión guardada se captura ANTES de cargar la plantilla (el autoguardado
       la sobrescribe); se ofrece recuperar con un banner NO bloqueante — antes era
       un confirm() nativo que congelaba la carga hasta responder. */
    let sess=null; try{sess=JSON.parse(E.Store.get("identidad_editor_session_v1"));}catch(_){}
    /* Arranque: continuar la ÚLTIMA edición; si no hay, predeterminada (⭐) como
       edición nueva; si tampoco, la 1.ª plantilla (que crea su propia edición). */
    const _curId=E.Store.get("identidad_editor_edicion_actual_v1");
    const _ed=_curId && E.Ediciones.lista().find(e=>e.id===_curId);
    if(_ed){
      E.Ediciones.abrir(_curId);
      setTimeout(()=>toast("Continuaste: "+_ed.nombre+" — pestaña «Mis ediciones» para cambiar"),450);
    } else if(E.Tpl.loadDefault()){
      E.Ediciones.nueva("Edición · "+new Date().toLocaleDateString("es-PE"));
      setTimeout(()=>toast("⭐ Se abrió tu predeterminada como nueva edición"),450);
    } else {
      E.Tpl.loadBrand(0);   // 1.ª plantilla → crea su edición (vía wrap)
    }
  }
  E.Ediciones.pintarPaginas();
  E.View.fit(); E.Props.refresh();
  E.arrancado=true; if(E.Avz)E.Avz.alArrancar();   // pantalla de inicio (si editor-avanzado.js ya cargó; si no, la abre él)
})();
toast("Editor de piezas listo — 27 plantillas · combinaciones de color · banco de fotos");
</script>
