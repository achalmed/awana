<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudio · Editor de piezas</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,600;0,800;0,900;1,600&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estudio-tema.css"><!-- tema único del estudio: tokens --est-* y componentes .est-* -->
<link rel="stylesheet" href="editor-avanzado.css"><!-- inicio, elementos, marca, recorte, páginas, tamaño mágico (editor-avanzado.js) -->
<script src="estudio-iconos.js"></script><!-- juego único de íconos de la interfaz: icono("nombre") -->
<script src="estudio-movil.js" defer></script><!-- teléfono: paneles en cajones, cabecera deslizable -->
<script src="imgbank.js"></script><!-- banco de fotos del despacho (opcional; si falta, el panel se oculta) -->
<style>
/* ============================================================
   EDITOR DE PIEZAS v1 — arquitectura modular (ver cabecera del JS)
   Interfaz oscura de grafito (estudio-tema.css); los COLORES DE MARCA solo en el lienzo.
   ============================================================ */
:root{
  /* tokens-color:inicio — GENERADO por adaptadores/generar.py desde tokens/colors.json; no editar: se regenera */
  /* ---- COLOR · escala Puka (rojo cochinilla) ---- */
  --puka-50:#FBEDEF; --puka-100:#F6D8DC; --puka-200:#EFB0B9; --puka-300:#E58292;
  --puka-400:#D9506A; --puka-500:#C42B49; --puka-600:#A6122E; --puka-700:#8A0F27;
  --puka-800:#6E0F22; --puka-900:#4E0A18;

  /* ---- COLOR · escala Q'illu (amarillo maíz) ---- */
  --qillu-50:#FDF6E3; --qillu-100:#FAECC4; --qillu-200:#F5DE97; --qillu-300:#F0CB5B;
  --qillu-400:#EAB61E; --qillu-500:#C99614; --qillu-600:#A67B10; --qillu-700:#83600D;
  --qillu-800:#5F450B; --qillu-900:#3E2D08;

  /* ---- COLOR · neutros cálidos ---- */
  --neutral-100:#F5F1EC; --neutral-200:#E9E2D9; --neutral-300:#DCD2C6; --neutral-400:#C9BFB4;
  --neutral-500:#A99E92; --neutral-600:#8A8079; --neutral-700:#6E655D; --neutral-800:#524B45;
  --neutral-900:#241F1C;

  /* ---- COLOR · fondos ---- */
  --fondo-papel:#F5F1EC; --fondo-blanco:#FFFFFF; --fondo-vino:#6E0F22; --fondo-tinta:#241F1C;

  /* ---- COLOR · funcionales (NO marca; siempre con ícono y texto) ---- */
  --func-exito:#2E7D32; --func-aviso:#EAB61E; --func-error:#A6122E; --func-info-data-only:#4A5A66;

  /* ---- COLOR · datos: serie categórica, en orden (gráficos; etiqueta directa) ---- */
  --datos-1:#A6122E; --datos-2:#A67B10; --datos-3:#002E6C; --datos-4:#22949F;
  --datos-5:#8176F1; --datos-6:#636363;

  /* ---- COLOR · datos: divergente ---- */
  --datos-div-1:#A6122E; --datos-div-2:#F5F1EC; --datos-div-3:#241F1C;

  /* ---- COLOR · excepcionales (NO marca: alertas, campañas; ver colors.json) ---- */
  --exc-rojo-vivo:#E30613; --exc-rojo-vivo-profundo:#8E0510; --exc-rojo-vivo-suave:#C10510; --exc-rosa-vivo:#FFCED2;
  --exc-rojo-puro:#FF0000; --exc-rojo-puro-suave:#D60000; --exc-rosa-puro:#FFD6D6; --exc-rosa-claro:#FFE8EA;
  --exc-crema:#FFF6D6; --exc-oro-vivo:#FFC400; --exc-negro:#000000; --exc-tinta-luto:#3A322D;
  --exc-tinta-profunda:#1A1614;

  /* ---- COLOR · interfaz del estudio: grafito (cromo de las herramientas, NO de las piezas) ---- */
  --grafito-950:#111214; --grafito-900:#16171A; --grafito-850:#1B1C1F; --grafito-800:#212226;
  --grafito-750:#27292D; --grafito-700:#2E3035; --grafito-650:#373A40; --grafito-600:#44474E;
  --grafito-500:#5C6069; --grafito-400:#8E939B; --grafito-300:#A9ADB5; --grafito-200:#CBCED4;
  --grafito-100:#E6E8EB;

  /* ---- COLOR · interfaz del estudio: estados sobre grafito ---- */
  --interfaz-seleccion:#4A90E2; --interfaz-exito:#5DB37E;
  /* tokens-color:fin */
}
/* Cromo: estudio-tema.css (tokens --est-* y componentes .est-*). Aquí solo la DISTRIBUCIÓN de este editor y sus
   piezas propias; ningún color escrito a mano (docs/decisiones.md §2.6). */
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{overflow:hidden; user-select:none;}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer;}
input[type=color]{width:34px; height:28px;}

/* ---- distribución: cabecera · (riel | panel izq. | lienzo | panel der.) · estado ---- */
#app{display:grid; grid-template-rows:var(--est-alto-cabecera) 1fr var(--est-alto-estado); height:100%;}
#main{display:grid; grid-template-columns:var(--est-ancho-riel) var(--est-ancho-panel-izq) 1fr var(--est-ancho-panel-der); min-height:0;}
#leftpanel{background:var(--est-sup-2); border-right:1px solid var(--est-borde); overflow-y:auto; padding:var(--est-esp-3);}
#stage{position:relative; overflow:hidden; background:var(--est-sup-0);}
#rightpanel{background:var(--est-sup-2); border-left:1px solid var(--est-borde); display:flex; flex-direction:column; min-height:0;}
#docsize{max-width:210px; height:var(--est-alto-control);}
@media (max-width:760px){ #main{grid-template-columns:var(--est-ancho-riel) 1fr;} #docsize{max-width:140px;} }
#btn-grid.on{color:var(--est-texto);}

/* ---- paneles ---- */
.p-title{font:var(--est-peso-fuerte) var(--est-fs-xs)/1.2 var(--est-fuente); letter-spacing:.06em; text-transform:uppercase;
  color:var(--est-texto-3); margin:2px 0 var(--est-esp-2);}
.p-sec{margin-bottom:var(--est-esp-4);}
.p-grid{display:grid; grid-template-columns:1fr 1fr; gap:var(--est-esp-2);}
.p-btn{background:var(--est-sup-4); border:1px solid var(--est-borde-control); border-radius:var(--est-radio);
  padding:9px 8px; text-align:center; color:var(--est-texto); font-size:var(--est-fs-sm);}
.p-btn:hover{border-color:var(--est-borde-fuerte); background:var(--est-sup-hover);}
.tpl-card{background:var(--est-sup-3); border:1px solid var(--est-borde); border-radius:var(--est-radio);
  padding:8px; margin-bottom:6px; cursor:pointer; display:flex; gap:10px; align-items:center;}
.tpl-card:hover{border-color:var(--est-borde-fuerte); background:var(--est-sup-4);}
.tpl-thumb{width:44px; height:44px; border-radius:var(--est-radio-sm); flex:none; display:grid; place-items:center;
  font:900 10px Archivo; color:var(--est-texto-sobre-acento);}
.tpl-card small{color:var(--est-texto-3); display:block;}
.tpl-mini{display:flex; gap:4px; margin-top:6px;}
.tpl-mini button{font-size:var(--est-fs-xs); color:var(--est-texto-3); padding:2px 6px; border:1px solid var(--est-borde-control);
  border-radius:var(--est-radio-sm);}
.tpl-mini button:hover{color:var(--est-texto); border-color:var(--est-borde-fuerte);}
.icon-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:6px;}
.icon-cell{aspect-ratio:1; background:var(--est-sup-4); border:1px solid var(--est-borde-control);
  border-radius:var(--est-radio); display:grid; place-items:center;}
.icon-cell:hover{border-color:var(--est-borde-fuerte); background:var(--est-sup-hover);}
.icon-cell svg{width:22px; height:22px; stroke:var(--est-texto); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
.icon-cell.sel{outline:2px solid var(--est-acento-linea); outline-offset:-2px;}
.chips{display:flex; flex-wrap:wrap; gap:6px;}
.chip{width:24px; height:24px; border-radius:var(--est-radio-sm); border:1px solid var(--est-borde-fuerte); cursor:pointer;}
.chip:hover{outline:2px solid var(--est-texto-2); outline-offset:1px;}
.note{font-size:var(--est-fs-xs); color:var(--est-texto-3); line-height:1.5;}
.warn{color:var(--est-aviso);}

/* ---- panel derecho ---- */
.rtabs{display:flex; gap:var(--est-esp-1); padding:0 var(--est-esp-2); border-bottom:1px solid var(--est-borde); flex:none;}
.rtab{position:relative; flex:1; padding:12px 0 11px; text-align:center; color:var(--est-texto-3);
  font-weight:var(--est-peso-fuerte); font-size:var(--est-fs-sm);}
.rtab:hover{color:var(--est-texto);}
.rtab.on{color:var(--est-texto);}
.rtab.on::after{content:""; position:absolute; left:10px; right:10px; bottom:-1px; height:2px; border-radius:2px 2px 0 0;
  background:var(--est-acento-linea);}
#rbody{flex:1; overflow-y:auto; padding:var(--est-esp-3);}
.f-row{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
.f-row label{width:70px; flex:none; color:var(--est-texto-3); font-size:var(--est-fs-sm);}
.f-row input[type=number]{width:64px;}
.f-row input[type=text]{flex:1; min-width:0;}
.f-row select{flex:1; min-width:0;}
.f-mini{display:grid; grid-template-columns:repeat(4,1fr); gap:4px; margin-bottom:8px;}
.mini-btn{background:var(--est-sup-4); border:1px solid var(--est-borde-control); border-radius:var(--est-radio);
  padding:5px 0; text-align:center; font-size:var(--est-fs-sm); color:var(--est-texto-2);}
.mini-btn:hover{border-color:var(--est-borde-fuerte); color:var(--est-texto);}
.mini-btn.on{background:var(--est-acento-suave); border-color:var(--est-acento-linea); color:var(--est-texto);}
.sw-btn{width:34px; height:26px; border-radius:var(--est-radio-sm); border:1px solid var(--est-borde-fuerte); cursor:pointer;}
.layer{display:flex; align-items:center; gap:6px; padding:5px 8px; border-radius:var(--est-radio-sm); cursor:pointer;}
.layer:hover{background:var(--est-sup-hover);}
.layer.sel{background:var(--est-acento-suave); box-shadow:inset 2px 0 0 var(--est-acento-linea);}
.layer .lname{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.layer .lbtn{display:grid; place-items:center; width:20px; height:20px; border-radius:var(--est-radio-sm); color:var(--est-texto-off);}
.layer .lbtn:hover{color:var(--est-texto); background:var(--est-sup-activo);}
.layer .lbtn.on{color:var(--est-aviso);}
.layer:not(:hover):not(.sel) .lbtn[data-l=up],.layer:not(:hover):not(.sel) .lbtn[data-l=down]{visibility:hidden;}
.layer .ltype{color:var(--est-texto-3); font-size:10px; width:14px; text-align:center;}
.hist-item{padding:5px 8px; border-radius:var(--est-radio-sm); color:var(--est-texto-3); cursor:pointer; font-size:var(--est-fs-sm);}
.hist-item:hover{background:var(--est-sup-hover); color:var(--est-texto-2);}
.hist-item.cur{color:var(--est-texto); background:var(--est-sup-4); box-shadow:inset 2px 0 0 var(--est-acento-linea);}

/* ---- escenario y lienzo ---- */
#rulerX,#rulerY{position:absolute; background:var(--est-sup-2); z-index:20; color:var(--est-texto-3); overflow:hidden;}
#rulerX{left:24px; right:0; width:calc(100% - 24px); top:0; height:24px; border-bottom:1px solid var(--est-borde); cursor:copy;}
#rulerY{top:24px; bottom:0; height:calc(100% - 24px); left:0; width:24px; border-right:1px solid var(--est-borde); cursor:copy;}
#corner{position:absolute; left:0; top:0; width:24px; height:24px; background:var(--est-sup-2); z-index:21;
  border-right:1px solid var(--est-borde); border-bottom:1px solid var(--est-borde);}
#viewport{position:absolute; inset:24px 0 0 24px; overflow:hidden; cursor:default;}
#world{position:absolute; left:0; top:0; transform-origin:0 0;}
#artboard{position:absolute; box-shadow:var(--est-sombra-lienzo);}
#gridlayer,#ovl{position:absolute; inset:0;}
.tagchip{background:var(--est-sup-4); border:1px solid var(--est-borde-control); color:var(--est-texto-2);
  border-radius:var(--est-radio-redondo); padding:3px 10px; cursor:pointer; font:var(--est-peso-medio) var(--est-fs-xs) var(--est-fuente); white-space:nowrap}
.tagchip:hover{color:var(--est-texto); border-color:var(--est-borde-fuerte)}
.tagchip.on{background:var(--est-acento); border-color:transparent; color:var(--est-texto-sobre-acento)}
.banco-sep{display:flex; align-items:center; gap:8px; margin:12px 0 3px; min-width:0}
.banco-sep .sep-linea{flex:1; height:1px; background:var(--est-borde-control)}
.banco-sep .sep-nom{font:var(--est-peso-fuerte) var(--est-fs-xs) var(--est-fuente); color:var(--est-texto-2); white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; max-width:60%}
.banco-sep .sep-cnt{font:var(--est-peso-fuerte) 10px var(--est-fuente); color:var(--est-texto-3); background:var(--est-sup-4);
  border-radius:var(--est-radio-redondo); padding:1px 7px; flex:none}
.banco-sep .sep-sel{font:var(--est-peso-fuerte) 10px var(--est-fuente); cursor:pointer; background:var(--est-sup-4);
  border:1px solid var(--est-borde-control); color:var(--est-texto-2); border-radius:var(--est-radio-redondo); padding:2px 8px; flex:none}
.banco-sep .sep-sel:hover{color:var(--est-texto); border-color:var(--est-borde-fuerte)}
.banco-sep .sep-sel.on{background:var(--est-acento); border-color:transparent; color:var(--est-texto-sobre-acento)}
#pagesbar{position:fixed; bottom:calc(var(--est-alto-estado) + 14px); left:calc(50% + 40px); transform:translateX(-50%); z-index:80;
  display:flex; align-items:center; gap:4px; background:var(--est-sup-3); border:1px solid var(--est-borde-control);
  border-radius:var(--est-radio); padding:5px 8px; box-shadow:var(--est-sombra-menu); max-width:70vw; overflow-x:auto}
#pagesbar .pg-nom{font:var(--est-peso-fuerte) var(--est-fs-sm) var(--est-fuente); color:var(--est-texto); cursor:pointer;
  white-space:nowrap; max-width:220px; overflow:hidden; text-overflow:ellipsis; flex:none; padding:0 4px}
#pagesbar .pg-sep{width:1px; height:18px; background:var(--est-borde-control); flex:none}
#pagesbar .pg-btn{min-width:26px; height:26px; border-radius:var(--est-radio-sm); border:1px solid var(--est-borde-control);
  background:var(--est-sup-4); color:var(--est-texto-2); cursor:pointer; font:var(--est-peso-fuerte) var(--est-fs-sm) var(--est-fuente);
  font-variant-numeric:tabular-nums; flex:none}
#pagesbar .pg-btn.on{background:var(--est-acento); border-color:transparent; color:var(--est-texto-sobre-acento)}
#pagesbar .pg-ic{width:26px; height:26px; border-radius:var(--est-radio-sm); border:1px solid var(--est-borde-control);
  background:var(--est-sup-4); color:var(--est-texto-2); cursor:pointer; font-size:var(--est-fs-base); flex:none}
#pagesbar .pg-ic:hover,#pagesbar .pg-btn:hover{background:var(--est-sup-hover); color:var(--est-texto)}
#dz-reemplazo{position:fixed; z-index:220; border:2px solid var(--est-aviso); border-radius:var(--est-radio);
  background:var(--est-aviso-suave); display:none; place-items:center; pointer-events:none}
#dz-reemplazo.on{display:grid; pointer-events:auto}
#dz-reemplazo .rz-lbl{background:var(--est-sup-3); color:var(--est-texto); border:1px solid var(--est-aviso);
  font:var(--est-peso-fuerte) var(--est-fs-base) var(--est-fuente); padding:7px 13px; border-radius:var(--est-radio);
  pointer-events:none; box-shadow:var(--est-sombra-menu)}
.selmark{position:absolute; top:4px; right:4px; width:20px; height:20px; border-radius:50%;
  background:var(--est-acento); color:var(--est-texto-sobre-acento); font:700 12px var(--est-fuente); display:grid; place-items:center;
  box-shadow:0 0 0 2px var(--est-sup-2)}
#lote-overlay{position:fixed; inset:0; z-index:300; background:color-mix(in srgb,var(--grafito-950) 80%,transparent);
  display:grid; place-items:center; padding:20px}
#lote-panel{background:var(--est-sup-2); border:1px solid var(--est-borde-control); border-radius:var(--est-radio);
  width:min(1080px,96vw); max-height:92vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:var(--est-sombra-modal)}
#lote-top{display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid var(--est-borde)}
#lote-ctrls{display:flex; flex-wrap:wrap; gap:10px 16px; padding:10px 14px; border-bottom:1px solid var(--est-borde); background:var(--est-sup-1)}
#lote-ctrls label{font:var(--est-peso-fuerte) var(--est-fs-xs) var(--est-fuente); color:var(--est-texto-3); display:flex; flex-direction:column; gap:3px}
#lote-ctrls select,#lote-ctrls input{font:inherit}
#lote-ctrls input[type=range]{width:120px}
#lote-cuerpo{overflow:auto; padding:14px; display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px}
.lote-cel{cursor:pointer; border-radius:var(--est-radio); overflow:hidden; border:2px solid transparent; background:var(--est-sup-0)}
.lote-cel.on{border-color:var(--est-acento-linea)}
.lote-thumb{width:100%; background:var(--est-sup-0) center/cover no-repeat; aspect-ratio:1}
.lote-cap{font:var(--est-fs-xs) var(--est-fuente); color:var(--est-texto-2); padding:5px 7px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.lote-badge{font:var(--est-peso-fuerte) var(--est-fs-xs) var(--est-fuente); color:var(--est-texto); background:var(--est-aviso-suave);
  border:1px solid var(--est-aviso); padding:2px 9px; border-radius:var(--est-radio-redondo)}
.lb{background:var(--est-sup-4); border:1px solid var(--est-borde-control); color:var(--est-texto); border-radius:var(--est-radio);
  padding:6px 12px; cursor:pointer; font:var(--est-peso-medio) var(--est-fs-base) var(--est-fuente)}
.lb.prim{background:var(--est-acento); border-color:transparent; color:var(--est-texto-sobre-acento); font-weight:var(--est-peso-fuerte)}
.lb:hover{background:var(--est-sup-hover)} .lb.prim:hover{background:var(--est-acento-hover)}
/* El contenido se RECORTA al lienzo (como Canva): nada sobresale del artboard en
   la vista; los acentos que sangran (esquinas, ondas…) quedan limpios. Los tiradores
   de selección viven en #ovl (hermano), así que no se recortan. */
#objlayer{position:absolute; inset:0; overflow:hidden;}
#gridlayer{pointer-events:none; background-size:var(--gs) var(--gs);
  background-image:linear-gradient(to right,color-mix(in srgb,var(--exc-negro) 10%,transparent) 1px,transparent 1px),
                   linear-gradient(to bottom,color-mix(in srgb,var(--exc-negro) 10%,transparent) 1px,transparent 1px);}
.obj{position:absolute; touch-action:none;}
.obj.locked{pointer-events:none;}
/* el <svg> de formas e íconos es un bloque: en línea, una caja de pocos px de alto lo bajaba
   hasta la línea base del texto (un filete de 4 px se veía ~10 px más abajo que en la exportación) */
.obj>svg{display:block;}
.obj .txt{white-space:pre-wrap; word-wrap:break-word; width:100%;}
.obj img{width:100%; height:100%; display:block; pointer-events:none;}
#ovl{pointer-events:none; z-index:30;}
/* --- arrastrar y soltar: zonas "imagen" / "fondo" --- */
#dropzones{position:absolute; inset:0; z-index:40; display:none; gap:16px; padding:16px;
  background:color-mix(in srgb,var(--grafito-950) 60%,transparent);}
#dropzones.on{display:flex;}
.dz-zona{flex:1; border:2px dashed var(--est-borde-fuerte); border-radius:var(--est-radio); display:grid; place-items:center;
  text-align:center; color:var(--est-texto); font:var(--est-peso-fuerte) var(--est-fs-lg) var(--est-fuente);
  background:color-mix(in srgb,var(--est-sup-2) 70%,transparent); transition:border-color .12s,background .12s;}
.dz-zona *{pointer-events:none;} /* evita parpadeo de dragleave al cruzar los hijos */
.dz-zona .dz-ico{font-size:34px; display:block; margin-bottom:10px;}
.dz-zona small{display:block; font-weight:400; font-size:var(--est-fs-sm); color:var(--est-texto-2); margin-top:8px;}
.dz-zona.on{border-color:var(--est-aviso); background:var(--est-aviso-suave);}
.selbox{position:absolute; border:1.5px solid var(--est-seleccion); pointer-events:none;}
.selbox.gbox{border:1.5px dashed var(--est-seleccion);}
.hnd{position:absolute; width:10px; height:10px; background:var(--fondo-blanco); border:1.5px solid var(--est-seleccion);
  border-radius:2px; pointer-events:all;}
.hnd.rot{border-radius:50%; cursor:grab;}
.sguide{position:absolute; background:var(--est-acento-linea); pointer-events:none;}
.uguide{position:absolute; background:var(--est-seleccion); z-index:29;}
.uguide.v{width:1px; top:0; bottom:0; cursor:ew-resize;}
.uguide.h{height:1px; left:0; right:0; cursor:ns-resize;}
#marquee{position:absolute; border:1px dashed var(--est-seleccion); background:var(--est-seleccion-suave);

/* ╔══════════════════════════════════════════════════════════════╗

"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

const deep=o=>JSON.parse(JSON.stringify(o));

/* ---------- TOKENS DE MARCA: tokens/colors.json, por el bloque generado ---------- */
/* tokens:inicio — GENERADO por adaptadores/generar.py desde tokens/colors.json; no editar: se regenera */
const TOKENS_COLOR={"puka":{"50":"#FBEDEF","100":"#F6D8DC","200":"#EFB0B9","300":"#E58292","400":"#D9506A","500":"#C42B49","600":"#A6122E","700":"#8A0F27","800":"#6E0F22","900":"#4E0A18"},"qillu":{"50":"#FDF6E3","100":"#FAECC4","200":"#F5DE97","300":"#F0CB5B","400":"#EAB61E","500":"#C99614","600":"#A67B10","700":"#83600D","800":"#5F450B","900":"#3E2D08"},"neutral":{"100":"#F5F1EC","200":"#E9E2D9","300":"#DCD2C6","400":"#C9BFB4","500":"#A99E92","600":"#8A8079","700":"#6E655D","800":"#524B45","900":"#241F1C"},"fondos":{"papel":"#F5F1EC","blanco":"#FFFFFF","vino":"#6E0F22","tinta":"#241F1C"},"excepcionales":{"rojo_vivo":"#E30613","rojo_vivo_profundo":"#8E0510","rojo_vivo_suave":"#C10510","rosa_vivo":"#FFCED2","rojo_puro":"#FF0000","rojo_puro_suave":"#D60000","rosa_puro":"#FFD6D6","rosa_claro":"#FFE8EA","crema":"#FFF6D6","oro_vivo":"#FFC400","negro":"#000000","tinta_luto":"#3A322D","tinta_profunda":"#1A1614"}};
/* tokens:fin */
/* T("puka.600") → HEX y TA("neutral.900",".3") → rgba(): toda pieza toma sus colores de aquí.
   El bloque de arriba lo regenera «adaptadores/generar.py actualizar» al cambiar un token. */
const T=ref=>{ const [g,k]=String(ref).split("."), v=(TOKENS_COLOR[g]||{})[k];
  if(!v)throw new Error("token de color desconocido: "+ref); return v; };
const TA=(ref,a)=>{ const x=T(ref);   /* a: la opacidad como texto («.35»), tal cual se escribe */
  return `rgba(${parseInt(x.slice(1,3),16)},${parseInt(x.slice(3,5),16)},${parseInt(x.slice(5,7),16)},${a})`; };
const BRAND={puka:TOKENS_COLOR.puka, qillu:TOKENS_COLOR.qillu, neutro:TOKENS_COLOR.neutral,
  extra:{blanco:T("fondos.blanco"), vivo:T("excepcionales.rojo_vivo"), oro:T("excepcionales.oro_vivo")}};
const MODOS={Papel:T("neutral.100"),Blanco:T("fondos.blanco"),Rojo:T("puka.600"),Vino:T("puka.800"),Amarillo:T("qillu.400"),Tinta:T("neutral.900")};
/* ---- COMBINACIONES DINÁMICAS (paletas por roles) ----
   Roles: bg (fondo) · deep (fondo profundo) · brandA (color protagonista)
   · text · muted · ctaText (texto sobre brandA) · soft (relleno suave).
   Toda plantilla se construye con estos roles → cambiar de paleta recolorea la pieza. */
const PALETAS={
 "Rojo oficial":  {bg:T("puka.600"),deep:T("puka.800"),brandA:T("qillu.400"),text:T("neutral.100"),muted:T("puka.100"),ctaText:T("neutral.900"),soft:T("puka.700")},
 "Papel":         {bg:T("neutral.100"),deep:T("fondos.blanco"),brandA:T("puka.600"),text:T("neutral.900"),muted:T("neutral.600"),ctaText:T("neutral.100"),soft:T("neutral.300")},
 "Blanco":        {bg:T("fondos.blanco"),deep:T("neutral.100"),brandA:T("puka.600"),text:T("neutral.900"),muted:T("neutral.600"),ctaText:T("fondos.blanco"),soft:T("neutral.200")},
 "Tinta":         {bg:T("neutral.900"),deep:T("excepcionales.negro"),brandA:T("qillu.400"),text:T("neutral.100"),muted:T("neutral.500"),ctaText:T("neutral.900"),soft:T("neutral.800")},
 "Vino":          {bg:T("puka.800"),deep:T("puka.900"),brandA:T("qillu.400"),text:T("neutral.100"),muted:T("puka.200"),ctaText:T("neutral.900"),soft:T("puka.700")},
 "Amarillo aviso":{bg:T("qillu.400"),deep:T("qillu.500"),brandA:T("puka.800"),text:T("neutral.900"),muted:T("qillu.700"),ctaText:T("qillu.50"),soft:T("qillu.300")},
 "Luto (gris)":   {bg:T("neutral.900"),deep:T("excepcionales.negro"),brandA:T("neutral.500"),text:T("neutral.100"),muted:T("neutral.600"),ctaText:T("neutral.900"),soft:T("neutral.800")},
 "Vívida roja":   {bg:T("excepcionales.rojo_vivo"),deep:T("excepcionales.rojo_vivo_profundo"),brandA:T("excepcionales.oro_vivo"),text:T("fondos.blanco"),muted:T("excepcionales.rosa_vivo"),ctaText:T("neutral.900"),soft:T("excepcionales.rojo_vivo_suave")},
 "Vívida pura":   {bg:T("excepcionales.rojo_puro"),deep:T("excepcionales.rojo_vivo_profundo"),brandA:T("excepcionales.oro_vivo"),text:T("fondos.blanco"),muted:T("excepcionales.rosa_puro"),ctaText:T("neutral.900"),soft:T("excepcionales.rojo_puro_suave")},
 "Vívida clara":  {bg:T("fondos.blanco"),deep:T("excepcionales.crema"),brandA:T("excepcionales.rojo_vivo"),text:T("neutral.900"),muted:T("neutral.600"),ctaText:T("fondos.blanco"),soft:T("excepcionales.rosa_claro")},
};
/* ====== FAMILIAS CROMÁTICAS (variaciones tipo Canva) ======
   Cada paleta es una identidad con VARIAS combinaciones. Un clic aplica;
   volver a hacer clic en la paleta activa ROTA entre sus variaciones. Cada
   variante es [fondo, acento] de la familia; el resto de roles se DERIVA por
   contraste (texto/CTA legibles siempre), así se mantiene la armonía. */
const _C={ROJO:T("puka.600"),VINO:T("puka.800"),VINOX:T("puka.900"),ORO:T("qillu.400"),OROX:T("qillu.500"),
  PAPEL:T("neutral.100"),BLANCO:T("fondos.blanco"),TINTA:T("neutral.900"),GRIS:T("neutral.500"),RVIVO:T("excepcionales.rojo_vivo"),
  RPURO:T("excepcionales.rojo_puro"),OVIVO:T("excepcionales.oro_vivo"),CREMA:T("excepcionales.crema"),ROSA:T("puka.200")};
const FAMILIAS={
 "Rojo oficial":{aviso:false,vars:[[_C.ROJO,_C.ORO],[_C.VINO,_C.ORO],[_C.TINTA,_C.ORO],[_C.ROJO,_C.PAPEL]]},
 "Papel":{aviso:false,vars:[[_C.PAPEL,_C.ROJO],[_C.PAPEL,_C.VINO],[_C.BLANCO,_C.ROJO],[_C.PAPEL,_C.TINTA]]},
 "Blanco":{aviso:false,vars:[[_C.BLANCO,_C.ROJO],[_C.BLANCO,_C.VINO],[_C.PAPEL,_C.ROJO],[_C.BLANCO,_C.TINTA]]},
 "Tinta":{aviso:false,vars:[[_C.TINTA,_C.ORO],[_C.TINTA,_C.RVIVO],[_C.TINTA,_C.PAPEL],[_C.VINOX,_C.ORO]]},
 "Vino":{aviso:false,vars:[[_C.VINO,_C.ORO],[_C.VINOX,_C.ORO],[_C.VINO,_C.PAPEL],[_C.VINO,_C.ROSA]]},
 "Amarillo aviso":{aviso:true,vars:[[_C.ORO,_C.VINO],[_C.ORO,_C.ROJO],[_C.ORO,_C.TINTA],[_C.OROX,_C.VINO]]},
 "Luto (gris)":{aviso:false,vars:[[_C.TINTA,_C.GRIS],[_C.TINTA,_C.PAPEL],[T("excepcionales.tinta_luto"),_C.GRIS]]},
 "Vívida roja":{aviso:true,vars:[[_C.RVIVO,_C.OVIVO],[T("excepcionales.rojo_vivo_profundo"),_C.OVIVO],[_C.RVIVO,_C.BLANCO],[_C.TINTA,_C.RVIVO]]},
 "Vívida pura":{aviso:true,vars:[[_C.RPURO,_C.OVIVO],[T("excepcionales.rojo_puro_suave"),_C.OVIVO],[_C.RPURO,_C.BLANCO]]},
 "Vívida clara":{aviso:true,vars:[[_C.BLANCO,_C.RVIVO],[_C.CREMA,_C.RVIVO],[_C.BLANCO,_C.OVIVO]]},
};
function _rgb(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function _hx(r,g,b){return'#'+[r,g,b].map(x=>Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,'0')).join('').toUpperCase();}
function _lum(h){const c=_rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);});return .2126*c[0]+.7152*c[1]+.0722*c[2];}
function _mix(a,b,t){const A=_rgb(a),B=_rgb(b);return _hx(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t);}
function _contra(a,b){const x=_lum(a),y=_lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05);}
/* texto legible sobre 'fondo': elige papel o tinta según el MÁXIMO contraste */
function _sobre(fondo){const claro=T("neutral.100"),oscuro=T("neutral.900");return _contra(claro,fondo)>=_contra(oscuro,fondo)?claro:oscuro;}
/* deriva los 7 roles desde [fondo, acento], con contraste garantizado */
function derivarRoles(bg,ac){
  const osc=_lum(bg)<0.5;
  const text=_sobre(bg);
  const deep=osc?_mix(bg,T("excepcionales.negro"),0.34):_mix(bg,T("excepcionales.negro"),0.05);
  const soft=osc?_mix(bg,T("fondos.blanco"),0.13):_mix(bg,T("excepcionales.negro"),0.09);
  const muted=_mix(text,bg,0.40);
  const ctaText=_sobre(ac);
  return{bg,deep,brandA:ac,text,muted,ctaText,soft};
}
const FONTS=["Archivo","Source Sans 3","Inter","Atkinson Hyperlegible","Arial"];
/* ====== MARCADORES DEL PERFIL: {{titular}}, {{cargo}}, {{region}}, {{sede}}… ======
   Las plantillas nativas no llevan nombres ni lugares de un cliente: llevan marcadores que se llenan al crear
   el texto con marca.textos de /api/design (perfil.json: titular, region, sede, institucion… o su bloque
   «textos»); sin servidor o sin perfil, textos neutros (los mismos de servidor.py → TEXTOS_NEUTROS). */
const TEXTOS_NEUTROS={titular:"Nombre Apellido",cargo:"Cargo o circunscripción",organizacion:"Nombre del despacho",
  region:"Región",sede:"Ciudad",lugar:"Lugar del evento",lema:"Lema del despacho",institucion:"Institución",
  entidad:"Entidad u organismo",correo:"correo@institucion.gob",web:"www.institucion.gob"};
const TEXTOS_PERFIL={...TEXTOS_NEUTROS};
function rellenarMarcadores(t){ return typeof t!=="string"?t:t.replace(/\{\{(\w+)\}\}/g,(m,k)=>TEXTOS_PERFIL[k]??m); }
async function cargarTextosPerfil(){
  if(!/^https?:$/.test(location.protocol))return;
  try{ const r=await fetch("api/design",{cache:"no-store"}); if(!r.ok)return;
    const d=await r.json(); Object.assign(TEXTOS_PERFIL,(d.marca&&d.marca.textos)||{}); }catch(_){}
}
/* ====== TEXTO EN ARCO: o.arco={on, radio, angulo} ======
   El texto (una línea) apoya su línea base en una circunferencia de radio |radio| px: radio > 0 lo curva hacia
   arriba (arco, centro debajo), radio < 0 hacia abajo (sonrisa, centro encima). `angulo` (grados) lo corre a
   lo largo del arco. UNA geometría para las tres salidas: el lienzo y el SVG editable usan <textPath> sobre la
   circunferencia (cada glifo, por su centro, sobre su distancia en el trazado); PNG/JPG/PDF pintan glifo por
   glifo con las mismas posiciones. La caja mide el ancho del objeto y el alto que ocupa el arco. */
const Arco=(()=>{
  const cv=document.createElement("canvas").getContext("2d");
  const activo=o=>!!(o&&o.type==="text"&&o.arco&&o.arco.on);
  const fuente=o=>`${o.italic?"italic ":""}${o.weight} ${o.size}px '${o.font}', sans-serif`;
  const texto=o=>{ const t=String(o.text||"").replace(/\s*\n\s*/g," "); return o.upper?t.toUpperCase():t; };
  function geo(o){
    cv.font=fuente(o); try{ cv.letterSpacing=(o.ls||0)+"px"; }catch(_){}
    const txt=texto(o), chars=[...txt], av=chars.map(c=>cv.measureText(c).width), L=av.reduce((a,b)=>a+b,0);
    const sentido=(+o.arco.radio||0)<0?-1:1;
    const r=Math.max(Math.abs(+o.arco.radio||300), L/(2*Math.PI)*1.02, o.size*0.6);
    const ang=(+o.arco.angulo||0)*Math.PI/180, mitad=Math.min(L/r/2,Math.PI);
    const asc=o.size*0.85, desc=o.size*0.3, cx=o.w/2;
    let cy,h;
    if(sentido>0){ cy=asc+r; h=cy-r*Math.cos(mitad)+(mitad>Math.PI/2?asc:desc); }
    else { cy=(mitad>Math.PI/2?desc:asc)-r*Math.cos(mitad); h=cy+r+desc; }
    h=Math.max(h,asc+desc);
    const glifos=[]; let p=0;
    chars.forEach((c,i)=>{
      const m=(p+av[i]/2-L/2)/r;
      const phi=sentido>0?(-Math.PI/2+ang+m):(Math.PI/2-ang-m);
      glifos.push({c,a:av[i],x:cx+r*Math.cos(phi),y:cy+r*Math.sin(phi),rot:sentido>0?phi+Math.PI/2:phi-Math.PI/2});
      p+=av[i];
    });
    // circunferencia como trazado: arriba empieza abajo y gira en sentido horario (la cima al 50 %);
    // abajo empieza arriba y gira en sentido antihorario (el fondo al 50 %)
    const f=v=>+v.toFixed(2);
    const d=sentido>0
      ?`M${f(cx)},${f(cy+r)} A${f(r)},${f(r)} 0 1 1 ${f(cx)},${f(cy-r)} A${f(r)},${f(r)} 0 1 1 ${f(cx)},${f(cy+r)}`

/* ============================ STATE ============================ */
const E={};

/* ============================ STORE (persistencia durable) ====================
   FUENTE DE VERDAD = el servidor local (archivos en disco, /api/almacen). El
   navegador (localStorage) es solo un ESPEJO para poder trabajar sin conexión.
   Reglas que cumplen lo que el despacho pidió:
   • Al arrancar, si el servidor responde, SU copia manda… salvo en claves con
     cambios locales sin sincronizar (marca "sucio"): esas ganan y se re-suben,
     para NO reemplazar lo nuevo por lo viejo.
   • Al guardar, se escribe el espejo local al instante y se envía al servidor.
   • Un guardado que no llega a ningún lugar permanente se AVISA en voz alta y se
     ofrece respaldo — nunca se hace pasar por guardado.
   La API imita a localStorage (get/set/remove con strings), así el resto del
   editor no cambia: cada módulo sigue haciendo JSON.parse(E.Store.get(clave)). */
E.Store=(()=>{
  const SRV="api/almacen", DIRTYK="identidad_store_pendiente_v1";
  /* claves conocidas del editor de publicaciones (para migrar el localStorage
     previo al almacén del servidor la primera vez). */
  const CLAVES=["identidad_editor_tpls_v1","identidad_editor_default_v1",
    "identidad_editor_ediciones_v1","identidad_editor_edicion_actual_v1",
    "identidad_editor_session_v1"];
  const mem=Object.create(null);            // espejo: clave -> string (JSON) o ausente
  const timers=Object.create(null);
  let servidor=false, avisado=false;

  const _lsGet=k=>{try{return localStorage.getItem(k);}catch(_){return null;}};
  const _lsSet=(k,v)=>{try{localStorage.setItem(k,v);return true;}catch(_){return false;}};
  const _lsDel=k=>{try{localStorage.removeItem(k);}catch(_){}};
  /* claves con escritura local aún no confirmada por el servidor (sobreviven al
     cierre: se guardan en el propio localStorage). */
  const _dirty=()=>{try{return new Set(JSON.parse(_lsGet(DIRTYK)||"[]"));}catch(_){return new Set();}};
  const _dirtyGuardar=s=>_lsSet(DIRTYK,JSON.stringify([...s]));
  const _marcar=k=>{const s=_dirty();s.add(k);_dirtyGuardar(s);};
  const _limpiar=k=>{const s=_dirty();if(s.delete(k))_dirtyGuardar(s);};
  /* string(localStorage) <-> dato estructurado(servidor). Un valor que NO es JSON
     (p. ej. el id de la edición actual) viaja verbatim, así round-trip es exacto. */
  const _aServidor=v=>{if(v==null)return null;try{return JSON.parse(v);}catch(_){return v;}};
  const _deServidor=d=> d==null?null:(typeof d==="string"?d:JSON.stringify(d));

  function get(k){ return (k in mem)?mem[k]:_lsGet(k); }

  function _enviar(claves){                 // {clave: string|null} -> POST /api/almacen
    const payload={}; for(const k in claves) payload[k]=_aServidor(claves[k]);
    return fetch(SRV,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({claves:payload})}).then(r=>r.ok?r.json():Promise.reject(r.status));
  }
  function _programar(k){                    // envío al servidor con pequeño debounce + 1 reintento
    clearTimeout(timers[k]);
    timers[k]=setTimeout(()=>{ const val=(k in mem)?mem[k]:null;
      _enviar({[k]:val}).then(()=>_limpiar(k))
        .catch(()=>_enviar({[k]:val}).then(()=>_limpiar(k)).catch(()=>_avisar(false)));
    },300);
  }
  function set(k,v){                         // v: string (JSON) — misma semántica que localStorage
    mem[k]=v; const okLocal=_lsSet(k,v);
    if(servidor){ _marcar(k); _programar(k); return true; }
    if(!okLocal){ _avisar(true); return false; }   // sin servidor y sin espacio: grave, avisar
    return true;
  }
  function remove(k){
    delete mem[k]; _lsDel(k); _limpiar(k);
    if(servidor) fetch(SRV,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({clave:k,borrar:true})}).catch(()=>{});
  }
  async function boot(){                     // lee el estado durable ANTES de abrir nada
    let claves=null;
    try{ const r=await fetch(SRV,{cache:"no-store"});
      if(r.ok){const j=await r.json(); if(j&&j.ok){servidor=true;claves=j.claves||{};}} }
    catch(_){ servidor=false; }
    if(servidor){
      const dirty=_dirty();
      for(const k in claves){ if(dirty.has(k))continue;   // dirty = lo local gana (abajo)
        const s=_deServidor(claves[k]);
        if(s==null){delete mem[k];_lsDel(k);continue;}
        mem[k]=s; _lsSet(k,s); }
      /* claves locales sin sincronizar (dirty) o que el servidor aún no tiene:
         MIGRAR/re-subir para no perder trabajo previo ni ediciones offline. */
      const reenviar={};
      for(const k of new Set([...CLAVES,...dirty])){ const local=_lsGet(k);
        if(local==null)continue;
        if(dirty.has(k) || !(k in claves)){ mem[k]=local; reenviar[k]=local; } }
      if(Object.keys(reenviar).length)
        _enviar(reenviar).then(()=>{ const s=_dirty();
          Object.keys(reenviar).forEach(k=>s.delete(k)); _dirtyGuardar(s);
          toast("Tus plantillas y ediciones se guardaron en el despacho ✓"); }).catch(()=>{});
    }
    return servidor;                          // sin servidor: el espejo local ES el estado
  }
  function flush(){                          // al cerrar/refrescar: empuja lo pendiente de una vez
    if(!servidor)return; const dirty=_dirty(); if(!dirty.size)return;
    const payload={}; dirty.forEach(k=>{ payload[k]=_aServidor((k in mem)?mem[k]:_lsGet(k)); });
    const cuerpo=JSON.stringify({claves:payload});
    try{ const blob=new Blob([cuerpo],{type:"application/json"});
      if(navigator.sendBeacon&&navigator.sendBeacon(SRV,blob))return; }catch(_){}
    try{ const x=new XMLHttpRequest(); x.open("POST",SRV,false);   // respaldo síncrono
      x.setRequestHeader("Content-Type","application/json"); x.send(cuerpo); }catch(_){}
  }
  /* AVISO en voz alta (banner rojo fijo, no un toast pasajero): un guardado que no
     se pudo persistir jamás debe pasar inadvertido. Ofrece descargar respaldo. */
  function _avisar(sinEspacio){ if(avisado)return; avisado=true;
    let b=document.getElementById("store-alerta");
    if(!b){ b=document.createElement("div"); b.id="store-alerta";
      b.style.cssText="position:fixed;left:0;right:0;top:0;z-index:99999;background:var(--puka-600);"
        +"color:#fff;padding:10px 16px;font:600 14px/1.45 system-ui,sans-serif;display:flex;"
        +"gap:12px;align-items:center;box-shadow:0 2px 14px rgba(0,0,0,.4)";
      document.body.appendChild(b); }
    const msg=document.createElement("span"); msg.style.flex="1";
    msg.textContent=sinEspacio
      ? "⚠ No se pudo guardar: el almacenamiento del navegador está lleno. Enciende el servidor (./abrir-editor.sh) o descarga un respaldo para no perder tu trabajo."
      : "⚠ Un cambio no se pudo guardar en el despacho (servidor). Revisa que el servidor siga encendido; mientras tanto, descarga un respaldo.";
    const bkp=document.createElement("button"); bkp.textContent="Descargar respaldo";
    bkp.style.cssText="background:#fff;color:var(--puka-600);border:0;border-radius:6px;padding:6px 12px;font-weight:700;cursor:pointer";
    bkp.onclick=()=>{try{E.Tpl.backupAll();}catch(_){}};
    const cerrar=document.createElement("button"); cerrar.textContent="Ocultar";
    cerrar.style.cssText="background:transparent;color:#fff;border:1px solid rgba(255,255,255,.6);border-radius:6px;padding:6px 12px;cursor:pointer";
    cerrar.onclick=()=>{b.remove();avisado=false;};
    b.replaceChildren(msg,bkp,cerrar);
  }
  return {get,set,remove,boot,flush,servidorActivo:()=>servidor};
})();

E.State=(()=>{
  const st={
    doc:{w:1080,h:1080,bg:{type:"solid",c1:T("neutral.100"),c2:T("fondos.blanco"),angle:180}},
    objects:[], sel:[], clipboard:null, pal:"Rojo oficial", palVar:0, palRoles:null,
    guides:{v:[],h:[]}, grid:{on:false,size:40,snap:true},
    recent:[]
  };
  const byId=id=>st.objects.find(o=>o.id===id);
  const selObjs=()=>st.sel.map(byId).filter(Boolean);
  function setSel(ids){ st.sel=[...new Set(ids)].filter(byId); E.Props.refresh(); E.Layers.refresh(); E.Render.overlay(); }
  function expandGroups(ids){
    const out=new Set(ids);
    ids.forEach(id=>{const o=byId(id); if(o&&o.groupId) st.objects.forEach(x=>{if(x.groupId===o.groupId)out.add(x.id);});});
    return [...out];
  }
  function addObj(o,select=true){ o.id=o.id||uid(); st.objects.push(o); E.Render.all(); if(select)setSel([o.id]); return o; }
  function remove(ids){ st.objects=st.objects.filter(o=>!ids.includes(o.id)); setSel([]); E.Render.all(); }
  function pushRecent(c){ if(!c||c.startsWith("linear"))return; st.recent=[c,...st.recent.filter(x=>x!==c)].slice(0,10); }
  return {st,byId,selObjs,setSel,expandGroups,addObj,remove,pushRecent};
})();

/* =========================== HISTORY =========================== */
E.History=(()=>{
  let stack=[],idx=-1,max=60;
  function snap(label){
    stack=stack.slice(0,idx+1);
    stack.push({label,data:deep({doc:E.State.st.doc,objects:E.State.st.objects,
      guides:E.State.st.guides,pal:E.State.st.pal,palVar:E.State.st.palVar,palRoles:E.State.st.palRoles})});
    if(stack.length>max)stack.shift(); idx=stack.length-1; ui();
    /* autoguardado en «Mis ediciones»: cada cambio actualiza la edición actual
       (debounce interno). Si aún no hay módulo, cae al guardado de sesión clásico. */
    /* Autoguardado en «Mis ediciones»: cada cambio actualiza la edición actual.
       OJO: se comprueba `E.Ediciones` (binding léxico), NO `window.E` — un
       `const E` de nivel superior no se expone en window, así que el guard viejo
       `window.E && …` era SIEMPRE falso y el autoguardado por edición nunca corría. */
    if(E.Ediciones&&E.Ediciones.actual){ E.Ediciones.autosave(); }
    else { E.Store.set("identidad_editor_session_v1",
      JSON.stringify({...stack[idx].data,ts:Date.now()})); }
  }
  function restore(i){
    if(i<0||i>=stack.length)return; idx=i;
    const d=deep(stack[i].data);
    E.State.st.doc=d.doc; E.State.st.objects=d.objects; E.State.st.guides=d.guides||{v:[],h:[]};
    E.State.st.pal=d.pal||E.State.st.pal; E.State.st.palVar=d.palVar||0; E.State.st.palRoles=d.palRoles||null;
    E.State.setSel([]); E.View.applyDocSize(); E.Render.all(); E.Panels.syncDocSel(); ui();
  }
  const undo=()=>restore(idx-1), redo=()=>restore(idx+1);
  function ui(){ $("#btn-undo").disabled=idx<=0; $("#btn-redo").disabled=idx>=stack.length-1;
    if(E.Layers&&$("#rbody").dataset.tab==="hist")E.Layers.renderHist(); }
  return {snap,undo,redo,get stack(){return stack},get idx(){return idx},restore};
})();

/* ============================ RENDER =========================== */
E.Render=(()=>{
  const layer=$("#objlayer"), ab=$("#artboard"), ovl=$("#ovl");
  function bgCss(bg){ return bg.type==="none"?"repeating-conic-gradient(#ddd 0% 25%, #fff 0% 50%) 0 0/22px 22px"
    : bg.type==="gradient"?`linear-gradient(${bg.angle}deg, ${bg.c1}, ${bg.c2})` : bg.c1; }
  function fillCss(f){ return f.type==="gradient"?`linear-gradient(${f.angle}deg, ${f.c1}, ${f.c2})`:f.c1; }
  function iconSvg(o){
    const ds=(ICONS[o.icon]||ICONS["map-pin"]).d.map(d=>`<path d="${d}"/>`).join("");
    return `<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="${o.color}" stroke-width="${o.sw}" stroke-linecap="round" stroke-linejoin="round">${ds}</svg>`;
  }
  function shapeSvg(o){
    const w=o.w,h=o.h,sw=o.stroke.w, half=sw/2;
    const fill=o.fill.type==="none"?"none":(o.fill.type==="gradient"?`url(#g${o.id})`:o.fill.c1);
    const grad=o.fill.type==="gradient"?`<defs><linearGradient id="g${o.id}" gradientTransform="rotate(${o.fill.angle-90} .5 .5)"><stop offset="0" stop-color="${o.fill.c1}"/><stop offset="1" stop-color="${o.fill.c2}"/></linearGradient></defs>`:"";
    const st=`fill="${fill}" stroke="${sw>0?o.stroke.c:"none"}" stroke-width="${sw}"`;
    let body="";
    if(o.shape==="rect")body=`<rect x="${half}" y="${half}" width="${w-sw}" height="${h-sw}" rx="${o.radius}" ${st}/>`;
    else if(o.shape==="ellipse")body=`<ellipse cx="${w/2}" cy="${h/2}" rx="${(w-sw)/2}" ry="${(h-sw)/2}" ${st}/>`;
    else if(o.shape==="triangle")body=`<polygon points="${w/2},${half} ${w-half},${h-half} ${half},${h-half}" ${st} stroke-linejoin="round"/>`;
    else if(o.shape==="line")body=`<line x1="0" y1="${h/2}" x2="${w}" y2="${h/2}" stroke="${o.stroke.c}" stroke-width="${Math.max(sw,2)}" stroke-linecap="round"/>`;
    else if(o.shape==="arrow"){const s2=Math.max(sw,2),ah=Math.min(h/2,s2*4);
      body=`<line x1="0" y1="${h/2}" x2="${w-ah*1.2}" y2="${h/2}" stroke="${o.stroke.c}" stroke-width="${s2}" stroke-linecap="round"/><polygon points="${w},${h/2} ${w-ah*1.6},${h/2-ah} ${w-ah*1.6},${h/2+ah}" fill="${o.stroke.c}"/>`;}
    else if(o.shape==="star"){body=`<polygon points="${starPts(o)}" ${st} stroke-linejoin="round"/>`;}
    const sh=o.shadow&&o.shadow.on?`filter="drop-shadow(${o.shadow.x}px ${o.shadow.y}px ${o.shadow.blur}px ${o.shadow.color})"`:"";
    /* Formas de BIBLIOTECA: path SVG en coords 0..100 (crece sin límite). */
    if(o.shape==="path"){
      const swP=sw>0?(sw*100/Math.max(w,h)).toFixed(2):0;
      return `<svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none" ${sh}>${grad}`+
        `<path d="${o.d}" fill="${fill}" stroke="${sw>0?o.stroke.c:"none"}" stroke-width="${swP}" stroke-linejoin="round"/></svg>`;
    }
    return `<svg width="100%" height="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" ${sh}>${grad}${body}</svg>`;
  }
  function starPts(o){
    const cx=o.w/2,cy=o.h/2,R=Math.min(o.w,o.h)/2-o.stroke.w,r=R*(o.inner||0.45),n=o.points||5;
    let pts=[]; for(let i=0;i<n*2;i++){const a=Math.PI/n*i-Math.PI/2, rr=i%2?r:R;
      pts.push((cx+rr*Math.cos(a)*(o.w/Math.min(o.w,o.h)))+","+(cy+rr*Math.sin(a)*(o.h/Math.min(o.w,o.h))));}
    return pts.join(" ");
  }
  function textStyle(o){
    let s=`font-family:'${o.font}',sans-serif;font-size:${o.size}px;font-weight:${o.weight};`+
      `font-style:${o.italic?"italic":"normal"};text-decoration:${o.underline?"underline":"none"};`+
      `line-height:${o.lh};letter-spacing:${o.ls}px;text-align:${o.align};`+
      (o.upper?"text-transform:uppercase;":"");
    if(o.colorG&&o.colorG.on) s+=`background:linear-gradient(${o.colorG.angle}deg,${o.color},${o.colorG.c2});-webkit-background-clip:text;background-clip:text;color:transparent;`;
    else s+=`color:${o.color};`;
    if(o.outline&&o.outline.w>0)s+=`-webkit-text-stroke:${o.outline.w}px ${o.outline.color};`;
    if(o.shadow&&o.shadow.on)s+=`text-shadow:${o.shadow.x}px ${o.shadow.y}px ${o.shadow.blur}px ${o.shadow.color};`;
    return s;
  }
  /* Marco con forma (o.mask="path", o.maskD en 0..100 estirado a la caja): máscara CSS con un SVG en línea. */
  function mascaraCss(o){
    if(o.mask!=="path"||!o.maskD)return "";
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="${o.maskD}"/></svg>`;
    const u=`url('data:image/svg+xml,${encodeURIComponent(svg)}') 0 0/100% 100% no-repeat`;
    return `-webkit-mask:${u};mask:${u};`;
  }
  function imgHtml(o){
    const r=o.mask==="circle"?"50%":(o.mask==="round"?o.radius+"px":"0"), mk=mascaraCss(o);
    const f=`filter:brightness(${o.filters.br}%) contrast(${o.filters.ct}%) saturate(${o.filters.sat}%) blur(${o.filters.blur}px);`;
    const t=`transform:translate(${o.ox}%,${o.oy}%) scale(${o.scale});`;
    if(!o.src)return `<div style="width:100%;height:100%;border-radius:${r};${mk}background:${T("neutral.400")};display:grid;place-items:center;color:${T("neutral.800")};font:600 13px Inter;text-align:center;padding:8px">Doble clic:<br>subir imagen</div>`;
    return `<div style="width:100%;height:100%;overflow:hidden;border-radius:${r};${mk}"><img src="${o.src}" style="object-fit:cover;${t}${f}"></div>`;
  }
  function objHtml(o){
    if(o.type==="text"&&Arco.activo(o))return Arco.html(o,escapeHtml);
    if(o.type==="text")return `<div class="txt" style="${textStyle(o)}">${escapeHtml(o.text)}</div>`;
    if(o.type==="shape")return shapeSvg(o);
    if(o.type==="icon")return iconSvg(o);
    if(o.type==="image")return imgHtml(o);
    return "";
  }
  const escapeHtml=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
  function all(){
    const st=E.State.st;
    ab.style.width=st.doc.w+"px"; ab.style.height=st.doc.h+"px";
    ab.style.background=bgCss(st.doc.bg);
    layer.innerHTML=st.objects.map(o=>{
      if(o.hidden)return "";
      return `<div class="obj ${o.locked?"locked":""}" data-id="${o.id}" style="left:${o.x}px;top:${o.y}px;width:${o.w}px;`+
        (o.type==="text"?"":`height:${o.h}px;`)+
        `transform:rotate(${o.rot||0}deg);opacity:${o.opacity??1};">${objHtml(o)}</div>`;
    }).join("");
    // sincronizar altura real del texto
    st.objects.forEach(o=>{ if(o.type==="text"&&!o.hidden){const el=layer.querySelector(`[data-id="${o.id}"]`); if(el)o.h=el.offsetHeight;}});
    overlay(); E.View.drawGuides();
  }
  function one(id){ const o=E.State.byId(id), el=layer.querySelector(`[data-id="${id}"]`); if(!o||!el)return;
    el.style.left=o.x+"px"; el.style.top=o.y+"px"; el.style.width=o.w+"px";
    if(o.type!=="text")el.style.height=o.h+"px";
    el.style.transform=`rotate(${o.rot||0}deg)`; el.style.opacity=o.opacity??1;
    el.innerHTML=objHtml(o); if(o.type==="text")o.h=el.offsetHeight;
  }
  /* --- overlay de selección --- */
  function overlay(){
    const z=E.View.zoom, st=E.State.st;
    ovl.querySelectorAll(".selbox,.hnd").forEach(n=>n.remove());
    E.State.selObjs().forEach((o,i)=>{
      const p=E.View.docToScreen(o.x,o.y);
      const box=document.createElement("div"); box.className="selbox";
      box.style.cssText=`left:${p.x}px;top:${p.y}px;width:${o.w*z}px;height:${o.h*z}px;transform:rotate(${o.rot||0}deg);transform-origin:center;`;
      ovl.appendChild(box);
      if(E.State.st.sel.length===1&&!o.locked){
        const H=[["nw",0,0],["n",.5,0],["ne",1,0],["e",1,.5],["se",1,1],["s",.5,1],["sw",0,1],["w",0,.5]];
        H.forEach(([k,fx,fy])=>{
          const h=document.createElement("div");h.className="hnd";h.dataset.h=k;h.dataset.id=o.id;
          h.style.cssText=`left:${p.x+o.w*z*fx-5}px;top:${p.y+o.h*z*fy-5}px;cursor:${k}-resize;`;
          ovl.appendChild(h);
        });
        const r=document.createElement("div");r.className="hnd rot";r.dataset.h="rot";r.dataset.id=o.id;
        r.style.cssText=`left:${p.x+o.w*z*.5-5}px;top:${p.y-28}px;`;ovl.appendChild(r);
      }
    });
    /* Caja ENVOLVENTE con handles para escalar/rotar el CONJUNTO (2+ objetos) */
    if(st.sel.length>1){
      const objs=E.State.selObjs();
      const bx=Math.min(...objs.map(o=>o.x)), by=Math.min(...objs.map(o=>o.y));
      const bw=Math.max(...objs.map(o=>o.x+o.w))-bx, bh=Math.max(...objs.map(o=>o.y+o.h))-by;
      const p=E.View.docToScreen(bx,by);
      const box=document.createElement("div"); box.className="selbox gbox";
      box.style.cssText=`left:${p.x}px;top:${p.y}px;width:${bw*z}px;height:${bh*z}px;`;
      ovl.appendChild(box);
      [["nw",0,0],["ne",1,0],["se",1,1],["sw",0,1],["n",.5,0],["e",1,.5],["s",.5,1],["w",0,.5]].forEach(([k,fx,fy])=>{
        const h=document.createElement("div"); h.className="hnd"; h.dataset.gh=k;
        h.style.cssText=`left:${p.x+bw*z*fx-5}px;top:${p.y+bh*z*fy-5}px;cursor:${k}-resize;`; ovl.appendChild(h); });
    }
    barraEstado();
  }
  /* barra de estado del estudio: lienzo, capas y selección (la llama cada repintado del overlay) */
  const TIPO={text:"texto",image:"imagen",shape:"forma",icon:"ícono",group:"grupo"};
  function barraEstado(){
    const st=E.State.st, sel=E.State.selObjs();
    $("#est-lienzo").textContent=st.doc.w+" × "+st.doc.h+" px";
    $("#est-capas").textContent=st.objects.length;
    $("#est-sel").textContent=!sel.length?"Sin selección":sel.length>1?sel.length+" elementos seleccionados"
      :"Selección: "+(sel[0].name||TIPO[sel[0].type]||sel[0].type)+" · "+Math.round(sel[0].w||0)+" × "+Math.round(sel[0].h||0)+" px";
  }
  return {all,one,overlay,bgCss,fillCss,iconSvg,escapeHtml,textStyle};
})();

/* ============================= VIEW ============================ */
E.View=(()=>{
  const vp=$("#viewport"), world=$("#world");
  let zoom=1, px=60, py=60;
  function apply(){ world.style.transform=`translate(${px}px,${py}px) scale(${zoom})`;
    $("#zoomlbl").textContent=Math.round(zoom*100)+"%"; $("#est-zoom").textContent=Math.round(zoom*100)+"%";
    drawRulers(); E.Render.overlay(); drawGuides(); }
  function setZoom(z,cx,cy){
    z=clamp(z,.05,6);
    if(cx!==undefined){ const wx=(cx-px)/zoom, wy=(cy-py)/zoom; px=cx-wx*z; py=cy-wy*z; }
    zoom=z; apply();
  }
  function fit(){
    const st=E.State.st, r=vp.getBoundingClientRect();
    const z=Math.min((r.width-90)/st.doc.w,(r.height-90)/st.doc.h);
    zoom=clamp(z,.05,4); px=(r.width-st.doc.w*zoom)/2; py=(r.height-st.doc.h*zoom)/2; apply();
  }
  const docToScreen=(x,y)=>({x:x*zoom+px, y:y*zoom+py});
  const screenToDoc=(x,y)=>({x:(x-px)/zoom, y:(y-py)/zoom});
  function applyDocSize(){ E.Render.all(); $("#gridlayer").style.setProperty("--gs",E.State.st.grid.size+"px"); }
  /* reglas */
  function drawRulers(){
    const rx=$("#rulerX"), ry=$("#rulerY");
    const w=rx.clientWidth,h=ry.clientHeight; rx.width=w; ry.height=h;
    const cx=rx.getContext("2d"), cy=ry.getContext("2d");
    const tema=getComputedStyle(document.documentElement), tk=n=>tema.getPropertyValue(n).trim();   // tokens del estudio
    [[cx,w,24],[cy,24,h]].forEach(([c])=>{c.fillStyle=tk("--est-sup-2");});
    cx.fillRect(0,0,w,24); cy.fillRect(0,0,24,h);
    cx.fillStyle=cy.fillStyle=tk("--est-texto-3"); cx.strokeStyle=cy.strokeStyle=tk("--est-borde-fuerte");
    cx.font=cy.font="9px "+tk("--est-fuente");
    const step=niceStep(80/zoom);
    for(let v=Math.floor(screenToDoc(0,0).x/step)*step; v<screenToDoc(w,0).x; v+=step){
      const sx=v*zoom+px; cx.beginPath();cx.moveTo(sx,14);cx.lineTo(sx,24);cx.stroke(); cx.fillText(v,sx+3,11);
    }
    for(let v=Math.floor(screenToDoc(0,0).y/step)*step; v<screenToDoc(0,h).y; v+=step){
      const sy=v*zoom+py; cy.beginPath();cy.moveTo(14,sy);cy.lineTo(24,sy);cy.stroke();
      cy.save();cy.translate(11,sy+3);cy.rotate(-Math.PI/2);cy.fillText(v,0,0);cy.restore();
    }
  }
  const niceStep=t=>{const p=Math.pow(10,Math.floor(Math.log10(t)));const c=t/p;return (c<=1?1:c<=2?2:c<=5?5:10)*p;};
  /* guías de usuario */
  function drawGuides(){
    const ovl=$("#ovl"); ovl.querySelectorAll(".uguide").forEach(n=>n.remove());
    const g=E.State.st.guides;
    g.v.forEach((v,i)=>{const d=document.createElement("div");d.className="uguide v";d.dataset.gi=i;d.dataset.ax="v";
      d.style.left=(v*zoom+px)+"px"; d.style.pointerEvents="all"; ovl.appendChild(d);});
    g.h.forEach((v,i)=>{const d=document.createElement("div");d.className="uguide h";d.dataset.gi=i;d.dataset.ax="h";
      d.style.top=(v*zoom+py)+"px"; d.style.pointerEvents="all"; ovl.appendChild(d);});
  }
  /* eventos */
  vp.addEventListener("wheel",e=>{
    e.preventDefault();
    if(e.ctrlKey||e.metaKey){ setZoom(zoom*(e.deltaY<0?1.1:0.9), e.offsetX, e.offsetY); }
    else { px-=e.shiftKey?e.deltaY:e.deltaX; py-=e.shiftKey?0:e.deltaY; apply(); }
  },{passive:false});
  let panning=false,pk=false,lx=0,ly=0;
  addEventListener("keydown",e=>{if(e.code==="Space"&&!e.repeat&&!E.Input.editing())
    {pk=true;vp.style.cursor="grab";}});
  addEventListener("keyup",e=>{if(e.code==="Space"){pk=false;vp.style.cursor="default";}});
  vp.addEventListener("pointerdown",e=>{
    if(pk||e.button===1){panning=true;lx=e.clientX;ly=e.clientY;vp.setPointerCapture(e.pointerId);e.stopPropagation();}
  },true);
  vp.addEventListener("pointermove",e=>{ if(panning){px+=e.clientX-lx;py+=e.clientY-ly;lx=e.clientX;ly=e.clientY;apply();}});
  vp.addEventListener("pointerup",()=>panning=false);
  /* crear guías desde reglas */
  function rulerDrag(rEl,axis){
    rEl.addEventListener("pointerdown",e=>{
      const move=ev=>{ /* visual feedback simple */ };
      const up=ev=>{
        const r=vp.getBoundingClientRect();
        if(axis==="v"){const x=screenToDoc(ev.clientX-r.left,0).x; if(ev.clientX>r.left)E.State.st.guides.v.push(Math.round(x));}
        else{const y=screenToDoc(0,ev.clientY-r.top).y; if(ev.clientY>r.top)E.State.st.guides.h.push(Math.round(y));}
        drawGuides(); removeEventListener("pointermove",move); removeEventListener("pointerup",up);
      };
      addEventListener("pointermove",move); addEventListener("pointerup",up);
    });
  }
  rulerDrag($("#rulerX"),"h"); rulerDrag($("#rulerY"),"v");
  $("#ovl").addEventListener("pointerdown",e=>{
    const g=e.target.closest(".uguide"); if(!g)return;
    e.stopPropagation(); const ax=g.dataset.ax, gi=+g.dataset.gi;
    const move=ev=>{const r=vp.getBoundingClientRect();
      if(ax==="v")E.State.st.guides.v[gi]=Math.round(screenToDoc(ev.clientX-r.left,0).x);
      else E.State.st.guides.h[gi]=Math.round(screenToDoc(0,ev.clientY-r.top).y);
      drawGuides();};
    const up=ev=>{const r=vp.getBoundingClientRect();
      if((ax==="v"&&ev.clientX<r.left+8)||(ax==="h"&&ev.clientY<r.top+8)){ // soltar sobre la regla = eliminar
        if(ax==="v")E.State.st.guides.v.splice(gi,1); else E.State.st.guides.h.splice(gi,1); drawGuides();}
      removeEventListener("pointermove",move);removeEventListener("pointerup",up); E.History.snap("Guía");};
    addEventListener("pointermove",move);addEventListener("pointerup",up);
  });
  new ResizeObserver(()=>{drawRulers();}).observe(vp);
  return {get zoom(){return zoom}, setZoom, fit, apply, docToScreen, screenToDoc, applyDocSize, drawGuides,
    zoomIn:()=>setZoom(zoom*1.2), zoomOut:()=>setZoom(zoom/1.2)};
})();

/* ============================ INPUT ============================ */
E.Input=(()=>{
  const vp=$("#viewport"), ovl=$("#ovl"), mq=$("#marquee"), ted=$("#txtedit");
  let mode=null, start=null, orig=null, editId=null;
  const editing=()=>ted.style.display==="block"||document.activeElement.matches("input,select,textarea");
  function objAt(e){ const el=e.target.closest(".obj"); return el?E.State.byId(el.dataset.id):null; }

  vp.addEventListener("pointerdown",e=>{
    if(e.button!==0||editing())return;
    const h=e.target.closest(".hnd");
    if(h){ startHandle(e,h); return; }
    const o=objAt(e);
    if(o&&!o.locked){
      const ids=E.State.expandGroups([o.id]);
      const multi=e.shiftKey||e.ctrlKey||e.metaKey;   // Ctrl/⌘ o Shift = ampliar/alternar
      if(multi){
        if(E.State.st.sel.includes(o.id)){ E.State.setSel(E.State.st.sel.filter(x=>!ids.includes(x))); return; }
        E.State.setSel([...new Set([...E.State.st.sel,...ids])]); startMove(e); return;
      }
      if(!E.State.st.sel.includes(o.id))E.State.setSel(ids);
      startMove(e);
    } else { startMarquee(e); }
  });
  /* --- mover con snap + smart guides --- */
  function startMove(e){
    mode="move"; start={x:e.clientX,y:e.clientY};
    orig=E.State.selObjs().map(o=>({id:o.id,x:o.x,y:o.y}));
    vp.setPointerCapture(e.pointerId);
  }
  function snapDelta(dx,dy){
    const st=E.State.st, z=E.View.zoom, thr=6/z;
    const sel=new Set(st.sel);
    const objs=E.State.selObjs(); if(!objs.length)return {dx,dy};
    const minX=Math.min(...orig.map(o=>o.x)), minY=Math.min(...orig.map(o=>o.y));
    const w=Math.max(...objs.map((o,i)=>orig[i].x+o.w))-minX, h=Math.max(...objs.map((o,i)=>orig[i].y+o.h))-minY;
    const cand={x:[0,st.doc.w/2,st.doc.w,...st.guides.v], y:[0,st.doc.h/2,st.doc.h,...st.guides.h]};
    st.objects.forEach(o=>{ if(sel.has(o.id)||o.hidden)return;
      cand.x.push(o.x,o.x+o.w/2,o.x+o.w); cand.y.push(o.y,o.y+o.h/2,o.y+o.h);});
    if(st.grid.on&&st.grid.snap){const g=st.grid.size;
      const gx=Math.round((minX+dx)/g)*g-minX, gy=Math.round((minY+dy)/g)*g-minY;
      if(Math.abs(gx-dx)<thr)dx=gx; if(Math.abs(gy-dy)<thr)dy=gy;}
    let lines=[];
    const mine=[minX+dx,minX+dx+w/2,minX+dx+w];
    let best=thr;cand.x.forEach(c=>mine.forEach((m,mi)=>{const d=Math.abs(m-c);
      if(d<best){best=d;dx+=c-m;lines=lines.filter(l=>l.ax!=="v");lines.push({ax:"v",v:c});}}));
    const mineY=[minY+dy,minY+dy+h/2,minY+dy+h];
    best=thr;cand.y.forEach(c=>mineY.forEach(m=>{const d=Math.abs(m-c);
      if(d<best){best=d;dy+=c-m;lines=lines.filter(l=>l.ax!=="h");lines.push({ax:"h",v:c});}}));
    showSmart(lines);
    return {dx,dy};
  }
  function showSmart(lines){
    ovl.querySelectorAll(".sguide").forEach(n=>n.remove());
    lines.forEach(l=>{const d=document.createElement("div");d.className="sguide";
      if(l.ax==="v"){const p=E.View.docToScreen(l.v,0);d.style.cssText=`left:${p.x}px;top:0;bottom:0;width:1px;`;}
      else{const p=E.View.docToScreen(0,l.v);d.style.cssText=`top:${p.y}px;left:0;right:0;height:1px;`;}
      ovl.appendChild(d);});
  }
  /* --- handles: escalar / rotar --- */
  function startHandle(e,h){
    if(h.dataset.gh){   // handle de la CAJA ENVOLVENTE → escalar el conjunto
      const objs=E.State.selObjs();
      const bx=Math.min(...objs.map(o=>o.x)), by=Math.min(...objs.map(o=>o.y));
      const bw=Math.max(...objs.map(o=>o.x+o.w))-bx, bh=Math.max(...objs.map(o=>o.y+o.h))-by;
      mode="gresize"; start={x:e.clientX,y:e.clientY};
      orig={gh:h.dataset.gh, bx,by,bw,bh, snap:objs.map(o=>({id:o.id,x:o.x,y:o.y,w:o.w,h:o.h,size:o.size}))};
      vp.setPointerCapture(e.pointerId); e.stopPropagation(); return;
    }
    const o=E.State.byId(h.dataset.id); if(!o)return;
    mode=h.dataset.h; start={x:e.clientX,y:e.clientY};
    orig={...deep(o), cx:o.x+o.w/2, cy:o.y+o.h/2, ratio:o.w/Math.max(o.h,1)};
    vp.setPointerCapture(e.pointerId); e.stopPropagation();
  }
  vp.addEventListener("pointermove",e=>{
    if(!mode)return;
    const z=E.View.zoom; let dx=(e.clientX-start.x)/z, dy=(e.clientY-start.y)/z;
    if(mode==="move"){
      if(e.shiftKey){ if(Math.abs(dx)>=Math.abs(dy))dy=0; else dx=0; }   // Shift: solo en horizontal o en vertical
      const {dx:sx,dy:sy}=snapDelta(dx,dy);
      orig.forEach(g=>{const o=E.State.byId(g.id);o.x=Math.round(g.x+sx);o.y=Math.round(g.y+sy);E.Render.one(g.id);});
      E.Render.overlay();
    } else if(mode==="marquee"){ moveMarquee(e); }
    else if(mode==="rot"){
      const o=E.State.byId(orig.id), r=vp.getBoundingClientRect();
      const p=E.View.screenToDoc(e.clientX-r.left,e.clientY-r.top);
      let a=Math.atan2(p.y-orig.cy,p.x-orig.cx)*180/Math.PI+90;
      if(e.shiftKey)a=Math.round(a/15)*15;
      else { const k=Math.round(a/45)*45; if(Math.abs(a-k)<4)a=k; }   // imán suave a 0°, 45°, 90°…
      a=((a%360)+540)%360-180;
      o.rot=Math.round(a); E.Render.one(o.id); E.Render.overlay(); E.Props.softRefresh();
    } else if(mode==="gresize"){   // escalar el CONJUNTO (esquinas = proporcional)
      const k=orig.gh, {bx,by,bw,bh}=orig;
      let nx=bx,ny=by,nw=bw,nh=bh;
      if(k.includes("e"))nw=bw+dx; if(k.includes("s"))nh=bh+dy;
      if(k.includes("w")){nw=bw-dx;nx=bx+dx;} if(k.includes("n")){nh=bh-dy;ny=by+dy;}
      let fx=nw/bw, fy=nh/bh;
      if(k.length===2 && !e.shiftKey){ const f=Math.max(fx,fy); fx=fy=f; nw=bw*f; nh=bh*f;
        if(k.includes("w"))nx=bx+bw-nw; if(k.includes("n"))ny=by+bh-nh; }
      fx=Math.max(.05,fx); fy=Math.max(.05,fy);
      const ax=nx, ay=ny, sf=(k.length===2?fx:Math.max(fx,fy));
      orig.snap.forEach(s=>{ const o=E.State.byId(s.id); if(!o)return;
        o.x=Math.round(ax+(s.x-bx)*fx); o.y=Math.round(ay+(s.y-by)*fy);
        o.w=Math.max(4,Math.round(s.w*fx)); o.h=Math.max(4,Math.round(s.h*fy));
        if(o.type==="text"&&s.size)o.size=Math.max(6,Math.round(s.size*sf));
        E.Render.one(o.id); });
      E.Render.overlay(); E.Props.softRefresh();
    } else { // resize
      const o=E.State.byId(orig.id); if(!o)return;
      const k=mode; let {x,y,w,h}=orig;
      const keep=e.shiftKey||o.type==="icon"||(o.type==="image"&&k.length===2);
      let nx=x,ny=y,nw=w,nh=h;
      if(k.includes("e"))nw=w+dx; if(k.includes("s"))nh=h+dy;
      if(k.includes("w")){nw=w-dx;nx=x+dx;} if(k.includes("n")){nh=h-dy;ny=y+dy;}
      if(o.type==="text"){
        if(k.length===2){ const f=clamp(nw/w,.05,20); o.size=Math.max(6,Math.round(orig.size*f)); o.w=Math.max(20,Math.round(w*f)); o.x=k.includes("w")?x+w-o.w:x; }
        else { o.w=Math.max(30,Math.round(nw)); o.x=Math.round(nx); }
      } else {
        if(keep&&k.length===2){ const f=Math.max(nw/w,nh/h); nw=w*f; nh=h*f;
          if(k.includes("w"))nx=x+w-nw; if(k.includes("n"))ny=y+h-nh; }
        o.w=Math.max(8,Math.round(nw)); o.h=Math.max(8,Math.round(nh));
        o.x=Math.round(nx); o.y=Math.round(ny);
      }
      E.Render.one(o.id); E.Render.overlay(); E.Props.softRefresh();
    }
  });
  vp.addEventListener("pointerup",e=>{
    if(mode==="marquee")endMarquee(e);
    else if(mode){ ovl.querySelectorAll(".sguide").forEach(n=>n.remove());
      E.History.snap(mode==="move"?"Mover":mode==="rot"?"Rotar":"Escalar"); }
    mode=null;
  });
  /* --- marquee --- */
  function startMarquee(e){
    if(!e.shiftKey)E.State.setSel([]);
    mode="marquee"; const r=vp.getBoundingClientRect();
    start={x:e.clientX-r.left,y:e.clientY-r.top,add:[...E.State.st.sel]};
    mq.style.display="block"; moveMarquee(e); vp.setPointerCapture(e.pointerId);
  }
  function moveMarquee(e){
    const r=vp.getBoundingClientRect(), x2=e.clientX-r.left, y2=e.clientY-r.top;
    const x=Math.min(start.x,x2),y=Math.min(start.y,y2),w=Math.abs(x2-start.x),h=Math.abs(y2-start.y);
    Object.assign(mq.style,{left:x+"px",top:y+"px",width:w+"px",height:h+"px"});
    const a=E.View.screenToDoc(x,y), b=E.View.screenToDoc(x+w,y+h);
    const ids=E.State.st.objects.filter(o=>!o.hidden&&!o.locked&&o.x<b.x&&o.x+o.w>a.x&&o.y<b.y&&o.y+o.h>a.y).map(o=>o.id);
    E.State.st.sel=[...new Set([...start.add,...E.State.expandGroups(ids)])];
    E.Render.overlay();
  }
  function endMarquee(){ mq.style.display="none"; E.Props.refresh(); E.Layers.refresh(); }
  /* --- doble clic: editar texto / subir imagen ---
     Recorremos TODA la pila de objetos bajo el cursor (no solo el de arriba):
     así una veladura/forma superpuesta sobre una foto no "tapa" el doble clic.
     Buscamos, de arriba hacia abajo, el primer objeto accionable (texto o imagen). */
  function objsAtPoint(e){
    const seen=new Set(), out=[];
    for(const el of document.elementsFromPoint(e.clientX,e.clientY)){
      const box=el.closest&&el.closest(".obj");
      if(!box||seen.has(box))continue; seen.add(box);
      const o=E.State.byId(box.dataset.id); if(o&&!o.locked)out.push(o);
    }
    return out;
  }
  vp.addEventListener("dblclick",e=>{
    if(editing())return;
    const o=objsAtPoint(e).find(o=>o.type==="text"||o.type==="image"); if(!o)return;
    if(o.type==="text")openTextEdit(o);
    else E.Panels.pickImage(src=>{o.src=src;E.Render.all();E.History.snap("Imagen");});
  });
  function openTextEdit(o){
    editId=o.id;
    const p=E.View.docToScreen(o.x,o.y), z=E.View.zoom;
    ted.style.display="block";
    ted.style.cssText+=`left:${p.x}px;top:${p.y}px;width:${o.w*z}px;transform-origin:0 0;`;
    ted.style.font=`${o.italic?"italic ":""}${o.weight} ${o.size*z}px '${o.font}'`;
    ted.style.lineHeight=o.lh; ted.style.letterSpacing=(o.ls*z)+"px"; ted.style.textAlign=o.align;
    ted.style.color=o.colorG&&o.colorG.on?o.color:o.color;
    ted.style.textTransform=o.upper?"uppercase":"none";
    ted.textContent=o.text; ted.focus();
    document.getSelection().selectAllChildren(ted);
  }
  ted.addEventListener("blur",commitText);
  ted.addEventListener("keydown",e=>{ if(e.key==="Escape"){e.preventDefault();ted.style.display="none";editId=null;}
    e.stopPropagation(); });
  function commitText(){ if(editId==null)return;
    const o=E.State.byId(editId); if(o){o.text=ted.textContent; E.Render.all(); E.History.snap("Texto");}
    ted.style.display="none"; editId=null; }
  return {editing};
})();

/* ============================ COLOR UI ========================= */
E.Color=(()=>{
  let pop=null;
  const hex2rgb=h=>{h=h.replace("#","");if(h.length===3)h=[...h].map(c=>c+c).join("");
    return {r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)};};
  const rgb2hex=(r,g,b)=>"#"+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,"0")).join("").toUpperCase();
  function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;const M=Math.max(r,g,b),m=Math.min(r,g,b);let h=0,s=0,l=(M+m)/2;
    if(M!==m){const d=M-m;s=l>.5?d/(2-M-m):d/(M+m);
      h=M===r?(g-b)/d+(g<b?6:0):M===g?(b-r)/d+2:(r-g)/d+4;h*=60;}
    return {h:Math.round(h),s:Math.round(s*100),l:Math.round(l*100)};}
  function hsl2hex(h,s,l){s/=100;l/=100;const a=s*Math.min(l,1-l);
    const f=n=>{const k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1));};
    return rgb2hex(f(0)*255,f(8)*255,f(4)*255);}
  function isOrange(hex){try{const {r,g,b}=hex2rgb(hex);const {h,s,l}=rgb2hsl(r,g,b);
    return h>=16&&h<=45&&s>45&&l>25&&l<75;}catch(_){return false;}}
  /* open({value:{type,c1,c2,angle} | "#hex", gradient:bool}, onChange) */
  function open(anchor,opts,cb){
    close();
    const val=typeof opts.value==="string"?{type:"solid",c1:opts.value,c2:T("fondos.blanco"),angle:90}:deep(opts.value);
    pop=document.createElement("div"); pop.className="pop";
    const r=anchor.getBoundingClientRect();
    pop.style.left=clamp(r.left-100,8,innerWidth-268)+"px";
    pop.style.top=clamp(r.bottom+8,8,innerHeight-420)+"px";
    document.body.appendChild(pop);
    let tab=val.type==="gradient"?"grad":"solid";
    function emit(){ E.State.pushRecent(val.c1); cb(opts.gradient?deep(val):val.c1); paint(); }
    function chipRow(title,colors){ return `<div class="note" style="margin:8px 0 4px">${title}</div><div class="chips">`+
      colors.map(c=>`<div class="chip" data-c="${c}" title="${c}" style="background:${c}"></div>`).join("")+`</div>`;}
    function paint(){
      const cur=tab==="grad"?"c2":"c1"; const c=val.c1;
      const {r:R,g:G,b:B}=hex2rgb(c), hsl=rgb2hsl(R,G,B);
      pop.innerHTML=
        (opts.gradient?`<div class="tabs"><button data-t="solid" class="${tab==="solid"?"on":""}">Sólido</button><button data-t="grad" class="${tab==="grad"?"on":""}">Degradado</button></div>`:"")+
        `<div class="f-row"><input type="color" id="cp1" value="${val.c1}"><input type="text" id="chex" value="${val.c1}" style="width:86px">`+
        `<button class="mini-btn" id="ccopy" title="Copiar">⧉</button>${window.EyeDropper?'<button class="mini-btn" id="ceye" title="Gotero">◉</button>':""}</div>`+
        `<div class="f-row"><label>RGB</label><input type="number" id="cr" value="${R}" style="width:52px"><input type="number" id="cg" value="${G}" style="width:52px"><input type="number" id="cb" value="${B}" style="width:52px"></div>`+
        `<div class="f-row"><label>HSL</label><input type="number" id="ch" value="${hsl.h}" style="width:52px"><input type="number" id="cs" value="${hsl.s}" style="width:52px"><input type="number" id="cl" value="${hsl.l}" style="width:52px"></div>`+
        (tab==="grad"?`<div class="f-row"><label>Color 2</label><input type="color" id="cp2" value="${val.c2}"><input type="number" id="cang" value="${val.angle}" style="width:60px" title="Ángulo">°</div>`:"")+
        (isOrange(val.c1)?`<div class="note warn">⚠️ Naranja: color de otro partido (F6 §10)</div>`:"")+
        chipRow("Puka (rojo)",Object.values(BRAND.puka))+
        chipRow("Q'illu (amarillo)",Object.values(BRAND.qillu))+
        chipRow("Neutros",[...Object.values(BRAND.neutro),BRAND.extra.blanco])+
        chipRow("Alternativos (tema vívido)",[BRAND.extra.vivo,BRAND.extra.oro])+
        (E.State.st.recent.length?chipRow("Recientes",E.State.st.recent):"");
      pop.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;val.type=tab==="grad"?"gradient":"solid";emit();});
      pop.querySelector("#cp1").oninput=e=>{val.c1=e.target.value.toUpperCase();emit();};
      pop.querySelector("#chex").onchange=e=>{let v=e.target.value.trim();if(!v.startsWith("#"))v="#"+v;
        if(/^#[0-9a-fA-F]{3,6}$/.test(v)){val.c1=v.toUpperCase();emit();}};
      ["cr","cg","cb"].forEach((id,i)=>pop.querySelector("#"+id).onchange=()=>{
        val.c1=rgb2hex(+pop.querySelector("#cr").value,+pop.querySelector("#cg").value,+pop.querySelector("#cb").value);emit();});
      ["ch","cs","cl"].forEach(id=>pop.querySelector("#"+id).onchange=()=>{
        val.c1=hsl2hex(+pop.querySelector("#ch").value,+pop.querySelector("#cs").value,+pop.querySelector("#cl").value);emit();});
      pop.querySelector("#ccopy").onclick=()=>{navigator.clipboard?.writeText(val.c1);toast("Color copiado: "+val.c1);};
      const eye=pop.querySelector("#ceye"); if(eye)eye.onclick=async()=>{try{const r=await new EyeDropper().open();val.c1=r.sRGBHex.toUpperCase();emit();}catch(_){}};
      if(tab==="grad"){ pop.querySelector("#cp2").oninput=e=>{val.c2=e.target.value.toUpperCase();emit();};
        pop.querySelector("#cang").onchange=e=>{val.angle=+e.target.value;emit();}; }
      pop.querySelectorAll(".chip").forEach(ch=>ch.onclick=()=>{val.c1=ch.dataset.c;emit();});
    }
    paint();
    setTimeout(()=>addEventListener("pointerdown",outside),0);
    function outside(e){ if(pop&&!pop.contains(e.target)){close();removeEventListener("pointerdown",outside);
      E.History.snap("Color");} }
  }
  function close(){ if(pop){pop.remove();pop=null;} }
  function swatchBtn(value,gradient,cb){
    const b=document.createElement("button"); b.className="sw-btn";
    const css=typeof value==="string"?value:E.Render.bgCss(value);
    b.style.background=css;
    b.onclick=()=>open(b,{value,gradient},v=>{ b.style.background=typeof v==="string"?v:E.Render.bgCss(v); cb(v); });
    return b;
  }
  return {open,swatchBtn,isOrange};
})();

/* ====================== PALETAS DINÁMICAS ======================
   Recolorea TODA la pieza por roles (como el selector de estilos de Canva).
   Solo toca colores que pertenecen al sistema; los personalizados se respetan. */
E.Pal=(()=>{
  /* Prioridad de detección por tipo de objeto. En «Papel» el fondo y el texto sobre el acento (ctaText) son el
     MISMO color: con una sola prioridad, una forma color papel (tarjeta, banda) se tomaba por ctaText y al cambiar
     de paleta salía del color del texto del botón (negro en «Rojo oficial»). Un relleno prefiere los roles de
     superficie; un texto, los de texto. */
  const PRI=["brandA","text","muted","ctaText","soft","deep","bg"];
  const PRI_TEXTO=["text","ctaText","brandA","muted","soft","deep","bg"];
  const PRI_RELLENO=["brandA","bg","soft","deep","muted","text","ctaText"];
  const eq=(a,b)=>(a||"").toUpperCase()===(b||"").toUpperCase();
  function roleOf(hex,P,orden){ for(const r of orden||PRI) if(eq(P[r],hex)) return r; return null; }
  /* force: rol obligado (para el FONDO del documento, que colisiona por color con
     ctaText/text en varias paletas — sin esto el fondo se recolorea mal). */
  function map(hex,cur,tgt,force,orden){ if(force&&eq(cur[force],hex))return tgt[force];
    const r=roleOf(hex,cur,orden); return r?tgt[r]:hex; }
  /* roles de la variante idx de una familia (con contraste derivado) */
  function rolesDe(name,idx){ const f=FAMILIAS[name]; if(!f)return PALETAS[name]||PALETAS["Rojo oficial"];
    const v=f.vars[((idx%f.vars.length)+f.vars.length)%f.vars.length]; return derivarRoles(v[0],v[1]); }
  const nVars=name=>FAMILIAS[name]?FAMILIAS[name].vars.length:1;
  /* Diseños guardados antes de que existiera palRoles (o con una versión anterior de la paleta): se deducen los
     roles que de verdad usa el diseño entre la paleta fija y las variaciones de su familia, por cuántos de sus
     colores coinciden (empates: la variación guardada). Sin esto, «Papel» tomaba la paleta fija, que no
     coincide con la variación derivada con que se hizo el diseño, y al cambiar de paleta no recoloreaba. */
  function rolesDelDiseno(st){
    const usados=[st.doc.bg.c1,st.doc.bg.c2];
    st.objects.forEach(o=>{ if(o.type==="text"||o.type==="icon")usados.push(o.color);
      if(o.type==="shape")usados.push(o.fill&&o.fill.c1,o.fill&&o.fill.c2,o.stroke&&o.stroke.c); });
    const cand=[];
    if(FAMILIAS[st.pal])for(let i=0;i<nVars(st.pal);i++)cand.push({R:rolesDe(st.pal,i),pref:i===(st.palVar||0)?0.5:0});
    if(PALETAS[st.pal])cand.push({R:PALETAS[st.pal],pref:0.25});
    if(!cand.length)return PALETAS["Rojo oficial"];
    const puntos=R=>usados.filter(c=>c&&Object.values(R).some(v=>eq(v,c))).length;
    cand.forEach(c=>c.p=puntos(c.R)+c.pref);
    return cand.sort((a,b)=>b.p-a.p)[0].R;
  }
  function remap(cur,tgt){
    const st=E.State.st, bg=st.doc.bg;
    const c1=bg.c1, c2=bg.c2;
    bg.c1=map(c1,cur,tgt,"bg",PRI_RELLENO);
    // un fondo liso (o un degradado de un solo color) sigue siendo liso: su segundo color es el primero
    bg.c2=(bg.type!=="gradient"||eq(c2,c1))?bg.c1:map(c2,cur,tgt,"deep",PRI_RELLENO);
    st.objects.forEach(o=>{
      if(o.type==="text"){ o.color=map(o.color,cur,tgt,null,PRI_TEXTO);
        if(o.colorG)o.colorG.c2=map(o.colorG.c2,cur,tgt,null,PRI_TEXTO);
        if(o.outline)o.outline.color=map(o.outline.color,cur,tgt,null,PRI_TEXTO); }
      if(o.type==="shape"){ const f1=o.fill.c1, f2=o.fill.c2;
        o.fill.c1=map(f1,cur,tgt,null,PRI_RELLENO);
        o.fill.c2=(o.fill.type!=="gradient"||eq(f2,f1))?o.fill.c1:map(f2,cur,tgt,null,PRI_RELLENO);
        o.stroke.c=map(o.stroke.c,cur,tgt); }
      if(o.type==="icon")o.color=map(o.color,cur,tgt,null,PRI_TEXTO);
    });
  }
  /* apply(name): si es la paleta ACTIVA, rota a su siguiente variación;
     si es otra, aplica su 1.ª variación. opts.idx fuerza una variación. */
  function apply(name,silent,opts){
    const st=E.State.st; if(!FAMILIAS[name]&&!PALETAS[name])return;
    const n=nVars(name);
    let idx=opts&&opts.idx!=null ? opts.idx : (name===st.pal && !(opts&&opts.reset) ? (st.palVar||0)+1 : 0);
    idx=((idx%n)+n)%n;
    const cur=st.palRoles||rolesDelDiseno(st);
    const tgt=rolesDe(name,idx);
    remap(cur,tgt);
    st.pal=name; st.palVar=idx; st.palRoles=tgt; E.Render.all();
    if(!silent){ E.History.snap(`Paleta: ${name} ${idx+1}/${n}`);
      toast(n>1?`${name} · combinación ${idx+1}/${n}`:`Combinación: ${name}`); }
  }
  return {apply,rolesDe,nVars,rolesDelDiseno};
})();

/* ====================== BANCO DE IMÁGENES =====================
   Une el banco EMBEBIDO (imgbank.js -> window.BANCO, en base64) con el banco
   VIVO de una carpeta del proyecto, cuando el editor se abre con el servidor
   local (ver editor/servidor/ y abrir-editor.sh). SIN servidor cae al banco
   embebido: el editor sigue funcionando con doble clic sobre editor.html. */
E.Banco=(()=>{
  let servidor=false, viva=null;   // viva = lista del servidor; null => usar window.BANCO
  let salud={};                    // /api/health: {fototeca:true} solo detrás de un sistema que la tenga (Qillqa)
  const http=(location.protocol==="http:"||location.protocol==="https:");
  async function detectar(){
    if(!http){servidor=false;return false;}
    try{const r=await fetch("api/health",{cache:"no-store"});servidor=r.ok;
      salud=r.ok?(await r.json().catch(()=>({}))):{};}catch(_){servidor=false;salud={};}
    return servidor;
  }
  /* ¿El editor corre integrado en un sistema con Fototeca (Qillqa publica el
     estudio en /estudio/ y su /api/health dice fototeca:true)? Solo así aparece
     «Guardar en la Fototeca». Suelto, nada cambia. */
  const fototeca=()=>servidor&&salud&&salud.fototeca===true;
  async function cargar(){
    if(!servidor)return false;
    try{const r=await fetch("api/imagenes",{cache:"no-store"});
      if(r.ok){const arr=await r.json();
        // normalizar a la MISMA forma que el banco embebido: {name, src, credito}
        viva=arr.map(f=>({name:f.name,src:f.url,credito:f.credito||"",carpeta:f.carpeta||""}));
        return true;}
    }catch(_){}
    return false;
  }
  const items=()=> viva || window.BANCO || [];
  const activo=()=> servidor;
  async function urlADataURL(url){           // la foto viaja DENTRO del documento (portable)
    const r=await fetch(url,{cache:"no-store"}); const b=await r.blob();
    return await new Promise((ok,err)=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.onerror=err;fr.readAsDataURL(b);});
  }
  async function fuenteADataURL(src){        // src ya es data URL (embebido) o URL (/banco/…)
    return src.startsWith("data:")?src:await urlADataURL(src);
  }
  async function subir(filename,dataURL){    // guarda el archivo en la carpeta del proyecto
    const r=await fetch("api/imagenes",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({filename,dataURL})});
    if(!r.ok)throw new Error("HTTP "+r.status);
    return await r.json();
  }
  return {detectar,cargar,items,activo,fuenteADataURL,subir,fototeca};
})();

  rail.addEventListener("click",e=>{const b=e.target.closest(".rail-btn");if(!b)return; ir(b.dataset.k);});
